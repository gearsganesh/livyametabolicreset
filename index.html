<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="LIVYA Metabolic — metabolic and obesity management prototype.">
<meta name="theme-color" content="#931A1D">
<title>LIVYA Metabolic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  color-scheme: light;
  --ground:#FAF8F8; --surface:#FFFFFF; --surface-2:#F4F0F0; --surface-3:#EDE7E7;
  --ink:#1B1416; --ink-2:#6E5F62; --ink-3:#9C8C8F;
  --line:#E7DEDF; --line-soft:#F1EAEA;
  --brand:#931A1D; --brand-2:#B33A38; --brand-wash:#FAEFEF; --brand-ink:#7A1416;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#4a3aa7;
  --s1-wash:rgba(42,120,214,.10);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300; --warn-ink:#8A5B00; --serious-ink:#A64A22; --crit-ink:#B32626;
  --good-wash:#E8F5E8; --warn-wash:#FDF3DE; --serious-wash:#FBEAE1; --crit-wash:#FAE6E6;
  --grid:#E9E1E1; --axis:#CDC1C2;
  --shadow:0 1px 2px rgba(27,20,22,.05), 0 8px 24px -12px rgba(27,20,22,.10);
  --r:10px; --r-lg:14px;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#131010; --surface:#1C1817; --surface-2:#252120; --surface-3:#2F2928;
    --ink:#F6F1EF; --ink-2:#BCACAD; --ink-3:#8A7A7C;
    --line:#332B2A; --line-soft:#262120;
    --brand:#E06A63; --brand-2:#F08A83; --brand-wash:#2B1B1B; --brand-ink:#F0938C;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9;
    --s1-wash:rgba(57,135,229,.16);
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --good-ink:#3FBF3F; --warn-ink:#FAC55A; --serious-ink:#F0A07E; --crit-ink:#E86B6B;
    --good-wash:#16260F; --warn-wash:#2E2410; --serious-wash:#2E1F17; --crit-wash:#2E1616;
    --grid:#2A2423; --axis:#3D3534;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#131010; --surface:#1C1817; --surface-2:#252120; --surface-3:#2F2928;
  --ink:#F6F1EF; --ink-2:#BCACAD; --ink-3:#8A7A7C;
  --line:#332B2A; --line-soft:#262120;
  --brand:#E06A63; --brand-2:#F08A83; --brand-wash:#2B1B1B; --brand-ink:#F0938C;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9;
  --s1-wash:rgba(57,135,229,.16);
  --good-ink:#3FBF3F; --warn-ink:#FAC55A; --serious-ink:#F0A07E; --crit-ink:#E86B6B;
  --good-wash:#16260F; --warn-wash:#2E2410; --serious-wash:#2E1F17; --crit-wash:#2E1616;
  --grid:#2A2423; --axis:#3D3534;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ============ CHROME ============ */
.top{position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.top::before{content:"";display:block;height:3px;background:var(--brand)}
.topin{max-width:1240px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.mark b{font-size:19px;font-weight:700;letter-spacing:.16em;color:var(--brand);font-family:var(--sans)}
.mark span{font-family:var(--mono);font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink-3)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;
  font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:.15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}
.icobtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:34px;height:34px;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icobtn:hover{color:var(--ink);border-color:var(--ink-3)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 22px 80px}
h1,h2,h3,.card,.sect,.repcard,.filerow,button{scroll-margin-top:78px}

/* ============ PRIMITIVES ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.eyebrow{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3)}
.sect{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
.sect h2{font-size:16px}
.sect .rule{flex:1;height:1px;background:var(--line)}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.grid{display:grid;gap:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 15px;
  cursor:pointer;font-size:13.5px;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn-p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-p:hover{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:5px 11px;font-size:12.5px}
input,select,textarea{font:inherit;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
label.f{display:block}
label.f>span{display:block;margin-bottom:4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:3px 9px;
  font-size:11.5px;font-weight:600;font-family:var(--mono);letter-spacing:.02em;white-space:nowrap}
.pill.good{background:var(--good-wash);color:var(--good-ink)}
.pill.warn{background:var(--warn-wash);color:var(--warn-ink)}
.pill.serious{background:var(--serious-wash);color:var(--serious-ink)}
.pill.crit{background:var(--crit-wash);color:var(--crit-ink)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;padding:0 10px 7px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
.scrollx{overflow-x:auto}
</style>
<style>
/* ============ PATIENT HEADER ============ */
.phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:16px 20px}
.avatar{width:52px;height:52px;border-radius:13px;background:var(--brand-wash);color:var(--brand-ink);
  display:grid;place-items:center;font-weight:700;font-size:18px;letter-spacing:.04em;flex:none;
  border:1px solid var(--line)}
.phead .who{flex:1;min-width:180px}
.phead .who h1{font-size:21px}
.vitals{display:flex;gap:0;flex-wrap:wrap;margin-top:5px}
.vitals div{padding-right:13px;margin-right:13px;border-right:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.vitals div:last-child{border-right:0;margin-right:0;padding-right:0}
.vitals b{color:var(--ink);font-family:var(--mono);font-weight:500}

/* ============ SCORE GAUGE ============ */
.scorewrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.scoreval{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1;letter-spacing:-.03em}

/* ============ STAT TILES ============ */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 15px 10px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.tile .stripe{position:absolute;left:0;top:0;bottom:0;width:3px}
.tile .lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:18px}
.tile .lbl .eyebrow{white-space:nowrap}
.tile .lbl .pill{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:64%}
.tile .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;
  line-height:1.1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:4px}
.tile .v em{font-style:normal;font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.tile .delta{font-size:12px;font-family:var(--mono);display:flex;align-items:center;gap:5px;margin-top:1px}
.tile .spark{margin-top:6px;height:34px}
.tile .ref{font-size:11px;color:var(--ink-3);font-family:var(--mono)}

/* ============ CHARTS ============ */
.chartcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:16px 18px}
.charthead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.charthead h3{font-size:14.5px}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:9px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
svg.chart{display:block;width:100%;overflow:visible}
svg.chart text{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tipbox{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:8px 11px;box-shadow:0 6px 22px -6px rgba(0,0,0,.28);font-size:12.5px;
  opacity:0;transition:opacity .1s;max-width:250px}
.tipbox.on{opacity:1}
.tipbox .tt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.tipbox .tv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:100px;padding:4px 11px;
  font-size:12px;cursor:pointer;color:var(--ink-2);transition:.14s;white-space:nowrap}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:500}

/* ============ FINDINGS / SUGGESTIONS ============ */
.finding{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line-soft)}
.finding:last-child{border-bottom:0}
.finding .mk{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;font-family:var(--mono)}
.finding h4{font-size:13.5px;margin-bottom:2px}
.finding p{font-size:13px;color:var(--ink-2);line-height:1.5}
.sug{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.sug>header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.sug>header h4{font-size:12.5px;font-family:var(--mono);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.sug ul{margin:0;padding:12px 14px 13px 30px;display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.5}
.sug li::marker{color:var(--brand)}
.sug li b{font-family:var(--mono);font-weight:600}

/* ============ ADMIN ============ */
.drop{border:2px dashed var(--line);border-radius:var(--r-lg);padding:28px 20px;text-align:center;
  background:var(--surface-2);transition:.15s;cursor:pointer}
.drop.hot{border-color:var(--brand);background:var(--brand-wash)}
#chartCard.hot{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-wash),var(--shadow)}
.drop h3{font-size:15px;margin-bottom:4px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
.pcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  padding:13px 14px;cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--brand);transform:translateY(-1px)}
.pcard[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-wash),var(--shadow)}
.pcard b{font-size:14.5px}
.rev td input,.rev td select{padding:5px 8px;font-size:13px;font-family:var(--mono)}
.rev .okmark{color:var(--good-ink)}
.banner{display:flex;gap:11px;align-items:flex-start;border-radius:var(--r);padding:11px 14px;font-size:13px;line-height:1.5}
.banner.info{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.banner.warnb{background:var(--warn-wash);border:1px solid rgba(250,178,25,.35);color:var(--warn-ink)}
.banner.critb{background:var(--crit-wash);border:1px solid rgba(208,59,59,.3);color:var(--crit-ink)}
.banner.goodb{background:var(--good-wash);border:1px solid rgba(12,163,12,.28);color:var(--good-ink)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);z-index:90;
  background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:100px;font-size:13.5px;
  font-weight:500;opacity:0;transition:.2s;pointer-events:none;box-shadow:0 8px 30px -8px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.two{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
.two>*,.three>*,.grid>*{min-width:0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.two,.three{grid-template-columns:1fr}}
.hidden{display:none!important}
details.raw{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
details.raw summary{cursor:pointer;padding:8px 13px;font-size:12.5px;color:var(--ink-2);font-family:var(--mono)}
details.raw pre{margin:0;padding:0 13px 13px;font-size:11px;line-height:1.45;max-height:280px;overflow:auto;
  white-space:pre-wrap;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;align-items:baseline}
.kv dt{color:var(--ink-3);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.crit-list{display:flex;flex-direction:column;gap:1px}
.crit-row{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:13.5px;border-bottom:1px solid var(--line-soft)}
.crit-row:last-child{border-bottom:0}
.crit-row .box{width:17px;height:17px;border-radius:5px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;border:1.5px solid var(--line);color:transparent}
.crit-row.met .box{background:var(--crit);border-color:var(--crit);color:#fff}
.crit-row .val{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
</style>
<style>
/* ============ AUTH ============ */
.authwrap{min-height:100dvh;display:grid;place-items:center;padding:26px 18px;
  background:linear-gradient(180deg,var(--ground),var(--surface-2))}
.authcard{width:100%;max-width:412px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 22px 50px -26px rgba(27,20,22,.32);overflow:hidden}
.authcard>.bar{height:3px;background:var(--brand)}
.authbody{padding:26px 26px 22px}
.authmark{display:flex;align-items:baseline;gap:9px;margin-bottom:20px}
.authmark b{font-size:22px;font-weight:700;letter-spacing:.17em;color:var(--brand)}
.authmark span{font-family:var(--mono);font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink-3)}
.authbody h1{font-size:19px;margin-bottom:4px}
.authbody>p.sub{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-bottom:18px}
.fields{display:flex;flex-direction:column;gap:12px}
.fields label>span{font-size:12px;color:var(--ink-2);margin-bottom:4px;display:block}
.autherr{background:var(--crit-wash);color:var(--crit-ink);border:1px solid rgba(208,59,59,.3);
  border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.45}
.btn-w{width:100%;justify-content:center;padding:10px;font-size:14px}
.demoacc{border-top:1px solid var(--line);background:var(--surface-2);padding:14px 26px 18px}
.demoacc h4{font-size:10px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.demorow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:5px 0;font-size:12px;border-bottom:1px solid var(--line-soft)}
.demorow:last-child{border-bottom:0}
.demorow code{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.demorow button{border:1px solid var(--line);background:var(--surface);border-radius:6px;
  padding:2px 8px;font-size:11px;cursor:pointer;color:var(--ink-2)}
.demorow button:hover{border-color:var(--brand);color:var(--brand)}
.pwmeter{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.pwmeter i{display:block;height:100%;width:0;transition:width .2s,background .2s}

/* ============ SHELL ============ */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.topin.staff .tabs{order:9;flex-basis:100%;min-width:0;margin:2px -4px -3px;padding:7px 4px 0;
  border-top:1px solid var(--line-soft)}
.topin.staff .search{max-width:280px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:7px 10px;border-radius:8px;cursor:pointer;
  font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center}
.tabs button[aria-current="page"]{background:var(--brand-wash);color:var(--brand-ink);font-weight:600}
.tabs button:hover:not([aria-current="page"]){background:var(--surface-2);color:var(--ink)}
.userchip{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 4px;border:1px solid var(--line);
  border-radius:100px;background:var(--surface)}
.userchip .av{width:26px;height:26px;border-radius:50%;background:var(--brand-wash);color:var(--brand-ink);
  display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.userchip .nm{font-size:12.5px;font-weight:500;line-height:1.15;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userchip .rl{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.search{position:relative;flex:1;min-width:130px;max-width:210px}
.search input{padding-left:31px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.roletag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;font-weight:600}
.roletag.admin{background:var(--brand-wash);color:var(--brand-ink)}
.roletag.subadmin{background:var(--surface-3);color:var(--ink-2)}
.roletag.client{background:var(--good-wash);color:var(--good-ink)}

.hit{background:var(--warn-wash);border-radius:3px;padding:0 2px;color:var(--warn-ink);font-weight:600}

.slotlab{font-weight:500;font-size:13px;white-space:nowrap}
.slottime{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;
  font-size:12.5px;cursor:pointer;color:var(--ink-2);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em}

.mealrow{display:flex;gap:14px;padding:12px 15px;border-bottom:1px solid var(--line-soft);align-items:flex-start}

.recipe{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.recipe>header{padding:15px 18px 12px;border-bottom:1px solid var(--line)}

.reqbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px 18px;font-size:12.5px;
  background:var(--crit-wash);color:var(--crit-ink);border-bottom:1px solid var(--line)}
.vidcard{display:flex;gap:13px;align-items:center;text-decoration:none;color:inherit;
  margin:14px 18px 0;padding:12px 15px;border:1px solid var(--line);border-radius:11px;

.vidcard:hover{border-color:var(--brand);background:var(--brand-wash)}
.vidcard.bad{background:var(--warn-wash);border-color:rgba(250,178,25,.4);color:var(--warn-ink);cursor:default}
.vidcard .play{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--brand);color:#fff}
.vidcard .vt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.vidcard .vt b{font-size:13.5px;font-weight:600}
.vidcard .vt span{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.vidcard .vurl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;
  color:var(--ink-3);opacity:.75;user-select:all}
.vidcard .go{font-weight:600;color:var(--brand-ink);white-space:nowrap}
.sharepanel{padding:13px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.sharepanel .allsw{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap;margin-bottom:10px}
.clientgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.clientgrid.dim{opacity:.45;pointer-events:none}
.cpick{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 8px;border-radius:7px;
  background:var(--surface);border:1px solid var(--line)}
.macro{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-2)}

/* ============ MESSAGES ============ */
.inbox{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}

.convo{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-soft);background:transparent;
  display:flex;gap:11px;align-items:center;padding:12px 14px;cursor:pointer;transition:.13s}

.convo:hover{background:var(--surface-2)}
.convo.on{background:var(--brand-wash)}
.convo .av{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:var(--surface-3);color:var(--ink-2);font-size:11px;font-weight:700}
.convo.on .av{background:var(--brand);color:#fff}
.convo .cv{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.convo .crow{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.convo .crow b{font-size:13.5px;font-weight:500}
.convo .prev{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatcard{display:flex;flex-direction:column;overflow:hidden}
.chathead{padding-bottom:12px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.chatscroll{padding:16px 18px;display:flex;flex-direction:column;gap:10px;
  max-height:min(52vh,460px);overflow-y:auto;background:var(--surface-2)}
.daysep{display:flex;align-items:center;gap:10px;margin:6px 0 2px;color:var(--ink-3)}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
.daysep span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.bub{max-width:74%;display:flex;flex-direction:column;gap:2px}
.bub.me{align-self:flex-end;align-items:flex-end}
.bub.them{align-self:flex-start}
.bub .who{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--ink-3);padding:0 4px}
.bub .body{font-size:13.5px;line-height:1.55;padding:9px 13px;border-radius:14px;white-space:pre-wrap;
  border:1px solid var(--line);background:var(--surface)}
.bub.me .body{background:var(--brand);border-color:var(--brand);color:#fff;border-bottom-right-radius:5px}
.bub.them .body{border-bottom-left-radius:5px}
.bub .ts{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);padding:0 5px}
.composer{display:flex;gap:9px;align-items:flex-end;padding:13px 18px 11px;border-top:1px solid var(--line)}
.composer textarea{resize:none;font-size:13.5px;line-height:1.5;min-height:44px}
.composer .btn{flex:none;padding:10px 20px}
.duelist{display:flex;flex-direction:column}
.duerow{display:flex;gap:11px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.duerow:last-child{border-bottom:0}
.duerow .dot{width:8px;height:8px;flex:none}
.duerow .dn{flex:1;min-width:150px;display:flex;flex-direction:column;gap:1px}
.duerow .dn b{font-size:13.5px;font-weight:500}
.duerow .dn span{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.duerow .dl{min-width:120px}
.schedrow{display:grid;grid-template-columns:1.25fr .85fr .9fr auto;gap:8px;align-items:end;
  padding:11px 0;border-bottom:1px solid var(--line-soft)}
.schedrow:last-of-type{border-bottom:0}
.schedrow .full{grid-column:1/-1}
@media(max-width:640px){.schedrow{grid-template-columns:1fr 1fr}}
.mchips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.mchip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:100px;padding:2px 4px 2px 9px;font-size:11.5px;font-family:var(--mono)}
.mchip button{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:13px;line-height:1;padding:0 3px}
.mchip button:hover{color:var(--crit-ink)}
.repcard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.repcard .rd{font-family:var(--mono);font-size:13px;font-weight:600;min-width:110px}
@media(max-width:820px){ .userchip .nm,.userchip .rl{display:none} }
@media(max-width:660px){ .search{order:5;flex-basis:100%;max-width:none} }
@media(max-width:700px){
  .topin{gap:10px}
  .search{max-width:none;order:5;flex-basis:100%}
  .userchip .nm,.userchip .rl{display:none}
}
@media(max-width:640px){
  .sect{flex-wrap:wrap;row-gap:8px}
  .sect .rule{display:none}
  .tabs.card{display:flex!important;width:100%;max-width:100%;overflow-x:auto}
  .grid[style*="1fr 1fr"]{grid-template-columns:1fr!important}
  .phead .who h1{font-size:19px}
  .repcard{gap:8px}
  .filerow{flex-wrap:wrap}
  .filerow .acts{margin-left:44px}
}

<body>
<div id="app"></div>
<div class="tipbox" id="tip"></div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* =========================================================================
   LIVYA METABOLIC — clinical reference layer
   Thresholds use South-Asian / Asian-Indian cutoffs where they differ from
   the international set (BMI, waist, HOMA-IR, ASMI, body-fat). Sources are
   listed in the "Method & sources" panel in the app.
   ========================================================================= */
const R = {}; // marker registry

function band(list){ return v => { for (const b of list) if (v < b.max) return b; return list[list.length-1]; }; }
const S = {good:'good', warn:'warn', serious:'serious', crit:'crit'};

/* ---- helper to register ---- */
function M(key, o){ o.key = key; R[key] = o; return o; }

/* ================= GLYCEMIC ================= */
M('hba1c', {label:'HbA1c', short:'HbA1c', unit:'%', group:'Glycemic', dir:'lower', dec:1,
  sane:[3,18], lsc:0.3, target:'< 5.7 %',
  aliases:['hba1c','hb a1c','glycosylated hemoglobin','glycosylated haemoglobin','glycated hemoglobin',
    'glycated haemoglobin','haemoglobin a1c','hemoglobin a1c','glycohemoglobin','glycosylated hb','a1c'],
  bands: band([{max:5.7,s:S.good,t:'Normal'},{max:6.5,s:S.warn,t:'Prediabetes'},
    {max:8.0,s:S.serious,t:'Diabetes range'},{max:99,s:S.crit,t:'Poor control'}])});

M('glucose_fasting', {label:'Fasting glucose', short:'Fasting glucose', unit:'mg/dL', group:'Glycemic', dir:'lower', dec:0,
  sane:[30,600], lsc:8, target:'70 – 99 mg/dL',
  aliases:['glucose fasting','fasting glucose','glucose, fasting','fasting blood sugar','fasting plasma glucose',
    'plasma glucose fasting','blood sugar fasting','sugar - fasting','fbs','fpg','glucose (fasting)'],
  bands: band([{max:70,s:S.warn,t:'Low'},{max:100,s:S.good,t:'Normal'},{max:126,s:S.warn,t:'Impaired fasting'},
    {max:180,s:S.serious,t:'Diabetes range'},{max:9999,s:S.crit,t:'Markedly high'}])});

M('insulin_fasting', {label:'Fasting insulin', short:'Insulin', unit:'µIU/mL', group:'Glycemic', dir:'lower', dec:1,
  sane:[0.5,300], lsc:2, advisory:true, target:'< 8 µIU/mL (advisory)',
  aliases:['insulin - fasting','insulin fasting','fasting insulin','insulin, fasting','serum insulin fasting'],
  bands: band([{max:8,s:S.good,t:'Normal'},{max:15,s:S.warn,t:'Raised'},{max:25,s:S.serious,t:'High'},
    {max:9999,s:S.crit,t:'Very high'}])});

/* ================= LIPIDS ================= */
M('cholesterol_total', {label:'Total cholesterol', short:'Total chol', unit:'mg/dL', group:'Lipids', dir:'lower', dec:0,
  sane:[50,500], lsc:15, target:'< 200 mg/dL',
  aliases:['cholesterol total','total cholesterol','cholesterol - total','cholesterol, total','serum cholesterol','cholesterol-total'],
  bands: band([{max:200,s:S.good,t:'Desirable'},{max:240,s:S.warn,t:'Borderline high'},{max:9999,s:S.serious,t:'High'}])});

M('ldl', {label:'LDL cholesterol', short:'LDL-C', unit:'mg/dL', group:'Lipids', dir:'lower', dec:0,
  sane:[10,450], lsc:12, target:'< 100 mg/dL',
  aliases:['ldl cholesterol','ldl-c','ldl cholesterol direct','ldl cholesterol - direct','ldl cholesterol calculated',
    'l.d.l. cholesterol','ldl chol','ldl'],
  bands: band([{max:100,s:S.good,t:'Optimal'},{max:130,s:S.warn,t:'Near optimal'},{max:160,s:S.warn,t:'Borderline high'},
    {max:190,s:S.serious,t:'High'},{max:9999,s:S.crit,t:'Very high'}])});

M('hdl', {label:'HDL cholesterol', short:'HDL-C', unit:'mg/dL', group:'Lipids', dir:'higher', dec:0,
  sane:[10,150], lsc:6, target:c=>c.sex==='F' ? '≥ 50 mg/dL' : '≥ 40 mg/dL',
  aliases:['hdl cholesterol','hdl-c','hdl cholesterol direct','hdl cholesterol - direct','h.d.l. cholesterol','direct hdl','hdl'],
  bands: (v,c)=>{ const lo = c.sex==='F'?50:40, mid = c.sex==='F'?60:50;
    if(v<lo) return {s:S.serious,t:'Low'}; if(v<mid) return {s:S.warn,t:'Below optimal'};
    return {s:S.good,t:'Protective'}; }});

M('triglycerides', {label:'Triglycerides', short:'Triglycerides', unit:'mg/dL', group:'Lipids', dir:'lower', dec:0,
  sane:[20,2000], lsc:25, target:'< 150 mg/dL',
  aliases:['triglycerides','triglyceride','serum triglycerides','triglycerides - serum','tg'],
  bands: band([{max:100,s:S.good,t:'Optimal'},{max:150,s:S.good,t:'Normal'},{max:200,s:S.warn,t:'Borderline high'},
    {max:500,s:S.serious,t:'High'},{max:99999,s:S.crit,t:'Very high'}])});

M('non_hdl', {label:'Non-HDL cholesterol', short:'Non-HDL', unit:'mg/dL', group:'Lipids', dir:'lower', dec:0,
  sane:[20,450], lsc:14, target:'< 130 mg/dL',
  aliases:['non hdl cholesterol','non-hdl cholesterol','non - hdl cholesterol','non hdl','non-hdl-c'],
  bands: band([{max:130,s:S.good,t:'Optimal'},{max:160,s:S.warn,t:'Above target'},{max:190,s:S.serious,t:'High'},
    {max:9999,s:S.crit,t:'Very high'}])});

/* ================= LIVER ================= */
M('alt', {label:'ALT (SGPT)', short:'ALT', unit:'U/L', group:'Liver', dir:'lower', dec:0,
  sane:[3,2000], lsc:8, target:c=>c.sex==='F' ? '≤ 19 U/L' : '≤ 30 U/L',
  aliases:['alt (sgpt)','sgpt (alt)','sgpt/alt','alanine transaminase','alanine aminotransferase','sgpt','alt'],
  bands:(v,c)=>{ const a=c.sex==='F'?[19,30,60]:[30,40,80];
    if(v<=a[0]) return {s:S.good,t:'Normal'}; if(v<=a[1]) return {s:S.warn,t:'Upper normal'};
    if(v<=a[2]) return {s:S.serious,t:'Raised'}; return {s:S.crit,t:'Markedly high'}; }});

M('ast', {label:'AST (SGOT)', short:'AST', unit:'U/L', group:'Liver', dir:'lower', dec:0,
  sane:[3,2000], lsc:8, target:c=>c.sex==='F' ? '≤ 31 U/L' : '≤ 35 U/L',
  aliases:['ast (sgot)','sgot (ast)','sgot/ast','aspartate transaminase','aspartate aminotransferase','sgot','ast'],
  bands:(v,c)=>{ const a=c.sex==='F'?[31,40,80]:[35,45,90];
    if(v<=a[0]) return {s:S.good,t:'Normal'}; if(v<=a[1]) return {s:S.warn,t:'Upper normal'};
    if(v<=a[2]) return {s:S.serious,t:'Raised'}; return {s:S.crit,t:'Markedly high'}; }});

M('ggt', {label:'GGT', short:'GGT', unit:'U/L', group:'Liver', dir:'lower', dec:0,
  sane:[3,1500], lsc:8, target:c=>c.sex==='F' ? '< 20 U/L' : '< 30 U/L',
  aliases:['ggtp (gamma gt)','gamma glutamyl transferase','gamma glutamyl transpeptidase','gamma gt','ggtp','ggt'],
  bands:(v,c)=>{ const a=c.sex==='F'?[20,38,90]:[30,55,120];
    if(v<=a[0]) return {s:S.good,t:'Normal'}; if(v<=a[1]) return {s:S.warn,t:'Upper normal'};
    if(v<=a[2]) return {s:S.serious,t:'Raised'}; return {s:S.crit,t:'Markedly high'}; }});

/* ================= OTHER LABS ================= */
M('uric_acid', {label:'Uric acid', short:'Uric acid', unit:'mg/dL', group:'Metabolic', dir:'lower', dec:1,
  sane:[0.5,20], lsc:0.6, target:'< 6.0 mg/dL',
  aliases:['uric acid','serum uric acid','uric acid (uricase)'],
  bands:(v,c)=>{ const a=c.sex==='F'?[5.0,6.0,8.0]:[5.5,7.0,9.0];
    if(v<=a[0]) return {s:S.good,t:'Normal'}; if(v<=a[1]) return {s:S.warn,t:'Upper normal'};
    if(v<=a[2]) return {s:S.serious,t:'Hyperuricaemia'}; return {s:S.crit,t:'Markedly high'}; }});

M('creatinine', {label:'Creatinine', short:'Creatinine', unit:'mg/dL', group:'Renal', dir:'lower', dec:2,
  sane:[0.1,20], lsc:0.15, target:'0.6 – 1.2 mg/dL',
  aliases:['creatinine','serum creatinine','creatinine - serum','creatinine, serum','creatinine (modified jaffe, kinetic)'],
  bands:(v,c)=>{ const hi=c.sex==='F'?1.1:1.3;
    if(v<0.5) return {s:S.warn,t:'Low'}; if(v<=hi) return {s:S.good,t:'Normal'};
    if(v<=hi+0.5) return {s:S.serious,t:'Raised'}; return {s:S.crit,t:'Markedly high'}; }});

M('vitamin_d', {label:'Vitamin D (25-OH)', short:'Vitamin D', unit:'ng/mL', group:'Micronutrient', dir:'higher', dec:1,
