/* =========================================================================
   PDF TEXT EXTRACTOR — dependency-free, runs in the browser.
   Inflates FlateDecode streams with the platform DecompressionStream, walks
   the content-stream text operators, and rebuilds lines from the text matrix
   so column layout survives. Scanned (image-only) PDFs yield no text — the
   app detects that and falls back to paste / manual entry.
   ========================================================================= */
const PDF = (() => {

  function latin1(u8, from, to){ let s=''; const end = to===undefined?u8.length:to;
    for(let i=from||0;i<end;i+=8192) s += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i+8192,end)));
    return s; }

  async function inflateOnce(u8, fmt){
    try{
      const ds = new DecompressionStream(fmt);
      const buf = await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
      if (buf.byteLength) return new Uint8Array(buf);
    }catch(e){}
    return null;
  }
  // DecompressionStream rejects trailing bytes, and PDF writers pad the gap
  // before `endstream` — so try the declared length, then progressively
  // trimmed ends, in both zlib and raw-deflate framing.
  async function inflate(u8, declared){
    const cands = [];
    if(declared>0 && declared<=u8.length) cands.push(u8.subarray(0, declared));
    let e = u8.length;
    while(e>0 && (u8[e-1]===10||u8[e-1]===13||u8[e-1]===32||u8[e-1]===0)) e--;
    if(e!==u8.length && e>0) cands.push(u8.subarray(0, e));
    cands.push(u8);
    for(const c of cands){
      for(const fmt of ['deflate','deflate-raw']){
        const r = await inflateOnce(c, fmt);
        if(r) return r;
      }
    }
    return null;
  }

  /* ---- CMap (ToUnicode) parsing: bfchar / bfrange ---- */
  function parseCMap(txt, into){
    let m, re = /beginbfchar([\s\S]*?)endbfchar/g;
    while((m = re.exec(txt))){
      const pairs = m[1].match(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g) || [];
      for(const p of pairs){
        const q = p.match(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/);
        into.set(parseInt(q[1],16), hexToStr(q[2]));
      }
    }
    re = /beginbfrange([\s\S]*?)endbfrange/g;
    while((m = re.exec(txt))){
      const body = m[1];
      const rr = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g; let r;
      while((r = rr.exec(body))){
        const lo=parseInt(r[1],16), hi=parseInt(r[2],16), base=parseInt(r[3],16);
        if(hi-lo > 4096) continue;
        for(let c=lo;c<=hi;c++) into.set(c, String.fromCharCode(base + (c-lo)));
      }
    }
  }
  function hexToStr(h){ let s=''; for(let i=0;i<h.length;i+=4){ const c=parseInt(h.substr(i,4),16); if(c) s+=String.fromCharCode(c);} return s; }

  /* ---- string decoding with encoding fallback ---- */
  function printableScore(s){ let n=0; for(const ch of s){ const c=ch.charCodeAt(0);
      if((c>=32&&c<127)||c===9) n++; } return s.length? n/s.length : 0; }

  function decodeBytes(bytes, cmap){
    const direct = latin1(bytes);
    if (printableScore(direct) > 0.75) return direct;
    if (cmap && cmap.size){
      let two='', hits=0, n=0;
      for(let i=0;i+1<bytes.length;i+=2){ const code=(bytes[i]<<8)|bytes[i+1]; n++;
        const g=cmap.get(code); if(g!==undefined){ two+=g; hits++; } else two+=' '; }
      if(n && hits/n > 0.5) return two;
      let one='', h2=0;
      for(let i=0;i<bytes.length;i++){ const g=cmap.get(bytes[i]); if(g!==undefined){ one+=g; h2++; } else one+=String.fromCharCode(bytes[i]); }
      if(bytes.length && h2/bytes.length > 0.5) return one;
    }
    return direct;
  }

  /* ---- content-stream tokenizer + text walker ---- */
  function walkContent(u8, cmap, runs){
    const n = u8.length;
    let i = 0;
    const stack = [];                    // operand stack
    let ctm = [1,0,0,1,0,0];
    const gsStack = [];
    let tm = null, tlm = null, leading = 0, fsize = 12, hscale = 1;
    const mul = (a,b)=>[ a[0]*b[0]+a[1]*b[2], a[0]*b[1]+a[1]*b[3],
                         a[2]*b[0]+a[3]*b[2], a[2]*b[1]+a[3]*b[3],
                         a[4]*b[0]+a[5]*b[2]+b[4], a[4]*b[1]+a[5]*b[3]+b[5] ];

    function emit(bytes){
      if(!tm) return;
      const m = mul(tm, ctm);
      const txt = decodeBytes(bytes, cmap);
      if(!txt.trim()) { advance(txt.length); return; }
      const scale = Math.hypot(m[0], m[1]) || 1;
      runs.push({ x:m[4], y:m[5], t:txt, sz: fsize*scale });
      advance(txt.length);
    }
    function advance(chars){
      if(!tm) return;
      const w = chars * fsize * 0.5 * hscale;
      tm = mul([1,0,0,1,w,0], tm);
    }

    function readString(){          // literal ( ... )
      const out = [];
      let depth = 1; i++;
      while(i<n){
        const c = u8[i];
        if(c===0x5C){ // backslash
          const d = u8[i+1];
          const map = {0x6E:10,0x72:13,0x74:9,0x62:8,0x66:12};
          if(d in map){ out.push(map[d]); i+=2; }
          else if(d>=0x30 && d<=0x37){ let oct=''; let k=i+1;
            while(k<n && oct.length<3 && u8[k]>=0x30 && u8[k]<=0x37){ oct+=String.fromCharCode(u8[k]); k++; }
            out.push(parseInt(oct,8)&0xFF); i=k; }
          else if(d===0x0A){ i+=2; }
          else if(d===0x0D){ i+= (u8[i+2]===0x0A?3:2); }
          else { out.push(d); i+=2; }
        } else if(c===0x28){ depth++; out.push(c); i++; }
        else if(c===0x29){ depth--; i++; if(!depth) break; out.push(c); }
        else { out.push(c); i++; }
      }
      return new Uint8Array(out);
    }
    function readHex(){
      i++; let h='';
      while(i<n && u8[i]!==0x3E){ const ch=String.fromCharCode(u8[i]); if(/[0-9A-Fa-f]/.test(ch)) h+=ch; i++; }
      i++;
      if(h.length%2) h+='0';
      const out = new Uint8Array(h.length/2);
      for(let k=0;k<out.length;k++) out[k]=parseInt(h.substr(k*2,2),16);
      return out;
    }

    const isWS = c => c===32||c===10||c===13||c===9||c===0||c===12;
    const isDelim = c => c===0x28||c===0x29||c===0x3C||c===0x3E||c===0x5B||c===0x5D||c===0x7B||c===0x7D||c===0x2F||c===0x25;

    while(i<n){
      const c = u8[i];
      if(isWS(c)){ i++; continue; }
      if(c===0x25){ while(i<n && u8[i]!==10 && u8[i]!==13) i++; continue; }      // comment
      if(c===0x28){ stack.push({s:readString()}); continue; }
      if(c===0x3C && u8[i+1]!==0x3C){ stack.push({s:readHex()}); continue; }
      if(c===0x3C && u8[i+1]===0x3C){ // dict — skip to matching >>
        let d=0; while(i<n){ if(u8[i]===0x3C&&u8[i+1]===0x3C){d++;i+=2;} else if(u8[i]===0x3E&&u8[i+1]===0x3E){d--;i+=2; if(!d) break;} else i++; }
        continue; }
      if(c===0x5B){ stack.push('['); i++; continue; }
      if(c===0x5D){ // collect array
        const arr=[]; while(stack.length && stack[stack.length-1]!=='[') arr.unshift(stack.pop());
        stack.pop(); stack.push({arr}); i++; continue; }
      if(c===0x2F){ i++; let name=''; while(i<n && !isWS(u8[i]) && !isDelim(u8[i])){ name+=String.fromCharCode(u8[i]); i++; }
        stack.push({name}); continue; }
      // number or operator
      let tok=''; while(i<n && !isWS(u8[i]) && !isDelim(u8[i])){ tok+=String.fromCharCode(u8[i]); i++; }
      if(!tok){ i++; continue; }
      if(/^[-+]?[\d.]+$/.test(tok)){ stack.push(parseFloat(tok)||0); continue; }

      const num = k => { const v = stack[stack.length-k]; return typeof v==='number'? v : 0; };
      switch(tok){
        case 'q': gsStack.push(ctm.slice()); break;
        case 'Q': if(gsStack.length) ctm = gsStack.pop(); break;
        case 'cm': ctm = mul([num(6),num(5),num(4),num(3),num(2),num(1)], ctm); break;
        case 'BT': tm = [1,0,0,1,0,0]; tlm = tm.slice(); break;
        case 'ET': tm = null; break;
        case 'Tf': fsize = num(1) || 12; break;
        case 'TL': leading = num(1); break;
        case 'Tz': hscale = (num(1)||100)/100; break;
        case 'Td': tlm = mul([1,0,0,1,num(2),num(1)], tlm||[1,0,0,1,0,0]); tm = tlm.slice(); break;
        case 'TD': leading = -num(1); tlm = mul([1,0,0,1,num(2),num(1)], tlm||[1,0,0,1,0,0]); tm = tlm.slice(); break;
        case 'Tm': tlm = [num(6),num(5),num(4),num(3),num(2),num(1)]; tm = tlm.slice(); break;
        case 'T*': tlm = mul([1,0,0,1,0,-leading], tlm||[1,0,0,1,0,0]); tm = tlm.slice(); break;
        case 'Tj': case "'": case '"': {
          if(tok!=='Tj'){ tlm = mul([1,0,0,1,0,-leading], tlm||[1,0,0,1,0,0]); tm = tlm.slice(); }
          const top = stack[stack.length-1];
          if(top && top.s) emit(top.s);
          break; }
        case 'TJ': {
          const top = stack[stack.length-1];
          if(top && top.arr) for(const el of top.arr){
            if(el && el.s) emit(el.s);
            else if(typeof el==='number' && el < -120) advance(0.35);
          }
          break; }
      }
      stack.length = 0;
    }
  }

  /* ---- assemble runs into layout-preserving lines ---- */
  function toLines(runs){
    if(!runs.length) return [];
    const rows = new Map();
    for(const r of runs){
      const key = Math.round(r.y / 2.2);
      if(!rows.has(key)) rows.set(key, []);
      rows.get(key).push(r);
    }
    const keys = [...rows.keys()].sort((a,b)=>b-a);
    const out = [];
    for(const k of keys){
      const segs = rows.get(k).sort((a,b)=>a.x-b.x);
      let text = '', lastEnd = null;
      const cols = [];
      for(const s of segs){
        const t = s.t.replace(/\s+/g,' ');
        if(!t.trim()) continue;
        if(lastEnd !== null){
          const gap = s.x - lastEnd;
          if(gap > s.sz*2.2) text += '   ';
          else if(gap > s.sz*0.22 || !/\s$/.test(text)) text += ' ';
        }
        cols.push({x:s.x, t:t.trim()});
        text += t;
        lastEnd = s.x + t.length * s.sz * 0.5;
      }
      text = text.replace(/[ ]{4,}/g,'   ').trim();
      if(text) out.push({y: rows.get(k)[0].y, text, cols});
    }
    return out;
  }

  async function extract(arrayBuffer){
    const u8 = new Uint8Array(arrayBuffer);
    const s = latin1(u8);
    const cmap = new Map();
    const contentBufs = [];
    let idx = 0, guard = 0;
    while(guard++ < 4000){
      const st = s.indexOf('stream', idx);
      if(st < 0) break;
      // dictionary text just before the stream keyword
      const objStart = Math.max(0, s.lastIndexOf('obj', st));
      const dict = s.slice(objStart, st);
      let p = st + 6;
      if(s[p]==='\r') p++;
      if(s[p]==='\n') p++;
      const en = s.indexOf('endstream', p);
      idx = (en<0? st+6 : en+9);
      if(en < 0) continue;
      if(/\/Image|\/DCTDecode|\/JPXDecode|\/CCITTFaxDecode|\/JBIG2Decode/.test(dict)) continue;
      const lm = dict.match(/\/Length\s+(\d+)(?!\s+\d+\s+R)/);
      const declared = lm ? +lm[1] : 0;
      let raw = u8.subarray(p, en);
      let data = raw;
      if(/\/FlateDecode/.test(dict)){
        if(/\/Predictor/.test(dict)) continue;               // xref / image predictors — not text
        data = await inflate(raw, declared);
        if(!data) continue;
      } else if(/\/Filter/.test(dict)) continue;             // unsupported filter
      const head = latin1(data, 0, Math.min(3000, data.length));
      if(/beginbfchar|beginbfrange/.test(head) || /begincmap/.test(head)) parseCMap(latin1(data), cmap);
      if(/\bBT\b/.test(head) || /\bTj\b|\bTJ\b/.test(head)) contentBufs.push(data);
      else if(data.length < 400000 && /\bBT\b/.test(latin1(data))) contentBufs.push(data);
    }
    const runs = [];
    for(let pi=0; pi<contentBufs.length; pi++){
      const before = runs.length;
      try{ walkContent(contentBufs[pi], cmap, runs); }catch(e){}
      // keep pages from colliding when rows are grouped by y
      for(let k=before;k<runs.length;k++) runs[k].y -= pi*100000;
    }
    const lines = toLines(runs);
    return { lines, text: lines.map(l=>l.text).join('\n'), runCount: runs.length };
  }

  return { extract };
})();

/* =========================================================================
   REPORT PARSER — maps extracted text lines onto the marker registry.
   Handles the layouts of Indian diagnostic labs (Lal PathLabs, Thyrocare,
   Metropolis, SRL, Apollo, Redcliffe), InBody / Tanita sheets and DEXA
   body-composition tables, including reversed column order, result flags,
   and the two well-known unit traps (Vitamin D, T3).
   ========================================================================= */
const PARSE = (() => {

  const norm = s => s
    .replace(/\u00B5|\u03BC/g,'µ').replace(/[\u2010-\u2015\u2212]/g,'-')
    .replace(/\u00A0/g,' ').replace(/[²]/g,'2').replace(/\s+/g,' ').trim();

  // alias index, longest first so "non hdl cholesterol" beats "hdl"
  const INDEX = [];
  for(const m of MARKERS) for(const a of (m.aliases||[])) INDEX.push({a: a.toLowerCase(), key: m.key, len: a.length});
  INDEX.sort((x,y)=> y.len - x.len);

  const STOP = /\b(interpretation|comment|conditions of reporting|end of report|disclaimer|advice|technical|kindly correlate|method\b)/i;
  const RATIO = /\bratio\b/i;
  const HEADER = /\b(test name|investigation|bio\.? ?ref|reference range|biological ref|observed value|units?\b.*\brange)\b/i;

  const CONV = {
    vitamin_d:   [{u:/nmol\/l/i, f:v=>v/2.496}],
    glucose_fasting: [{u:/mmol\/l/i, f:v=>v*18.0182}],
    cholesterol_total:[{u:/mmol\/l/i, f:v=>v*38.67}],
    ldl:         [{u:/mmol\/l/i, f:v=>v*38.67}],
    hdl:         [{u:/mmol\/l/i, f:v=>v*38.67}],
    non_hdl:     [{u:/mmol\/l/i, f:v=>v*38.67}],
    triglycerides:[{u:/mmol\/l/i, f:v=>v*88.57}],
    hba1c:       [{u:/mmol\/mol/i, f:v=>(v/10.929)+2.15}],
    creatinine:  [{u:/umol\/l|µmol\/l/i, f:v=>v/88.4}],
    uric_acid:   [{u:/umol\/l|µmol\/l/i, f:v=>v/59.48}],
    vitamin_b12: [{u:/pmol\/l/i, f:v=>v/0.738}],
    hs_crp:      [{u:/mg\/dl/i, f:v=>v*10}],
    weight:      [{u:/\blbs?\b/i, f:v=>v*0.453592}],
    fat_mass:    [{u:/\blbs?\b/i, f:v=>v*0.453592}],
    lean_body_mass:[{u:/\blbs?\b/i, f:v=>v*0.453592}],
    skeletal_muscle_mass:[{u:/\blbs?\b/i, f:v=>v*0.453592}],
    bmr:         [{u:/\bkj\b/i, f:v=>v/4.184}],
  };

  const UNIT_RE = /(mg\/dl|mmol\/l|mmol\/mol|µiu\/ml|uiu\/ml|miu\/l|iu\/ml|ng\/ml|ng\/dl|pg\/ml|pmol\/l|nmol\/l|µmol\/l|umol\/l|u\/l|iu\/l|g\/dl|gm\/dl|mg\/l|kcal|kj|cm2|cm|kg|lbs?|%|bpm|mmhg|ml\/min[^ ]*)/i;

  function numbersIn(str){
    const s = ' ' + str + ' ';
    const out = [];
    const re = /(?:^|[\s(:=|])([<>≤≥]?\s?-?\d{1,7}(?:[.,]\d{1,3})?)(?=[\s)%*a-zA-Z\/|]|$)/g;
    let m;
    while((m = re.exec(s))){
      const raw = m[1].replace(/\s/g,'');
      const v = parseFloat(raw.replace(/[<>≤≥]/,'').replace(',', '.'));
      if(!isNaN(v)) out.push({v, i: m.index, raw});
    }
    return out;
  }

  // strip printed reference intervals so they are not mistaken for the result
  function stripRanges(str){
    return str
      .replace(/\d+(?:\.\d+)?\s*-\s*\d+(?:\.\d+)?/g, ' \u0001 ')
      .replace(/(?:up ?to|upto|<=|>=|≤|≥|<|>)\s*\d+(?:\.\d+)?/gi, ' \u0001 ');
  }

  function parseLines(lines, opts){
    const found = {};      // key -> {value, unit, raw, line}
    const notes = [];
    let stopped = false;
    for(const L of lines){
      const line = norm(L.text || L);
      if(!line) continue;
      if(/end of report/i.test(line)) stopped = true;
      if(stopped) continue;
      if(HEADER.test(line) && !/\d/.test(line)) continue;
      if(STOP.test(line) && !/^\s*(alt|ast|ggt)\b/i.test(line)) continue;

      const low = line.toLowerCase();
      let hit = null;
      for(const e of INDEX){
        const at = low.indexOf(e.a);
        if(at < 0) continue;
        // require a word boundary on both sides
        const before = at===0 ? ' ' : low[at-1];
        const after  = low[at+e.a.length] === undefined ? ' ' : low[at+e.a.length];
        if(/[a-z0-9]/.test(before) || /[a-z0-9]/.test(after)) continue;
        hit = {e, at}; break;
      }
      if(!hit) continue;
      const mk = R[hit.e.key];
      if(RATIO.test(line) && !/ratio/.test(mk.label.toLowerCase())) continue;
      const preferred = (mk.prefer||[]).includes(hit.e.a);
      if(found[mk.key] && !(preferred && !found[mk.key].preferred)) continue;   // first occurrence wins unless a canonical label turns up later

      const after = line.slice(hit.at + hit.e.a.length);
      const before = line.slice(0, hit.at);
      const um = (after.match(UNIT_RE) || before.match(UNIT_RE) || [])[0] || '';

      let cands = numbersIn(stripRanges(after));
      let val = cands.length ? cands[0].v : null;
      if(val === null){                                  // reversed column order
        cands = numbersIn(stripRanges(before));
        val = cands.length ? cands[cands.length-1].v : null;
      }
      if(val === null || !isFinite(val)) continue;

      // unit conversion
      const conv = CONV[mk.key];
      if(conv && um) for(const c of conv) if(c.u.test(um)) val = c.f(val);
      // Vitamin D with no printed unit: infer from the printed reference interval
      if(mk.key==='vitamin_d' && !um && /75\s*-\s*250/.test(line)) val = val/2.496;

      const [lo,hi] = mk.sane;
      if(val < lo || val > hi){ notes.push(`${mk.label}: "${line.slice(0,60)}" gave ${val} ${mk.unit} — outside the plausible range, skipped.`); continue; }
      found[mk.key] = { value: Math.round(val*1000)/1000, unit: um, line, preferred };
    }
    return { found, notes };
  }

  function parseDemographics(text){
    const d = {};
    let m;
    if((m = text.match(/(?:patient\s*)?name\s*[:.\-]?\s*(?:m(?:r|s|rs)\.?\s*)?([A-Za-z][A-Za-z .'\-]{2,44})/i))){
      d.name = m[1].split(/\s+(?:age|sex|gender|dob|date|ref|lab|uhid|id|pid|mrn|years?|yrs?)\b/i)[0].trim().replace(/\s+/g,' ');
      if(d.name.length<3) delete d.name;
    }
    if((m = text.match(/\bage\s*[:.\-]?\s*(\d{1,3})/i))) d.age = +m[1];
    else if((m = text.match(/\b(\d{1,3})\s*(?:y(?:ea)?rs?|y\b)/i))) d.age = +m[1];
    if((m = text.match(/\b(?:sex|gender)\s*[:.\-]?\s*(male|female|m\b|f\b)/i))) d.sex = /^f/i.test(m[1]) ? 'F' : 'M';
    if((m = text.match(/\b(?:height)\s*[:.\-]?\s*(\d{2,3}(?:\.\d)?)\s*cm/i))) d.height = +m[1];
    const dm = text.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/) ||
               text.match(/\b(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(\d{4})\b/i);
    if(dm){
      let y, mo, day;
      if(isNaN(+dm[2])){ const MO='janfebmaraprmayjunjulaugsepoctnovdec'.indexOf(dm[2].toLowerCase().slice(0,3))/3;
        day=+dm[1]; mo=MO; y=+dm[3]; }
      else { day=+dm[1]; mo=+dm[2]-1; y=+dm[3]; if(y<100) y+=2000; }
      if(y>1990 && y<2100 && mo>=0 && mo<12) d.date = new Date(Date.UTC(y,mo,day)).toISOString().slice(0,10);
    }
    return d;
  }

  function detectSource(text){
    const t = text.toLowerCase();
    if(/inbody/.test(t)) return 'InBody body composition';
    if(/tanita/.test(t)) return 'Tanita body composition';
    if(/hologic|lunar|encore|dxa|dexa|bmd/.test(t)) return 'DEXA scan';
    if(/thyrocare/.test(t)) return 'Thyrocare lab report';
    if(/lal path/.test(t)) return 'Dr Lal PathLabs report';
    if(/metropolis/.test(t)) return 'Metropolis lab report';
    if(/redcliffe/.test(t)) return 'Redcliffe lab report';
    if(/apollo/.test(t)) return 'Apollo Diagnostics report';
    if(/srl/.test(t)) return 'SRL Diagnostics report';
    if(/haemoglobin|biochemistry|bio\. ?ref|pathology/.test(t)) return 'Laboratory report';
    return 'Health report';
  }

  return { parseLines, parseDemographics, detectSource, norm };
})();

/* =========================================================================
   CLINICAL ENGINE — derived indices, the LIVYA Metabolic Score, change
   analysis against least-significant-change thresholds, and the suggestion
   generator keyed to gender, age and height.
   ========================================================================= */
const ENGINE = (() => {
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lin=(v,best,worst)=>{ if(v==null||!isFinite(v)) return null;
    const t=(v-worst)/(best-worst); return clamp(t,0,1)*100; };

  function derive(p, v){
    const V = Object.assign({}, v.values);
    const h = (p.height||170)/100, get = k => (typeof V[k]==='number' ? V[k] : null);

    if(get('weight') && !get('bmi')) V.bmi = round(get('weight')/(h*h),1);
    if(get('weight') && get('body_fat_pct')){
      if(!get('fat_mass')) V.fat_mass = round(get('weight')*get('body_fat_pct')/100,1);
      if(!get('lean_body_mass')) V.lean_body_mass = round(get('weight')-V.fat_mass,1);
    }
    if(get('weight') && get('lean_body_mass') && !get('body_fat_pct'))
      V.body_fat_pct = round((1-get('lean_body_mass')/get('weight'))*100,1);

    const d = {};
    if(get('lean_body_mass')) d.ffmi = round(get('lean_body_mass')/(h*h),1);
    if(get('skeletal_muscle_mass')) d.smi = round(get('skeletal_muscle_mass')/(h*h),2);
    if(get('waist')) d.whtr = round(get('waist')/(p.height||170),3);
    if(get('waist') && get('hip')) d.whr = round(get('waist')/get('hip'),2);
    if(get('glucose_fasting') && get('insulin_fasting'))
      d.homa_ir = round(get('glucose_fasting')*get('insulin_fasting')/405,2);
    if(get('triglycerides') && get('glucose_fasting'))
      d.tyg = round(Math.log(get('triglycerides')*get('glucose_fasting')/2),2);
    if(get('triglycerides') && get('hdl')) d.tg_hdl = round(get('triglycerides')/get('hdl'),2);
    if(get('ast') && get('alt')) d.ast_alt = round(get('ast')/get('alt'),2);
    if(get('hba1c')) d.eag = Math.round(28.7*get('hba1c')-46.7);
    if(get('cholesterol_total') && get('hdl') && !get('non_hdl'))
      V.non_hdl = Math.round(get('cholesterol_total')-get('hdl'));
    if(get('visceral_fat_level') && !get('visceral_fat_area'))
      d.vfa_est = Math.round(get('visceral_fat_level')*10);
    if(get('weight')) d.bmr_mifflin = Math.round(10*get('weight')+6.25*(p.height||170)-5*(p.age||40)+(p.sex==='F'?-161:5));
    if(get('lean_body_mass')) d.bmr_katch = Math.round(370+21.6*get('lean_body_mass'));
    if(get('ast') && get('alt') && get('platelets') && p.age)
      d.fib4 = round(p.age*get('ast')/(get('platelets')*Math.sqrt(get('alt'))),2);

    // harmonised metabolic-syndrome criteria, South-Asian waist cutoffs
    const ms = [];
    const wc = get('waist');
    ms.push({k:'Central obesity', met: wc!=null && wc >= (p.sex==='F'?80:90),
      val: wc!=null ? `${wc} cm` : (V.bmi!=null? `waist not measured (BMI ${V.bmi})` : 'not measured'),
      cut: p.sex==='F'?'≥ 80 cm':'≥ 90 cm', known: wc!=null});
    ms.push({k:'Triglycerides', met: get('triglycerides')>=150,
      val: get('triglycerides')!=null?`${get('triglycerides')} mg/dL`:'not measured', cut:'≥ 150 mg/dL', known:get('triglycerides')!=null});
    ms.push({k:'HDL cholesterol', met: get('hdl')!=null && get('hdl') < (p.sex==='F'?50:40),
      val: get('hdl')!=null?`${get('hdl')} mg/dL`:'not measured', cut: p.sex==='F'?'< 50 mg/dL':'< 40 mg/dL', known:get('hdl')!=null});
    ms.push({k:'Blood pressure', met: (get('sbp')>=130 || get('dbp')>=85),
      val: get('sbp')!=null?`${get('sbp')}/${get('dbp')??'—'} mmHg`:'not measured', cut:'≥ 130 / 85 mmHg', known:get('sbp')!=null});
    ms.push({k:'Fasting glucose', met: get('glucose_fasting')>=100,
      val: get('glucose_fasting')!=null?`${get('glucose_fasting')} mg/dL`:'not measured', cut:'≥ 100 mg/dL', known:get('glucose_fasting')!=null});
    d.msyn = { criteria: ms, count: ms.filter(c=>c.met).length, known: ms.filter(c=>c.known).length };

    return { values: V, derived: d };
  }

  function score(p, V, d){
    const g = k => (typeof V[k]==='number' ? V[k] : null);
    const dom = [];
    const push=(name,w,s,detail)=>{ if(s!=null) dom.push({name,w,s:Math.round(s),detail}); };

    // Glycaemic
    let gly = null;
    if(g('hba1c')!=null) gly = lin(g('hba1c'), 5.2, 8.5);
    else if(g('glucose_fasting')!=null) gly = lin(g('glucose_fasting'), 85, 160);
    if(gly!=null && d.homa_ir!=null) gly = gly*0.7 + lin(d.homa_ir, 1.0, 5.0)*0.3;
    push('Glycaemic control', 22, gly, g('hba1c')!=null?`HbA1c ${g('hba1c')} %`:`Fasting glucose ${g('glucose_fasting')} mg/dL`);

    // Lipids
    const parts=[];
    if(g('non_hdl')!=null) parts.push(lin(g('non_hdl'), 100, 210));
    if(g('triglycerides')!=null) parts.push(lin(g('triglycerides'), 80, 300));
    if(g('hdl')!=null) parts.push(lin(g('hdl'), p.sex==='F'?65:55, p.sex==='F'?35:30));
    push('Lipids', 18, parts.length? parts.reduce((a,b)=>a+b,0)/parts.length : null,
      g('non_hdl')!=null?`Non-HDL ${g('non_hdl')} mg/dL`:'from lipid panel');

    // Adiposity
    const ad=[];
    if(d.whtr!=null) ad.push(lin(d.whtr, 0.45, 0.65));
    if(g('body_fat_pct')!=null) ad.push(lin(g('body_fat_pct'), p.sex==='F'?27:16, p.sex==='F'?46:36));
    const vfa = g('visceral_fat_area') ?? d.vfa_est;
    if(vfa!=null) ad.push(lin(vfa, 55, 165));
    if(!ad.length && g('bmi')!=null) ad.push(lin(g('bmi'), 21.5, 34));
    push('Adiposity', 25, ad.length? ad.reduce((a,b)=>a+b,0)/ad.length : null,
      g('body_fat_pct')!=null?`Body fat ${g('body_fat_pct')} %`:(g('bmi')!=null?`BMI ${g('bmi')}`:''));

    // Liver
    const lv=[];
    if(g('alt')!=null) lv.push(lin(g('alt'), p.sex==='F'?14:20, p.sex==='F'?55:80));
    if(g('ggt')!=null) lv.push(lin(g('ggt'), p.sex==='F'?14:20, p.sex==='F'?70:110));
    push('Liver', 12, lv.length? lv.reduce((a,b)=>a+b,0)/lv.length : null, g('alt')!=null?`ALT ${g('alt')} U/L`:'');

    // Blood pressure
    let bp=null;
    if(g('sbp')!=null){ const a=lin(g('sbp'),112,165), b=g('dbp')!=null?lin(g('dbp'),72,102):a; bp=Math.min(a,b); }
    push('Blood pressure', 13, bp, g('sbp')!=null?`${g('sbp')}/${g('dbp')??'—'} mmHg`:'');

    // Lifestyle / wearable
    const ls=[];
    if(g('steps')!=null) ls.push(lin(g('steps'), 11000, 3000));
    if(g('sleep_hours')!=null) ls.push(lin(Math.min(g('sleep_hours'),8.5), 7.5, 5));
    if(g('resting_hr')!=null) ls.push(lin(g('resting_hr'), 58, 92));
    push('Activity & recovery', 10, ls.length? ls.reduce((a,b)=>a+b,0)/ls.length : null,
      g('steps')!=null?`${fmtInt(g('steps'))} steps/day`:'');

    if(!dom.length) return { total:null, domains:[] };
    const wsum = dom.reduce((a,b)=>a+b.w,0);
    const total = Math.round(dom.reduce((a,b)=>a+b.s*b.w,0)/wsum);
    return { total, domains: dom, coverage: Math.round(wsum/100*100) };
  }

  function grade(s){
    if(s==null) return {t:'—', s:'neutral'};
    if(s>=80) return {t:'Excellent', s:'good'};
    if(s>=65) return {t:'Good', s:'good'};
    if(s>=50) return {t:'Fair', s:'warn'};
    if(s>=35) return {t:'Needs attention', s:'serious'};
    return {t:'High risk', s:'crit'};
  }

  /* ---- change analysis between two visits ---- */
  function changes(p, a, b){          // a = earlier, b = later
    const out = [];
    for(const m of MARKERS){
      const va = a.values[m.key], vb = b.values[m.key];
      if(typeof va!=='number' || typeof vb!=='number') continue;
      const delta = vb - va;
      const pct = va ? (delta/va)*100 : 0;
      const meaningful = Math.abs(delta) >= (m.lsc || 0);
      let dir = 'flat';
      if(meaningful) dir = (m.dir==='higher' ? (delta>0?'better':'worse')
                          : m.dir==='lower' ? (delta<0?'better':'worse') : 'changed');
      out.push({ key:m.key, m, from:va, to:vb, delta:round(delta,2), pct:round(pct,1), meaningful, dir });
    }
    return out;
  }

  /* ---- weight-loss quality: how much of the loss was fat? ---- */
  function lossQuality(a, b){
    const wa=a.values.weight, wb=b.values.weight, fa=a.values.fat_mass, fb=b.values.fat_mass;
    if([wa,wb,fa,fb].some(x=>typeof x!=='number')) return null;
    const dW = wa-wb, dF = fa-fb, dL = dW-dF;
    if(Math.abs(dW) < 0.8) return null;
    const fatShare = dW>0 ? clamp(dF/dW,-1,1.5) : null;
    return { dW: round(dW,1), dF: round(dF,1), dL: round(dL,1), fatShare: fatShare!=null? round(fatShare*100,0):null, gaining: dW<0 };
  }

  const round=(v,n)=>{ const f=Math.pow(10,n); return Math.round(v*f)/f; };
  const fmtInt = v => v==null?'—':v.toLocaleString('en-IN');

  return { derive, score, grade, changes, lossQuality, lin, round };
})();
function round(v,n){ const f=Math.pow(10,n||0); return Math.round(v*f)/f; }
function fmtInt(v){ return v==null?'—':Number(v).toLocaleString('en-IN'); }

/* =========================================================================
   ADVISOR — turns the numbers into ranked findings and a personalised plan.
   Every recommendation is derived from this patient's gender, age, height,
   current values and the change since the last visit. Rules only: no value
   is invented, and each card names the number it came from.
   ========================================================================= */
const ADVISOR = (() => {
  const RANK = {crit:0, serious:1, warn:2, good:3, neutral:4};

  function statusOf(key, val, ctx){
    const m = R[key]; if(!m || val==null || m.noStatus) return null;
    const b = typeof m.bands==='function' ? m.bands(val, ctx) : null;
    return b || null;
  }

  function findings(p, cur, prev, base){
    const V = cur.values, D = cur.derived, ctx = {sex:p.sex, age:p.age};
    const out = [];
    const add = (sev, title, body, score) => out.push({sev, title, body, score: score ?? (100-RANK[sev]*20)});

    // 1. Out-of-range markers, worst first
    for(const m of MARKERS){
      const v = V[m.key]; if(typeof v!=='number' || m.noStatus) continue;
      const b = statusOf(m.key, v, ctx); if(!b) continue;
      if(b.s==='good') continue;
      const tgt = typeof m.target==='function' ? m.target(ctx) : m.target;
      add(b.s, `${m.label} — ${b.t}`,
        `${fmtV(m,v)} ${m.unit}. Target ${tgt}.${m.advisory?' Advisory marker — no guideline-endorsed cutoff.':''}`,
        (b.s==='crit'?100:b.s==='serious'?85:65));
    }

    // 2. Metabolic syndrome
    if(D.msyn && D.msyn.known>=3){
      if(D.msyn.count>=3) add('serious','Metabolic syndrome criteria met',
        `${D.msyn.count} of 5 harmonised criteria are positive (South-Asian waist cutoffs). This roughly doubles cardiovascular risk and raises the 10-year risk of type 2 diabetes about fivefold.`, 95);
      else if(D.msyn.count===2) add('warn','Two metabolic syndrome criteria positive',
        `One more positive criterion would meet the definition. The criteria closest to threshold are the highest-value targets.`, 70);
    }

    // 3. Insulin resistance
    if(D.homa_ir!=null){
      if(D.homa_ir>2.5) add('serious','Insulin resistance present',
        `HOMA-IR ${D.homa_ir} (Asian cutoff 2.5). Insulin resistance usually precedes a rise in HbA1c by years and responds well to weight loss and resistance training.`, 88);
      else if(D.homa_ir>1.8) add('warn','Early insulin resistance',
        `HOMA-IR ${D.homa_ir}, above the optimal 1.8 but below the 2.5 cutoff.`, 62);
    } else if(D.tyg!=null && D.tyg>8.8){
      add('warn','TyG index suggests insulin resistance',
        `TyG ${D.tyg} (cutoff 8.8), derived from triglycerides and fasting glucose — a stand-in for HOMA-IR when fasting insulin is not measured.`, 66);
    }

    // 4. Sarcopenic obesity / muscle adequacy
    if(D.smi!=null){
      // Janssen skeletal-muscle index (SMM / height squared) — class I / class II bands
      const c1 = p.sex==='F' ? 6.75 : 10.75, c2 = p.sex==='F' ? 5.75 : 8.50;
      if(D.smi <= c1){
        const fatty = V.body_fat_pct!=null && V.body_fat_pct > (p.sex==='F'?38:25.5);
        const severe = D.smi <= c2;
        add(fatty?'serious':'warn', fatty?'Sarcopenic obesity pattern':'Low skeletal muscle index',
          `Skeletal muscle index ${D.smi} kg/m² sits in the ${severe?'class II (severe)':'class I (moderate)'} band for ${p.sex==='F'?'women':'men'} (normal is above ${c1} kg/m²)${fatty?', alongside excess body fat — the combination carries higher risk than either alone':''}. Confirm with a grip-strength test before calling it sarcopenia.`, fatty?92:72);
      }
    }

    // 5. Liver / MASLD signal
    const altHigh = V.alt!=null && V.alt > (p.sex==='F'?19:30);
    if(altHigh && (V.bmi>=23 || (V.body_fat_pct!=null && V.body_fat_pct>(p.sex==='F'?38:25.5)))){
      add(V.alt > (p.sex==='F'?30:40) ? 'serious':'warn','Possible metabolic fatty liver (MASLD)',
        `ALT ${V.alt} U/L with excess adiposity. In South Asians, fatty liver appears at a lower BMI than in other populations. An ultrasound or FibroScan is the usual next step.`, 80);
    }

    // 6. Change signals
    if(prev){
      const ch = ENGINE.changes(p, prev, cur).filter(c=>c.meaningful);
      const better = ch.filter(c=>c.dir==='better').sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));
      const worse  = ch.filter(c=>c.dir==='worse').sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));
      for(const c of worse.slice(0,3))
        add('warn', `${c.m.label} moved the wrong way`,
          `${fmtV(c.m,c.from)} → ${fmtV(c.m,c.to)} ${c.m.unit} (${signed(c.delta)}), a real change rather than measurement noise.`, 74);
      for(const c of better.slice(0,3))
        add('good', `${c.m.label} improved`,
          `${fmtV(c.m,c.from)} → ${fmtV(c.m,c.to)} ${c.m.unit} (${signed(c.delta)}) since the previous visit.`, 40);

      const q = ENGINE.lossQuality(prev, cur);
      if(q && !q.gaining){
        if(q.fatShare!=null && q.fatShare < 70) add('serious','Too much of the weight lost was lean mass',
          `Of ${q.dW} kg lost, ${q.dF} kg was fat and ${q.dL} kg was lean tissue — a ${q.fatShare}% fat fraction against a target of at least 75%. Raise protein and add resistance training before losing more weight.`, 90);
        else if(q.fatShare!=null && q.fatShare >= 85) add('good','High-quality weight loss',
          `${q.fatShare}% of the ${q.dW} kg lost came from fat mass, with lean tissue largely preserved. This is the pattern that protects metabolic rate.`, 45);
      } else if(q && q.gaining && q.dF < -0.8){
        add('warn','Fat mass increased','Fat mass rose by '+Math.abs(q.dF)+' kg since the last visit.', 76);
      }
    }
    out.sort((a,b)=> b.score - a.score || RANK[a.sev]-RANK[b.sev]);
    return out;
  }

  /* ---------------- personalised plan ---------------- */
  function plan(p, cur, prev){
    const V = cur.values, D = cur.derived, h = (p.height||170)/100, F = p.sex==='F';
    const w = V.weight, out = { nutrition:[], movement:[], clinical:[], monitoring:[] };
    const idealLo = round(18.5*h*h,1), idealHi = round(22.9*h*h,1);

    /* --- energy & protein --- */
    let tdee=null, deficit=null, target=null, protein=null;
    if(w){
      const bmr = D.bmr_katch ?? D.bmr_mifflin;
      const steps = V.steps ?? 5000;
      const af = steps<5000?1.25 : steps<7500?1.38 : steps<10000?1.5 : 1.6;
      tdee = Math.round(bmr*af);
      const overweight = (V.bmi ?? w/(h*h)) > 23;
      if(overweight){
        const rate = clamp(0.006*w, 0.35, 0.9);                 // kg per week, 0.6 %BW capped
        deficit = Math.min(Math.round(rate*7700/7), Math.round(tdee*0.28));
        target = Math.max(Math.round(tdee-deficit), F?1200:1500);
        out.nutrition.push(`Aim for about <b>${fmtInt(target)} kcal/day</b> — roughly ${fmtInt(deficit)} kcal below your estimated ${fmtInt(tdee)} kcal maintenance. That is about <b>${round(rate,2)} kg/week</b>, the rate that protects muscle.`);
      } else {
        target = tdee;
        out.nutrition.push(`Your estimated maintenance is about <b>${fmtInt(tdee)} kcal/day</b>. Weight is in range, so eat to maintain and put the effort into body composition rather than the scale.`);
      }
      const refW = overweight ? Math.min(w, idealHi*1.15) : w;
      protein = Math.round(clamp(1.5,1.2,2.0)*refW);
      out.nutrition.push(`Protein <b>${protein} g/day</b> (about ${round(protein/4,0)} g at each of four eating occasions). At a calorie deficit this is what keeps weight loss coming from fat rather than muscle.`);
      out.nutrition.push(`Fibre <b>30 g/day</b> from vegetables, pulses and whole grains — it blunts the post-meal glucose rise that drives ${F?'her':'his'} insulin load.`);
    }
    if(V.bmi!=null && V.bmi>23) out.nutrition.push(`A <b>${round(w*0.07,1)} kg</b> loss (7% of current weight, to about ${round(w*0.93,1)} kg) is the threshold where insulin sensitivity, liver fat and blood pressure all move together. Healthy-weight band for your height is <b>${idealLo}–${idealHi} kg</b>.`);
    if(V.triglycerides>=150) out.nutrition.push(`Triglycerides at ${V.triglycerides} mg/dL respond fastest to cutting refined carbohydrate, fruit juice and alcohol — expect a measurable change within 6 weeks.`);
    if(V.uric_acid!=null && V.uric_acid > (F?6:7)) out.nutrition.push(`Uric acid ${V.uric_acid} mg/dL: reduce fructose-sweetened drinks and beer, and keep fluid intake at 2.5–3 L/day.`);
    if(V.sbp>=130 || V.dbp>=85) out.nutrition.push(`Keep sodium under <b>2 g/day</b> (about 5 g salt). In South Asian diets most of it comes from pickles, papad, packaged snacks and restaurant food rather than the salt shaker.`);

    /* --- movement --- */
    const steps = V.steps;
    if(steps!=null){
      const tgt = clamp(Math.round((steps+1500)/500)*500, 8000, 12000);
      out.movement.push(steps<tgt
        ? `Step target <b>${fmtInt(tgt)}/day</b>, up from your current ${fmtInt(steps)}. Add it as one 20-minute walk after your largest meal — that placement lowers the post-meal glucose peak as well as adding volume.`
        : `You are already averaging ${fmtInt(steps)} steps/day. Hold it and put new effort into resistance work rather than more walking.`);
    } else {
      out.movement.push(`Target <b>8,000 steps/day</b>, with at least one 20-minute walk after the largest meal of the day.`);
    }
    const lowMuscle = D.smi!=null && D.smi < (F?6.75:10.75);
    out.movement.push(lowMuscle
      ? `<b>Resistance training 3×/week</b> is the priority, not optional — your skeletal muscle index is below the Asian Working Group cutoff. Compound movements, 2–3 sets, progressive load.`
      : `<b>Resistance training 2–3×/week</b>, full body, progressive load. This is what decides whether weight lost is fat or muscle.`);
    if(p.age>=45) out.movement.push(`From ${p.age} onward, muscle is lost at roughly 1% a year without loading. Two sessions a week is maintenance; three is progress.`);
    if(V.resting_hr!=null && V.resting_hr>75) out.movement.push(`Resting heart rate ${V.resting_hr} bpm is above the optimal band — 150 minutes/week of zone-2 cardio typically brings it down 5–8 bpm over 12 weeks.`);
    if(V.sleep_hours!=null && V.sleep_hours<7) out.movement.push(`Sleep is averaging ${V.sleep_hours} h. Short sleep raises next-day appetite and insulin resistance measurably — treat getting to 7 h as part of the plan, not separate from it.`);

    /* --- clinical --- */
    if(V.hba1c!=null){
      if(V.hba1c>=6.5) out.clinical.push(`HbA1c ${V.hba1c}% is in the diabetes range. Confirm with a repeat sample and review pharmacotherapy with the treating physician.`);
      else if(V.hba1c>=5.7) out.clinical.push(`HbA1c ${V.hba1c}% is prediabetic. A <b>7% weight loss</b> cut progression to diabetes by 58% in the Diabetes Prevention Program — more than metformin did.`);
    }
    if(V.vitamin_d!=null && V.vitamin_d<30) out.clinical.push(
      V.vitamin_d<20
        ? `Vitamin D ${V.vitamin_d} ng/mL is deficient. Usual correction is 60,000 IU weekly for 8 weeks then a maintenance dose — confirm with the treating physician, then retest at 12 weeks.`
        : `Vitamin D ${V.vitamin_d} ng/mL is insufficient. 1,000–2,000 IU/day maintenance and retest in 12 weeks.`);
    if(V.vitamin_b12!=null && V.vitamin_b12<300) out.clinical.push(`B12 ${V.vitamin_b12} pg/mL is low. Common on a predominantly vegetarian diet and on metformin — supplementation and a recheck at 3 months.`);
    if(V.ldl!=null && V.ldl>=130) out.clinical.push(`LDL ${V.ldl} mg/dL. Lipid Association of India sets lower goals for South Asians than Western guidelines — discuss whether a statin is indicated alongside the lifestyle plan.`);
    if((V.alt!=null && V.alt>(F?30:40)) || (V.ggt!=null && V.ggt>(F?38:55)))
      out.clinical.push(`Liver enzymes are raised. Ask for a liver ultrasound or FibroScan, and a platelet count so a FIB-4 fibrosis score can be calculated.`);
    if(V.sbp>=140 || V.dbp>=90) out.clinical.push(`Blood pressure ${V.sbp}/${V.dbp} mmHg is in the hypertensive range. Confirm with home readings over 7 days before any treatment decision.`);
    if(D.homa_ir!=null && D.homa_ir>2.5) out.clinical.push(`HOMA-IR ${D.homa_ir} confirms insulin resistance. It is not itself a diagnosis, but it is the single finding here most likely to change over the next 12 weeks with the plan above — worth re-testing alongside HbA1c.`);
    if(V.insulin_fasting!=null && V.insulin_fasting>15 && D.homa_ir==null) out.clinical.push(`Fasting insulin ${V.insulin_fasting} µIU/mL is high. Ask for fasting glucose on the same sample so HOMA-IR can be calculated.`);
    if(V.tsh!=null && V.tsh>4) out.clinical.push(`TSH ${V.tsh} µIU/mL. Repeat with free T4 before concluding anything — a single raised TSH is often transient.`);
    if(D.smi!=null && D.smi < (F?6.75:10.75)) out.clinical.push(`Skeletal muscle index ${D.smi} kg/m² is low. Ask for a <b>grip-strength test</b> and a 5-times chair-stand at the next visit — muscle mass alone does not diagnose sarcopenia, but mass plus weak grip does, and it changes the plan.`);
    if(!out.clinical.length) out.clinical.push(`No red-flag laboratory finding on this panel that needs a physician decision before the next review.`);

    /* --- monitoring --- */
    if(V.hba1c!=null) out.monitoring.push(`HbA1c: <b>repeat in 3 months</b>. It reflects red-cell lifespan, so testing sooner cannot show a real change. A move of 0.5 percentage points or more is a genuine response.`);
    out.monitoring.push(`Body composition: <b>repeat in 8 weeks</b>, same device, fasted, before exercise, same time of day. Body fat needs to move 2.0 percentage points on bioimpedance before it counts as change.`);
    if(V.ldl!=null) out.monitoring.push(`Lipids: <b>6–8 weeks</b> after any diet or medication change. LDL needs to shift 15 mg/dL or more to be outside assay noise.`);
    out.monitoring.push(`Weight: track a <b>7-day rolling average</b>, not single mornings — day-to-day swings of 1–2 kg are water and glycogen, not fat.`);
    if(V.waist==null) out.monitoring.push(`Waist circumference was not recorded. Add it at every visit — for South Asians it predicts metabolic risk better than BMI does.`);

    return { out, tdee, target, deficit, protein, idealLo, idealHi };
  }

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  return { findings, plan, statusOf };
})();

function fmtV(m, v){ return v==null ? '—' : Number(v).toFixed(m.dec ?? 1).replace(/\.0+$/,(m.dec?'.0':'')); }
function signed(v){ return (v>0?'+':'') + v; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* =========================================================================
   CHARTS — hand-built SVG. Single-series plots carry no legend (the title
   names the series); multi-series plots are always legended and never share
   two y-scales on one axis.
   ========================================================================= */
const CHARTS = (() => {
  const NS='http://www.w3.org/2000/svg';
  const el=(n,a)=>{ const e=document.createElementNS(NS,n); for(const k in a) e.setAttribute(k,a[k]); return e; };
  const tip = () => document.getElementById('tip');

  function showTip(html, ev){
    const t = tip(); t.innerHTML = html; t.classList.add('on');
    const r = t.getBoundingClientRect();
    let x = ev.clientX + 14, y = ev.clientY - r.height - 10;
    if(x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
    if(y < 8) y = ev.clientY + 16;
    t.style.left = x+'px'; t.style.top = y+'px';
  }
  const hideTip = () => tip().classList.remove('on');

  function niceTicks(lo, hi, n){
    if(lo===hi){ lo-=1; hi+=1; }
    const span=hi-lo, raw=span/(n||4), mag=Math.pow(10,Math.floor(Math.log10(raw)));
    const norm=raw/mag, step=(norm>=5?10:norm>=2?5:norm>=1?2:1)*mag/ (norm>=5?2:1);
    const s = step || 1;
    const start=Math.floor(lo/s)*s, out=[];
    for(let v=start; v<=hi+1e-9; v+=s) if(v>=lo-1e-9) out.push(round(v,6));
    return out.length>1?out:[lo,hi];
  }

  /* ---------- sparkline ---------- */
  function spark(vals, color, dir){
    const W=180,H=34,P=3;
    const s = el('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',preserveAspectRatio:'none',height:H});
    const v = vals.filter(x=>typeof x==='number');
    if(v.length<2) return s;
    const lo=Math.min(...v), hi=Math.max(...v), sp=(hi-lo)||1;
    const X=i=>P+i*(W-2*P)/(v.length-1), Y=x=>H-P-((x-lo)/sp)*(H-2*P);
    let d='', a='';
    v.forEach((x,i)=>{ d += (i?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1); });
    a = d + `L${X(v.length-1).toFixed(1)} ${H} L${X(0).toFixed(1)} ${H} Z`;
    s.appendChild(el('path',{d:a,fill:color,'fill-opacity':'0.10'}));
    s.appendChild(el('path',{d,fill:'none',stroke:color,'stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round','vector-effect':'non-scaling-stroke'}));
    s.appendChild(el('circle',{cx:X(v.length-1),cy:Y(v[v.length-1]),r:3.2,fill:color,stroke:'var(--surface)','stroke-width':1.6}));
    return s;
  }

  /* ---------- trend line with target band ---------- */
  function trend(points, mk, ctx){
    const W=760, H=250, L=52, Rp=18, T=16, B=34;
    const s = el('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img',
      'aria-label':`${mk.label} over ${points.length} visits`});
    const vals = points.map(p=>p.v);
    let lo=Math.min(...vals), hi=Math.max(...vals);
    const tb = targetBand(mk, ctx);
    if(tb){ lo=Math.min(lo, tb[0]); hi=Math.max(hi, tb[1]); }
    const pad=(hi-lo)*0.18 || Math.abs(hi*0.08) || 1;
    lo-=pad; hi+=pad;
    if(mk.dir!=='mid' && lo<0 && Math.min(...vals)>=0) lo=0;
    const X=i=>L+(points.length===1?(W-L-Rp)/2:i*(W-L-Rp)/(points.length-1));
    const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);

    // target band
    if(tb){
      const y1=Y(Math.min(tb[1],hi)), y2=Y(Math.max(tb[0],lo));
      s.appendChild(el('rect',{x:L,y:Math.min(y1,y2),width:W-L-Rp,height:Math.abs(y2-y1),
        fill:'var(--good)','fill-opacity':'0.07'}));
      s.appendChild(el('line',{x1:L,x2:W-Rp,y1:y1,y2:y1,stroke:'var(--good)','stroke-opacity':'.45','stroke-width':1,'stroke-dasharray':'4 4'}));
      const lab = el('text',{x:L+5,y:y1-5,'text-anchor':'start','font-size':9.5,fill:'var(--good-ink)','letter-spacing':'.08em'});
      lab.textContent='TARGET'; s.appendChild(lab);
    }
    // grid + y axis
    for(const t of niceTicks(lo,hi,4)){
      const y=Y(t);
      if(y<T-2||y>H-B+2) continue;
      s.appendChild(el('line',{x1:L,x2:W-Rp,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
      const tx=el('text',{x:L-9,y:y+3.5,'text-anchor':'end','font-size':10.5,fill:'var(--ink-3)'});
      tx.textContent = fmtAxis(t); s.appendChild(tx);
    }
    s.appendChild(el('line',{x1:L,x2:W-Rp,y1:H-B,y2:H-B,stroke:'var(--axis)','stroke-width':1}));

    // area + line
    let d='';
    points.forEach((p,i)=>{ d += (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1); });
    if(points.length>1){
      s.appendChild(el('path',{d:d+`L${X(points.length-1)} ${H-B} L${X(0)} ${H-B} Z`,fill:'var(--s1)','fill-opacity':'0.09'}));
      s.appendChild(el('path',{d,fill:'none',stroke:'var(--s1)','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'}));
    }
    // points + x labels + hover
    points.forEach((p,i)=>{
      const st = ADVISOR.statusOf(mk.key, p.v, ctx);
      const col = st ? `var(--${st.s})` : 'var(--s1)';
      const last = i===points.length-1;
      s.appendChild(el('circle',{cx:X(i),cy:Y(p.v),r:last?5.5:4,fill:col,stroke:'var(--surface)','stroke-width':2}));
      const tx=el('text',{x:X(i),y:H-B+16,'text-anchor':'middle','font-size':10,fill:'var(--ink-3)'});
      tx.textContent=p.label; s.appendChild(tx);
      if(last){
        const vl=el('text',{x:X(i),y:Y(p.v)-13,'text-anchor':'middle','font-size':12,'font-weight':600,fill:'var(--ink)'});
        vl.textContent=fmtV(mk,p.v); s.appendChild(vl);
      }
      const hit=el('circle',{cx:X(i),cy:Y(p.v),r:16,fill:'transparent',style:'cursor:pointer'});
      hit.addEventListener('mousemove',e=>showTip(
        `<div class="tt">${p.full}</div><div class="tv">${fmtV(mk,p.v)} <span style="font-size:11px;font-weight:400;color:var(--ink-3)">${mk.unit}</span></div>`+
        (st?`<div class="tiny" style="margin-top:3px;color:var(--${st.s}-ink)">${st.t}</div>`:''), e));
      hit.addEventListener('mouseleave',hideTip);
      s.appendChild(hit);
    });
    return s;
  }

  function targetBand(mk, ctx){
    const g = {
      hba1c:[4.5,5.7], glucose_fasting:[70,99], ldl:[0,100], hdl:[ctx.sex==='F'?50:40, 90],
      triglycerides:[0,150], non_hdl:[0,130], cholesterol_total:[0,200],
      alt:[0, ctx.sex==='F'?19:30], ast:[0, ctx.sex==='F'?31:35], ggt:[0, ctx.sex==='F'?20:30],
      bmi:[18.5,22.9], body_fat_pct: ctx.sex==='F'?[25,38]:[13,25.5],
      visceral_fat_area:[0,100], visceral_fat_level:[1,9],
      waist:[0, ctx.sex==='F'?80:90], sbp:[90,120], dbp:[60,80],
      uric_acid:[0, ctx.sex==='F'?5.0:6.0], vitamin_d:[30,60], vitamin_b12:[400,900],
      hs_crp:[0,1], tsh:[0.5,2.5], resting_hr:[50,70], steps:[8000,14000], sleep_hours:[7,9],
      insulin_fasting:[0,8]
    }[mk.key];
    return g || null;
  }
  const fmtAxis = t => Math.abs(t)>=10000 ? (t/1000)+'k' : (Math.abs(t)>=100 ? Math.round(t) : round(t,2));

  /* ---------- stacked body-composition bars ---------- */
  function bodyComp(visits){
    const W=760, rowH=44, L=74, Rp=150, T=8;
    const H = T + visits.length*rowH + 10;
    const s = el('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img','aria-label':'Body composition by visit'});
    const max = Math.max(...visits.map(v=>v.values.weight||0))*1.02 || 1;
    const cols = [
      {k:'fat_mass', c:'var(--s2)', n:'Fat mass'},
      {k:'lean_body_mass', c:'var(--s1)', n:'Lean mass'}
    ];
    visits.forEach((v,i)=>{
      const y = T + i*rowH + 8;
      const lab = el('text',{x:L-10,y:y+16,'text-anchor':'end','font-size':10.5,fill:'var(--ink-3)'});
      lab.textContent = v.short; s.appendChild(lab);
      let x = L;
      const avail = W-L-Rp;
      let total = 0;
      for(const c of cols){
        const val = v.values[c.k]; if(typeof val!=='number') continue;
        const w = (val/max)*avail; total += val;
        const rect = el('rect',{x:x+ (x>L?2:0), y, width:Math.max(w-(x>L?2:0),1), height:24, fill:c.c, rx:i, ry:0});
        rect.setAttribute('rx','2');
        rect.addEventListener('mousemove',e=>showTip(`<div class="tt">${v.full} · ${c.n}</div><div class="tv">${val.toFixed(1)} <span style="font-size:11px;font-weight:400;color:var(--ink-3)">kg</span></div>`,e));
        rect.addEventListener('mouseleave',hideTip);
        s.appendChild(rect); x += w;
      }
      if(total){
        const t2 = el('text',{x:L+avail+12,y:y+16,'font-size':11.5,fill:'var(--ink-2)'});
        t2.textContent = `${total.toFixed(1)} kg`; s.appendChild(t2);
      }
      const bf = v.values.body_fat_pct;
      if(typeof bf==='number'){
        const t3 = el('text',{x:W-4,y:y+16,'text-anchor':'end','font-size':11.5,fill:'var(--ink-3)'});
        t3.textContent = `${bf.toFixed(1)}% fat`; s.appendChild(t3);
      }
    });
    return s;
  }

  /* ---------- score arc ---------- */
  function gauge(score, statusClass){
    const size=128, r=52, cx=size/2, cy=size/2, C=2*Math.PI*r;
    const s = el('svg',{viewBox:`0 0 ${size} ${size}`,width:size,height:size,role:'img',
      'aria-label':`Metabolic score ${score==null?'unavailable':score+' out of 100'}`});
    s.appendChild(el('circle',{cx,cy,r,fill:'none',stroke:'var(--surface-3)','stroke-width':10}));
    if(score!=null){
      const frac = clamp(score,0,100)/100;
      const arc = el('circle',{cx,cy,r,fill:'none',stroke:`var(--${statusClass})`,'stroke-width':10,
        'stroke-linecap':'round','stroke-dasharray':`${(C*frac).toFixed(1)} ${C}`,
        transform:`rotate(-90 ${cx} ${cy})`});
      s.appendChild(arc);
    }
    const t = el('text',{x:cx,y:cy+2,'text-anchor':'middle','font-size':30,'font-weight':600,
      fill:'var(--ink)','font-family':'var(--mono)'});
    t.textContent = score==null?'—':score; s.appendChild(t);
    const t2 = el('text',{x:cx,y:cy+19,'text-anchor':'middle','font-size':9,fill:'var(--ink-3)','letter-spacing':'.12em'});

  /* ---------- baseline → latest dumbbell ---------- */
  function dumbbell(rows){
    const W=760, rowH=34, L=178, Rp=96, T=22;
    const H = T + rows.length*rowH + 6;
    const s = el('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img','aria-label':'Change from first to latest visit'});

    const h2=el('text',{x:W-Rp,y:12,'text-anchor':'end','font-size':9.5,fill:'var(--ink-3)','letter-spacing':'.1em'}); h2.textContent='BETTER'; s.appendChild(h2);
    const avail = W-L-Rp;
    const mid = L + avail/2;
    s.appendChild(el('line',{x1:mid,x2:mid,y1:T-6,y2:H-4,stroke:'var(--axis)','stroke-width':1,'stroke-dasharray':'3 3'}));
    const maxPct = Math.max(20, ...rows.map(r=>Math.abs(r.pct)));
    rows.forEach((r,i)=>{
      const y = T + i*rowH + 12;
      const lab=el('text',{x:L-12,y:y+4,'text-anchor':'end','font-size':11.5,fill:'var(--ink-2)'});
      lab.textContent=r.m.short; s.appendChild(lab);
      const better = r.dir==='better';
      const good = r.m.dir==='higher' ? r.pct>0 : r.pct<0;
      const mag = Math.abs(r.pct)/maxPct * (avail/2 - 6);
      const x2 = good ? mid+mag : mid-mag;
      const col = !r.meaningful ? 'var(--ink-3)' : (good?'var(--good)':'var(--crit)');
      s.appendChild(el('line',{x1:mid,x2,y1:y,y2:y,stroke:col,'stroke-width':7,'stroke-linecap':'round','stroke-opacity':r.meaningful?1:.45}));
      s.appendChild(el('circle',{cx:x2,cy:y,r:5,fill:col,stroke:'var(--surface)','stroke-width':2,'fill-opacity':r.meaningful?1:.5}));
      const v=el('text',{x:W-Rp+12,y:y+4,'font-size':11.5,fill:'var(--ink-2)'});
      v.textContent=`${fmtV(r.m,r.from)} → ${fmtV(r.m,r.to)} ${r.m.unit}`; s.appendChild(v);
      const hit=el('rect',{x:L,y:y-13,width:avail,height:26,fill:'transparent',style:'cursor:pointer'});
      hit.addEventListener('mousemove',e=>showTip(
        `<div class="tt">${r.m.label}</div><div class="tv">${signed(r.delta)} ${r.m.unit}</div>`+
        `<div class="tiny" style="margin-top:3px;color:var(--ink-2)">${r.meaningful?(good?'A real improvement':'A real deterioration'):'Within measurement noise'} · ${signed(r.pct)}%</div>`,e));
      hit.addEventListener('mouseleave',hideTip);
      s.appendChild(hit);
    });
    return s;
  }

  /* ---------- domain score bars ---------- */
  function domainBars(domains){
    const s = document.createElement('div');
    s.style.cssText='display:flex;flex-direction:column;gap:9px';
    for(const d of domains){
      const row=document.createElement('div');
      const st = d.s>=75?'good':d.s>=55?'warn':d.s>=35?'serious':'crit';
      row.innerHTML = `<div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:3px">
        <span style="font-size:12.5px">${d.name}</span>
        <span class="num tiny" style="color:var(--${st}-ink);font-weight:600">${d.s}</span></div>
        <div style="height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden">
          <div style="height:100%;width:${d.s}%;background:var(--${st});border-radius:3px"></div></div>
        ${d.detail?`<div class="tiny num" style="color:var(--ink-3);margin-top:3px">${d.detail}</div>`:''}`;
      s.appendChild(row);
    }
    return s;
  }

  return { spark, trend, bodyComp, gauge, dumbbell, domainBars, targetBand, showTip, hideTip };
})();
/* =========================================================================
   AUTH — prototype sign-in. Passwords are salted and stretched with
   PBKDF2-SHA-256 in the browser; only the derived hash is stored. This is
   the right SHAPE, not production security: everything still lives on the
   client, so treat it as a demonstration of the access model, not as a
   credential store. A real deployment moves all of this server-side.
   ========================================================================= */
const AUTH = (() => {
  const enc = new TextEncoder();
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function derive(password, saltB64){
    const salt = unb64(saltB64);
    const key = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      {name:'PBKDF2', salt, iterations:120000, hash:'SHA-256'}, key, 256);
    return b64(bits);
  }
  const newSalt = () => b64(crypto.getRandomValues(new Uint8Array(16)));

  async function setPassword(account, password){
    account.salt = newSalt();
    account.hash = await derive(password, account.salt);
    account.pwSet = true;
    account.pwSetAt = new Date().toISOString();
  }
  async function verify(account, password){
    if(!account || !account.pwSet || !account.salt) return false;
    return (await derive(password, account.salt)) === account.hash;
  }
  function strength(pw){
    let s = 0;
    if(pw.length >= 8) s++;
    if(pw.length >= 12) s++;
    if(/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
    if(/\d/.test(pw)) s++;
    if(/[^A-Za-z0-9]/.test(pw)) s++;
    return Math.min(s, 4);
  }
  const problems = pw => {
    const out = [];
    if(pw.length < 8) out.push('at least 8 characters');
    if(!/[A-Za-z]/.test(pw)) out.push('a letter');
    if(!/\d/.test(pw)) out.push('a number');
    return out;
  };
  return { setPassword, verify, strength, problems, newSalt, derive };
})();

/* =========================================================================
   FILE STORE — file bytes go to IndexedDB on this device; the shared record
   holds only the metadata (name, size, who uploaded it, when). Production
   swaps this for object storage with signed, expiring download URLs.
   ========================================================================= */
const FILES = (() => {
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('livya-files', 1);
      r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains('blobs')) r.result.createObjectStore('blobs'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(mode, fn){
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('blobs', mode);
      const req = fn(t.objectStore('blobs'));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
    });
  }
  const put = (key, blob) => tx('readwrite', st => st.put(blob, key));
  const get = key => tx('readonly', st => st.get(key));
  const del = key => tx('readwrite', st => st.delete(key));
  async function has(key){ try{ return (await get(key)) != null; }catch(e){ return false; } }
  return { put, get, del, has };
})();

async function loadDB(){
  try{ CAP = await (window.claude && claude.use ? claude.use('artifact') : null); }catch(e){ CAP = null; }
  let cloud = null;
  try{ const r = await fetch('data/patients.json', {cache:'no-store'}); if(r.ok) cloud = await r.json(); }catch(e){}
  let local = null;
  try{ const raw = localStorage.getItem(KEY) || localStorage.getItem('livya-metabolic-v1');
       if(raw) local = JSON.parse(raw); }catch(e){}
  let picked = (cloud && local) ? (new Date(cloud.updated) > new Date(local.updated) ? cloud : local) : (cloud || local);
  DB = migrate(picked) || seed();
  if(picked === cloud) reattachCredentials(DB, local);
  if(!DB.clients || !DB.clients.length) DB = seed();
}

function migrate(d){
  if(!d) return null;
  if(d.patients && !d.clients){                 // v1 → v2
    const fresh = seed();
    d.clients = d.patients.map(p => Object.assign({
      email:'', pwSet:false, createdAt: nowISO(), createdByName:'Imported'
    }, p));
    delete d.patients;
    d.users = fresh.users; d.files = []; d.audit = []; d.v = 2;
  }
  const fresh = seed();
  d.users    = d.users    || fresh.users;
  d.files    = d.files    || [];
  d.audit    = d.audit    || [];
  d.programs = d.programs || fresh.programs;
  d.recipes  = d.recipes  || [];
  for(const r of d.recipes){                        // v5 → v6: audience becomes a shared-with list
    if(r.audience !== undefined){
      r.sharedAll = r.audience === 'all';
      r.sharedWith = (r.audience && r.audience !== 'all') ? [{clientId:r.audience, at:r.at, byName:r.byName}] : [];
      delete r.audience;
    }
    if(r.sharedAll === undefined) r.sharedAll = false;
    r.sharedWith = r.sharedWith || [];
    if(r.deleteRequest === undefined) r.deleteRequest = null;
    if(r.video === undefined) r.video = '';
  }
  for(const g of d.programs||[]) g.schedule = g.schedule || [];
  for(const c of d.clients||[]){
    c.visits = c.visits || [];
    if(c.pwSet===undefined) c.pwSet = false;
    c.notes  = c.notes || [];
    c.checkins = c.checkins || [];
    c.messages = c.messages || [];
    if(c.assistantId === undefined) c.assistantId = null;
    c.diet   = c.diet  || emptyDiet();
    c.diet.plan    = Object.assign(emptyDiet().plan,  c.diet.plan  || {});
    c.diet.chart   = Object.assign(emptyDiet().chart, c.diet.chart || {});
    c.diet.history = c.diet.history || [];
    if(c.program && !c.programId){                    // v2 free-text programme → a real one
      const match = d.programs.find(g => g.name.toLowerCase() === String(c.program).toLowerCase());
      if(match){ c.programId = match.id; c.programStart = c.programStart || (c.createdAt||'').slice(0,10); }
    }
  }
  d.v = 3;
  return d;
}

// Password material never leaves this device: the shared copy carries records
// and the fact that a password exists, never the salt or the derived hash.
function shareable(){
  const d = JSON.parse(JSON.stringify(DB));
  for(const a of [...(d.users||[]), ...(d.clients||[])]){ delete a.hash; delete a.salt; }
  return d;
}

// …and coming back the other way, credentials are re-attached from the local
// copy so a device that already knows a password keeps it.
function reattachCredentials(target, local){
  if(!local) return target;
  const from = new Map();
  for(const a of [...(local.users||[]), ...(local.clients||[])]) if(a.hash) from.set(a.id, a);
  for(const a of [...(target.users||[]), ...(target.clients||[])]){
    const src = from.get(a.id);
    if(src){ a.hash = src.hash; a.salt = src.salt; a.pwSet = true; a.pwSetAt = a.pwSetAt || src.pwSetAt; }
    else if(!a.hash) a.pwSet = false;
  }
  return target;
}

function restoreSession(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }catch(e){}
  if(!s) return false;
  if(s.kind === 'user'){
    const u = DB.users.find(x => x.id === s.id && x.active);
    if(!u) return false;
    SESSION.principal = {kind:'user', id:u.id, name:u.name, email:u.email, role:u.role};
    return true;
  }
  const c = DB.clients.find(x => x.id === s.id);
  if(!c) return false;
  SESSION.principal = {kind:'client', id:c.id, name:c.name, email:c.email, role:'client'};
  return true;
}

function programProgress(c){
  const g = programOf(c);
  if(!g || !c.programStart) return null;
  const weeks = Math.max(0, Math.floor((Date.now() - new Date(c.programStart+'T00:00:00Z')) / 6048e5));
  return { g, week: Math.min(weeks+1, g.durationWeeks), total: g.durationWeeks,
           pct: Math.min(100, Math.round((weeks / g.durationWeeks) * 100)),
           done: weeks >= g.durationWeeks };
}
function programLabel(c){
  const pr = programProgress(c);
  if(pr) return `${pr.g.name} · week ${pr.week} of ${pr.total}`;
  const g = programOf(c);
  return g ? g.name : (c.program || 'No programme assigned');
}

/* --- video links: recognised, opened in a new tab (the page blocks external hosts) --- */
function videoInfo(url){
  const u = String(url || '').trim();
  if(!u) return null;
  if(!/^https?:\/\//i.test(u)) return {url:u, provider:'Link', bad:true};
  const host = (u.match(/^https?:\/\/([^/?#]+)/i) || [])[1] || '';
  const p = /youtube\.com|youtu\.be/i.test(host) ? 'YouTube'
          : /vimeo\.com/i.test(host) ? 'Vimeo'
          : /instagram\.com/i.test(host) ? 'Instagram'
          : /drive\.google\.com/i.test(host) ? 'Google Drive'
          : /\.(mp4|webm|mov|m4v)(\?|$)/i.test(u) ? 'Video file'
          : host.replace(/^www\./, '');
  return {url:u, provider:p, host};
}

  const scPrev = prev ? ENGINE.score(p, prev.values, prev.derived) : null;

  const finds = ADVISOR.findings(p, cur, prev, base);

  const spanDays = Math.round((new Date(cur.date)-new Date(base.date))/864e5);

  const sched = SCHEDULE.summary(p);

  /* --- score + tiles --- */

        </div>
      </div>

    </div>
    <div class="card pad">

      <div style="margin-top:14px" class="banner ${sc.total>=65?'goodb':sc.total>=50?'info':'warnb'}">
        <span>${headline(p, cur, prev, sc, scPrev)}</span>

    </div>
  </div>`);

  /* --- headline tiles --- */
  const tileKeys = ['weight','body_fat_pct','visceral_fat_level','hba1c','waist','ldl','triglycerides','sbp']
    .filter(k => typeof cur.values[k]==='number').slice(0,5);
  html.push(`<div class="sect"><h2>Headline numbers</h2><div class="rule"></div>
    <span class="tiny muted">vs previous visit</span></div>

  /* --- since baseline --- */
  const dbRows = ENGINE.changes(p, base, cur)
    .filter(c => !c.m.noStatus || c.key==='weight')
    .filter(c => ['weight','body_fat_pct','visceral_fat_level','waist','hba1c','glucose_fasting','ldl','hdl','triglycerides','alt','sbp','resting_hr','steps'].includes(c.key))
    .sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct)).slice(0,10);
  if(V.length>1 && dbRows.length) html.push(`<div class="sect"><h2>What has changed since ${base.full}</h2><div class="rule"></div></div>
    <div class="chartcard"><div class="charthead"><div>
      <h3>Change from first report to latest</h3>
      <p class="tiny muted" style="margin-top:2px">Bar length is the size of the change. Faded bars are within measurement noise and should not be read as progress.</p>
    </div></div><div id="dbSlot"></div></div>`);

  /* --- trends --- */
  const trendable = MARKERS.filter(m => V.filter(v=>typeof v.values[m.key]==='number').length>=2);
  if(trendable.length && !trendable.find(m=>m.key===UI.marker)) UI.marker = trendable[0].key;
  if(trendable.length) html.push(`<div class="sect"><h2>Trends</h2><div class="rule"></div></div>
    <div class="chartcard">
      <div class="charthead"><div><h3 id="trendTitle"></h3><p class="tiny muted" id="trendSub" style="margin-top:2px"></p></div></div>

  /* --- body composition --- */
  const bc = V.filter(v=>typeof v.values.fat_mass==='number');
  if(bc.length){
    const q = prev ? ENGINE.lossQuality(prev, cur) : null;
    const qb = prev ? ENGINE.lossQuality(base, cur) : null;
    html.push(`<div class="sect"><h2>Body composition</h2><div class="rule"></div></div>
      <div class="two">
        <div class="chartcard">
          <div class="charthead"><div><h3>Fat mass and lean mass by visit</h3>
          <p class="tiny muted" style="margin-top:2px">Total bar length is body weight. What matters is which part of it is shrinking.</p></div></div>
          <div id="bcSlot"></div>
          <div class="legend"><span><i style="background:var(--s2)"></i>Fat mass</span><span><i style="background:var(--s1)"></i>Lean mass</span></div>
        </div>
        <div class="card pad">

        <div>${finds.slice(0,7).map(f=>`
          <div class="finding">
            <span class="mk" style="background:var(--${f.sev}-wash);color:var(--${f.sev}-ink)">${f.sev==='good'?'✓':f.sev==='crit'?'!':f.sev==='serious'?'▲':'•'}</span>
            <div><h4>${esc(f.title)}</h4><p>${f.body}</p></div>
          </div>`).join('') || '<div class="pad tiny muted">Nothing outside target on this panel.</div>'}</div>
      </div>
    </div>`);

  /* --- plan --- */
  const cards = [
    ['Nutrition', pl.out.nutrition, '#'],
    ['Movement', pl.out.movement, '#'],
    ['Clinical follow-up', pl.out.clinical, '#'],
    ['What to re-test, and when', pl.out.monitoring, '#']
  ].filter(c=>c[1].length);
  html.push(`<div class="sect"><h2>Your plan</h2><div class="rule"></div>
      <span class="tiny muted">generated from this visit</span></div>

      <span>Built from your gender, age ${p.age} and height ${p.height} cm together with this report's values and the change since ${prev?prev.full:base.full}. Every number below traces to a measurement — nothing here is generic advice. Discuss any medication change with your treating physician.</span>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(310px,1fr))">

  /* --- targets --- */
  if(pl.target) html.push(`<div class="sect"><h2>Your numbers to hit</h2><div class="rule"></div></div>
    <div class="tiles">

      ${targetTile('Waist target', p.sex==='F'?'< 80':'< 90', 'cm', cur.values.waist?`currently ${cur.values.waist} cm`:'not yet measured')}

function targetTile(label, val, unit, sub){
  return `<div class="tile"><span class="stripe" style="background:var(--brand)"></span>
    <div class="lbl"><span class="eyebrow">${label}</span></div>
    <div class="v">${val}<em>${unit}</em></div>
    <div class="ref">${sub}</div></div>`;
}

function qualityBlock(q, when){
  if(!q) return `<p class="tiny muted" style="margin-top:8px">Not enough paired body-composition data ${when}.</p>`;
  if(q.gaining) return `<div style="margin-top:10px" class="banner warnb"><span>Weight rose ${Math.abs(q.dW)} kg ${when}, of which ${Math.abs(q.dF)} kg was fat.</span></div>`;
  const s = q.fatShare>=75?'good':q.fatShare>=60?'warn':'serious';
  const gained = q.dL < 0;
  const body = gained
    ? `All <b class="num">${q.dW} kg</b> of the loss came from fat — <b class="num">${q.dF} kg</b> of it — while lean tissue <b>rose by ${Math.abs(q.dL)} kg</b>. This is the best possible pattern.`
    : `Of the <b class="num">${q.dW} kg</b> lost, <b class="num">${q.dF} kg</b> was fat and <b class="num">${q.dL} kg</b> was lean tissue. A well-run programme keeps fat above 75% of the loss.`;
  return `<div style="margin-top:12px">
    <div class="tiny muted" style="margin-bottom:5px">${when.charAt(0).toUpperCase()+when.slice(1)}</div>
    <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
      <span class="num" style="font-size:26px;font-weight:600">${Math.min(q.fatShare,100)}%</span>
      <span class="pill ${s}">${gained?'Fat only, muscle gained':q.fatShare>=75?'On target':'Below the 75% target'}</span>
    </div>
    <p class="tiny muted" style="margin-top:5px;line-height:1.5">${body}</p>
  </div>`;
}

function indexRows(p, cur){
  const D = cur.derived, V = cur.values, rows = [];
  const push=(k,v,note)=>{ if(v!=null && isFinite(v)) rows.push(`<dt>${k}</dt><dd>${v}${note?` <span class="tiny" style="color:var(--ink-3);font-family:var(--sans)">${note}</span>`:''}</dd>`); };
  push('BMI', V.bmi, '· Asian-Indian healthy band 18.5–22.9');
  push('Waist ÷ height', D.whtr, D.whtr!=null ? (D.whtr<0.5?'· below 0.50, good':'· keep waist under half your height') : '');
  push('HOMA-IR', D.homa_ir, D.homa_ir!=null ? (D.homa_ir<1.8?'· insulin sensitive':D.homa_ir<2.5?'· borderline':'· insulin resistant') : '');
  push('TyG index', D.tyg, D.tyg!=null && D.tyg>8.8 ? '· above 8.8' : '· below 8.8');
  push('TG ÷ HDL', D.tg_hdl, D.tg_hdl!=null ? (D.tg_hdl<2.5?'· favourable':'· atherogenic pattern') : '');
  push('Skeletal muscle index', D.smi, '· SMM ÷ height²');
  push('Est. average glucose', D.eag, '· mg/dL from HbA1c');
  push('Resting energy need', D.bmr_katch ?? D.bmr_mifflin, D.bmr_katch?'· kcal, Katch-McArdle from lean mass':'· kcal, Mifflin-St Jeor');
  return rows.join('') || '<dt>—</dt><dd>No derived indices available</dd>';
}

function headline(p, cur, prev, sc, scPrev){
  const bits = [];
  const d = (scPrev && sc.total!=null && scPrev.total!=null) ? sc.total-scPrev.total : null;
  if(d!=null && d>=4) bits.push(`Your metabolic score improved <b>${d} points</b> since the last visit.`);
  else if(d!=null && d<=-4) bits.push(`Your metabolic score fell <b>${Math.abs(d)} points</b> since the last visit.`);
  const q = prev ? ENGINE.lossQuality(prev, cur) : null;
  if(q && !q.gaining && q.fatShare!=null)
    bits.push(q.fatShare>=75 ? `Weight loss is coming mostly from fat (${q.fatShare}%), which is the pattern that protects your metabolic rate.`
      : `Only ${q.fatShare}% of the recent weight loss came from fat — protein and resistance training need to come up before losing more.`);
  const ms = cur.derived.msyn;
  if(ms.count>=3) bits.push(`Three or more metabolic syndrome criteria are currently positive.`);
  else if(ms.count===2) bits.push(`Two metabolic syndrome criteria are positive — one away from the definition.`);
  if(!bits.length) bits.push('This is your first full report — it becomes the baseline every future visit is measured against.');
  return bits.join(' ');
}

function tile(key, V, ctx){
  const m = R[key];
  const series = V.map(v=>v.values[key]).filter(x=>typeof x==='number');
  const val = series[series.length-1], prevV = series.length>1?series[series.length-2]:null;
  const st = ADVISOR.statusOf(key, val, ctx) || {s:'neutral', t:''};
  const d = document.createElement('div');
  d.className='tile';
  const delta = prevV!=null ? round(val-prevV, m.dec ?? 1) : null;
  const meaningful = delta!=null && Math.abs(delta) >= (m.lsc||0);
  const good = delta==null ? null : (m.dir==='higher' ? delta>0 : m.dir==='lower' ? delta<0 : null);
  const dcol = !meaningful ? 'var(--ink-3)' : good ? 'var(--good-ink)' : 'var(--crit-ink)';
  const arrow = delta==null||delta===0 ? '' : (delta>0?'▲':'▼');
  d.innerHTML = `<span class="stripe" style="background:var(--${st.s==='neutral'?'s1':st.s})"></span>
    <div class="lbl"><span class="eyebrow">${m.short}</span>${st.t?`<span class="pill ${st.s}">${st.t}</span>`:''}</div>
    <div class="v">${fmtV(m,val)}<em>${m.unit}</em></div>
    <div class="delta" style="color:${dcol}">${delta!=null?`${arrow} ${Math.abs(delta)} ${m.unit}`:'first reading'}
      <span style="color:var(--ink-3)">${delta!=null?(meaningful?'vs last visit':'within noise'):''}</span></div>`;
  const sp = document.createElement('div'); sp.className='spark';
  sp.appendChild(CHARTS.spark(series, `var(--${st.s==='neutral'?'s1':st.s})`, m.dir));
  d.appendChild(sp);
  return d;
}

function mountTrend(p, V, trendable, ctx){
  const chips = $('#chipSlot'); if(!chips) return;
  const order = ['weight','body_fat_pct','visceral_fat_level','waist','hba1c','glucose_fasting','insulin_fasting',
    'ldl','hdl','triglycerides','non_hdl','cholesterol_total','alt','ast','ggt','uric_acid','vitamin_d','vitamin_b12',
    'hs_crp','tsh','sbp','dbp','resting_hr','steps','sleep_hours','hrv','skeletal_muscle_mass','bmi','creatinine','bmr'];
  const sorted = trendable.slice().sort((a,b)=>{
    const ia=order.indexOf(a.key), ib=order.indexOf(b.key);
    return (ia<0?99:ia)-(ib<0?99:ib); });
  chips.innerHTML = sorted.map(m=>`<button class="chip" data-k="${m.key}" aria-pressed="${m.key===UI.marker}">${esc(m.short)}</button>`).join('');
  chips.onclick = e => { const b=e.target.closest('.chip'); if(!b) return; UI.marker=b.dataset.k; drawTrend(p,V,ctx); };
  drawTrend(p, V, ctx);
}

function drawTrend(p, V, ctx){
  const m = R[UI.marker]; if(!m) return;
  document.querySelectorAll('#chipSlot .chip').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.k===UI.marker)));
  const pts = V.filter(v=>typeof v.values[m.key]==='number')
    .map(v=>({v:v.values[m.key], label:v.short, full:v.full}));
  const slot = $('#trendSlot'); if(!slot) return; slot.innerHTML='';
  if(!pts.length){ slot.innerHTML = '<p class="tiny muted">No readings for this measurement yet.</p>'; return; }
  slot.appendChild(CHARTS.trend(pts, m, ctx));
  const tgt = typeof m.target==='function' ? m.target(ctx) : m.target;
  $('#trendTitle').textContent = `${m.label} · ${m.unit}`;
  const first = pts[0].v, last = pts[pts.length-1].v, dd = round(last-first, m.dec ?? 1);
  const good = m.dir==='higher' ? dd>0 : m.dir==='lower' ? dd<0 : null;
  $('#trendSub').innerHTML = `Target ${esc(tgt)} · ${pts.length} readings · ${signed(dd)} ${m.unit} since ${pts[0].full}` +
    (Math.abs(dd) < (m.lsc||0) ? ' <span style="color:var(--ink-3)">(within measurement noise)</span>' : '') +
    (m.note ? `<br><span style="color:var(--ink-3)">${esc(m.note)}</span>` : '');
}
/* =========================================================================
   MODAL — a promise-returning confirm/choice dialog.
   ========================================================================= */
// Resolves the chosen action's `value`. With `input`, resolves {value, text} instead.
function modal({title, body, actions, input}){
  return new Promise(resolve => {
    const root = $('#modalRoot');
    root.innerHTML = `<div class="scrim" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal"><div class="mh"><h3>${esc(title)}</h3><p>${body}</p>
        ${input ? `<label class="f" style="margin-top:13px"><span class="tiny muted">${esc(input.label||'')}</span>
          <input id="modalInput" placeholder="${esc(input.placeholder||'')}"></label>` : ''}
      </div>
      <div class="mf">${actions.map((a,i)=>`<button class="btn ${a.cls||''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div>
      </div></div>`;
    const wrap = v => input ? {value:v, text:(($('#modalInput')||{}).value)||''} : v;
    const close = v => { const out = v===null ? (input?{value:null,text:''}:null) : wrap(v);
      root.innerHTML=''; document.removeEventListener('keydown', onKey); resolve(out); };
    const onKey = e => { if(e.key==='Escape') close(null); };
    document.addEventListener('keydown', onKey);
    root.querySelectorAll('.mf button').forEach(b =>
      b.onclick = () => close(actions[+b.dataset.i].value));
    root.querySelector('.scrim').onclick = e => { if(e.target===root.querySelector('.scrim')) close(null); };
    const f = root.querySelector('#modalInput') || root.querySelector('.mf button'); if(f) f.focus();
  });
}
const confirmDanger = (title, body, label) =>
  modal({title, body, actions:[
    {label:'Cancel', value:null},
    {label, cls:'btn-danger', value:true}
  ]});
