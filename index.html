html,body{margin:0;padding:0}
body{background:var(--surface-2);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.55;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.hint{background:var(--ink);color:var(--surface);font-size:12.5px;padding:11px 18px;text-align:center;line-height:1.5}
.hint b{font-family:var(--mono);background:rgba(255,255,255,.16);border-radius:4px;padding:1px 6px}
.page{max-width:196mm;margin:0 auto;background:var(--surface);padding:16mm 14mm 18mm;
  box-shadow:0 2px 30px -14px rgba(0,0,0,.35)}
h1,h2,h3,h4{margin:0;letter-spacing:-.015em;font-weight:600}
p{margin:0}
.mast{display:flex;align-items:flex-end;gap:14px;border-bottom:2.5px solid var(--brand);padding-bottom:10px;margin-bottom:18px}
.mast b{font-size:21px;font-weight:700;letter-spacing:.16em;color:var(--brand);line-height:1}
.mast span{font-family:var(--mono);font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink-3)}
.mast .doc{margin-left:auto;text-align:right;font-family:var(--mono);font-size:10px;color:var(--ink-3);line-height:1.6}
.who{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin-bottom:20px}
.who h1{font-size:23px}
.who .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.who .meta b{color:var(--ink);font-weight:500}
h2.sec{font-size:14px;margin:24px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:10px}
h2.sec span{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;margin-left:auto}
table{border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed}
th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;padding:0 8px 5px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top;overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:100px;padding:1.5px 7px;font-size:10px;font-weight:600;
  font-family:var(--mono);white-space:nowrap}
.good{background:var(--good-wash);color:var(--good-ink)}
.warn{background:var(--warn-wash);color:var(--warn-ink)}
.serious{background:var(--serious-wash);color:var(--serious-ink)}
.crit{background:var(--crit-wash);color:var(--crit-ink)}
.neutral{background:var(--neutral-wash);color:var(--neutral-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>*{min-width:0}
.box{border:1px solid var(--line);border-radius:9px;padding:13px 15px}
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.bars{display:flex;flex-direction:column;gap:7px;flex:1;min-width:220px}
.bar{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.muted{color:var(--ink-2)}
.tiny{font-size:11px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--mono)}
ul,ol{margin:6px 0 0;padding-left:17px;display:flex;flex-direction:column;gap:5px}
div.chart{border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:12px}
div.chart h3{font-size:12.5px;margin-bottom:6px}
.chartgrid{display:flex;flex-direction:column}
.note{padding:10px 0;border-bottom:1px solid var(--line-soft);display:flex;gap:14px}
.note:last-child{border-bottom:0}
.note .d{font-family:var(--mono);font-size:10px;color:var(--ink-3);min-width:66px;text-transform:uppercase;letter-spacing:.05em}
.note p{white-space:pre-wrap;font-size:12.5px}
.foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-2);line-height:1.65}
.warnbox{background:var(--warn-wash);border:1px solid rgba(250,178,25,.4);border-radius:8px;
  padding:10px 13px;font-size:11.5px;color:var(--warn-ink);line-height:1.55;margin-top:14px}
.runfoot{display:none}

@page{ size:A4 portrait; margin:14mm 12mm 15mm; }
@media print{
  html,body{background:#fff}
  .hint{display:none}
  .page{max-width:none;margin:0;padding:0 0 8mm;box-shadow:none}
  thead{display:table-header-group}
  tr,.box,div.chart,.note,.score,.warnbox{break-inside:avoid;page-break-inside:avoid}
  h2.sec{break-after:avoid;page-break-after:avoid;break-inside:avoid}
  .pb{break-before:page;page-break-before:always}
  .runfoot{display:block;position:fixed;bottom:0;left:0;right:0;
    font-family:var(--mono);font-size:8.5px;color:var(--ink-3);
    border-top:1px solid var(--line);padding-top:3px;
    display:flex;justify-content:space-between}
  a{text-decoration:none;color:inherit}
}
@media screen and (max-width:800px){ .two{grid-template-columns:1fr} .page{padding:18px 16px 30px} }
`;

const doc = (title, body, opts) =>
`<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(title)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>${CSS}</style>
${opts && opts.landscape ? '<style>@page{size:A4 landscape;margin:12mm 12mm 14mm}.page{max-width:280mm}</style>' : ''}
</head>
<body>
<div class="hint">Laid out for A4. Press <b>Ctrl</b>+<b>P</b> (or <b>&#8984;</b>+<b>P</b>), choose <b>Save as PDF</b>, and turn on <b>Background graphics</b> so the colours come through.</div>
<div class="page">${body}
<div class="runfoot"><span>${esc((opts && opts.foot) || 'LIVYA Metabolic')}</span><span>${fmtDate(todayISO())}</span></div>
</div></body></html>`;

const mast = (c, kind) => `<div class="mast"><b>LIVYA</b><span>Metabolic</span>
  <div class="doc">${esc(kind)}<br>${esc(c.mrn || '')} · issued ${fmtDate(todayISO())}</div></div>
  <div class="who">
    <div><h1>${esc(c.name)}</h1>
      <div class="meta">${c.sex==='F'?'Female':'Male'} · <b>${c.age}</b> yrs · <b>${c.height}</b> cm · ${esc(programLabel(c))}</div>
    </div>
  </div>`;

const svgOf = el => el ? el.outerHTML : '';

/* ---------------- health summary ---------------- */
function healthDoc(c){
  const V = visitsOf(c);
  if(!V.length) return doc(`${c.name} — health summary`, mast(c,'Health summary') +
    '<p class="muted">No reports on file yet.</p>', {foot:c.name});
  const cur = V[V.length-1], prev = V.length>1?V[V.length-2]:null, base = V[0];
  const ctx = {sex:c.sex, age:c.age};
  const sc = ENGINE.score(c, cur.values, cur.derived), gr = ENGINE.grade(sc.total);
  const finds = ADVISOR.findings(c, cur, prev, base);
  const pl = ADVISOR.plan(c, cur, prev);
  const ms = cur.derived.msyn;
  const sched = SCHEDULE.summary(c);

  const b = [];
  b.push(mast(c, 'Health summary'));

  /* score */
  b.push(`<h2 class="sec">LIVYA Metabolic Score <span>report of ${cur.full}</span></h2>
  <div class="box"><div class="score">
    <div style="width:128px;flex:none">${svgOf(CHARTS.gauge(sc.total, gr.s))}</div>
    <div class="bars">
      <div style="margin-bottom:4px"><span class="pill ${gr.s}">${gr.t}</span></div>
      ${sc.domains.map(d=>{
        const st = d.s>=75?'good':d.s>=55?'warn':d.s>=35?'serious':'crit';
        return `<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span>${esc(d.name)}</span><b class="num" style="color:var(--${st}-ink)">${d.s}</b></div>
          <div class="bar"><i style="width:${d.s}%;background:var(--${st})"></i></div>
          ${d.detail?`<div class="tiny num muted" style="margin-top:2px">${esc(d.detail)}</div>`:''}</div>`;
      }).join('')}
    </div></div></div>`);

  /* headline numbers */
  const keys = ['weight','bmi','body_fat_pct','skeletal_muscle_mass','visceral_fat_level','visceral_fat_area','waist',
    'hba1c','glucose_fasting','insulin_fasting','cholesterol_total','ldl','hdl','triglycerides','non_hdl',
    'alt','ast','ggt','uric_acid','creatinine','vitamin_d','vitamin_b12','hs_crp','tsh','sbp','dbp',
    'resting_hr','steps','sleep_hours'].filter(k => typeof cur.values[k] === 'number');
  b.push(`<h2 class="sec">Where things stand <span>${keys.length} measurements</span></h2>
  <table><colgroup><col style="width:24%"><col style="width:14%"><col style="width:11%">
    <col style="width:12%"><col style="width:17%"><col style="width:22%"></colgroup>
  <thead><tr><th>Measurement</th><th class="num">Latest</th><th class="num">Previous</th>
    <th class="num">Change</th><th>Reading</th><th>Target</th></tr></thead><tbody>
    ${keys.map(k=>{
      const m = R[k], v = cur.values[k], pv = prev ? prev.values[k] : null;
      const st = ADVISOR.statusOf(k, v, ctx);
      const d = typeof pv === 'number' ? round(v - pv, m.dec ?? 1) : null;
      const meaningful = d != null && Math.abs(d) >= (m.lsc || 0);
      const good = d == null ? null : (m.dir === 'higher' ? d > 0 : m.dir === 'lower' ? d < 0 : null);
      const tgt = typeof m.target === 'function' ? m.target(ctx) : m.target;
      return `<tr><td>${esc(m.label)}<div class="tiny muted">${esc(m.group)}</div></td>
        <td class="num"><b>${fmtV(m,v)}</b> <span class="tiny muted">${esc(m.unit)}</span></td>
        <td class="num muted">${pv != null ? fmtV(m,pv) : '—'}</td>
        <td class="num" style="color:${d==null||!meaningful?'var(--ink-3)':good?'var(--good-ink)':'var(--crit-ink)'}">
          ${d != null ? signed(d) + (meaningful ? '' : ' <span class="tiny">(noise)</span>') : '—'}</td>
        <td>${st ? `<span class="pill ${st.s}">${esc(st.t)}</span>` : '<span class="tiny muted">—</span>'}</td>
        <td class="tiny muted">${esc(tgt || '—')}</td></tr>`;
    }).join('')}</tbody></table>`);

  /* charts */
  const trendable = MARKERS.filter(m => V.filter(v => typeof v.values[m.key] === 'number').length >= 2);
  const picks = ['weight','body_fat_pct','hba1c','ldl','triglycerides','waist','visceral_fat_level','sbp']
    .filter(k => trendable.some(m => m.key === k)).slice(0, 4);
  if(picks.length){
    b.push(`<h2 class="sec">Trends <span>${V.length} reports over ${Math.round((new Date(cur.date)-new Date(base.date))/2628e6)} months</span></h2>
      <div class="chartgrid">${picks.map(k=>{
        const m = R[k];
        const pts = V.filter(v=>typeof v.values[k]==='number').map(v=>({v:v.values[k], label:v.short, full:v.full}));
        return `<div class="chart"><h3>${esc(m.label)} · ${esc(m.unit)}</h3>${svgOf(CHARTS.trend(pts, m, ctx))}</div>`;
      }).join('')}</div>`);
  }
  const bc = V.filter(v => typeof v.values.fat_mass === 'number');
  if(bc.length){
    const q = ENGINE.lossQuality(base, cur);
    b.push(`<h2 class="sec">Body composition</h2>
      <div class="chart"><h3>Fat mass and lean mass by visit</h3>${svgOf(CHARTS.bodyComp(bc))}
      <div class="tiny muted" style="margin-top:8px">
        <span style="color:var(--s2)">■</span> Fat mass &nbsp; <span style="color:var(--s1)">■</span> Lean mass</div></div>
      ${q && !q.gaining ? `<div class="box tiny">Of the <b>${q.dW} kg</b> lost since ${base.full},
        <b>${q.dF} kg</b> was fat and <b>${q.dL} kg</b> was lean tissue —
        ${q.dL < 0 ? 'lean mass actually increased' : `a ${Math.min(q.fatShare,100)}% fat fraction against a target of at least 75%`}.</div>` : ''}`);
  }

  /* risk */
  b.push(`<h2 class="sec">Risk screen <span>${ms.count} of 5 metabolic syndrome criteria</span></h2>
  <div class="two">
    <div class="box"><h3 style="font-size:13px;margin-bottom:8px">Metabolic syndrome criteria</h3>
      <table><tbody>${ms.criteria.map(x=>`<tr>
        <td style="padding-left:0">${x.met?'<b style="color:var(--crit-ink)">●</b>':'<span style="color:var(--ink-3)">○</span>'} ${esc(x.k)}</td>
        <td class="num tiny muted" style="text-align:right;padding-right:0">${esc(x.val)}</td></tr>`).join('')}</tbody></table>
      <p class="tiny muted" style="margin-top:8px">Harmonised IDF / AHA definition, South-Asian waist cutoffs. Three of five meets it.</p></div>
    <div class="box"><h3 style="font-size:13px;margin-bottom:8px">Clinical findings</h3>
      ${finds.slice(0,8).map(f=>`<div style="padding:7px 0;border-bottom:1px solid var(--line-soft)">
        <div style="font-size:12.5px;font-weight:600">${esc(f.title)}</div>
        <div class="tiny muted" style="margin-top:2px">${f.body.replace(/<[^>]+>/g,'')}</div></div>`).join('')
        || '<p class="tiny muted">Nothing outside target on this panel.</p>'}</div>
  </div>`);

  /* plan */
  const cards = [['Nutrition', pl.out.nutrition], ['Movement', pl.out.movement],
                 ['Clinical follow-up', pl.out.clinical], ['What to re-test, and when', pl.out.monitoring]]
                 .filter(x => x[1].length);
  b.push(`<h2 class="sec pb">The plan <span>generated from the ${cur.full} report</span></h2>
    <div class="two">${cards.map(([t,items])=>`<div class="box">
      <h3 style="font-size:13px;color:var(--brand-ink)">${esc(t)}</h3>
      <ul style="font-size:12.5px">${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}</div>`);

  if(pl.target) b.push(`<h2 class="sec">Numbers to hit</h2>
    <table><colgroup><col style="width:26%"><col style="width:22%"><col style="width:52%"></colgroup><tbody>
      <tr><td>Daily calories</td><td class="num"><b>${fmtInt(pl.target)}</b> kcal</td>
        <td class="tiny muted">${pl.deficit?`${fmtInt(pl.deficit)} kcal below the estimated ${fmtInt(pl.tdee)} kcal maintenance`:'at maintenance'}</td></tr>
      <tr><td>Daily protein</td><td class="num"><b>${pl.protein}</b> g</td><td class="tiny muted">spread across four eating occasions</td></tr>
      <tr><td>Healthy weight band</td><td class="num"><b>${pl.idealLo}–${pl.idealHi}</b> kg</td><td class="tiny muted">for ${c.height} cm, Asian-Indian BMI 18.5–22.9</td></tr>
      <tr><td>Waist target</td><td class="num"><b>${c.sex==='F'?'< 80':'< 90'}</b> cm</td><td class="tiny muted">${cur.values.waist?`currently ${cur.values.waist} cm`:'not yet measured'}</td></tr>
    </tbody></table>`);

  if(sched.total) b.push(`<h2 class="sec">Schedule <span>${sched.overdue?sched.overdue+' overdue':'up to date'}</span></h2>
    <table><colgroup><col style="width:34%"><col style="width:18%"><col style="width:24%"><col style="width:24%"></colgroup><thead><tr><th>What</th><th>How often</th><th>Last done</th><th>Status</th></tr></thead><tbody>
      ${sched.rows.map(r=>`<tr><td>${esc(r.item.label)}</td>
        <td class="tiny muted">${esc((FREQ[r.item.freq]||{}).label||'')}</td>
        <td class="num tiny">${r.last?fmtDate(r.last):'not yet recorded'}</td>
        <td><span class="pill ${SCHEDULE.sev(r)}">${SCHEDULE.phrase(r)}</span></td></tr>`).join('')}
    </tbody></table>`);

  const shared = (c.notes||[]).filter(n=>n.visible).sort((a,b2)=>b2.date.localeCompare(a.date)).slice(0,6);
  if(shared.length) b.push(`<h2 class="sec">Notes from the clinic</h2>
    ${shared.map(n=>`<div class="note"><span class="d">${shortDate(n.date)}</span>
      <div><p>${esc(n.text)}</p><div class="tiny muted" style="margin-top:4px">${esc(n.byName)}</div></div></div>`).join('')}`);

  b.push(`<div class="warnbox"><b>Not a diagnosis.</b> This document organises measurements a clinician has already
    ordered and flags patterns worth discussing. It does not replace clinical judgement, and no medication should be
    started, stopped or changed on the basis of anything in it.</div>
  <div class="foot"><b>Thresholds.</b> South-Asian cutoffs are used wherever they differ from the international set:
    BMI 23 / 25 rather than 25 / 30, waist 90 cm (men) and 80 cm (women), HOMA-IR 2.5, and the 2025 Indian consensus
    body-fat thresholds. Gender-specific ranges apply to HDL, ALT, AST, GGT, uric acid, creatinine and body fat.
    Changes are only called progress once they clear a least-significant-change threshold; smaller moves are labelled noise.<br><br>
    Issued by LIVYA Metabolic on ${fmtDate(todayISO())} for ${esc(c.name)}${c.mrn?` (${esc(c.mrn)})`:''}.
    Prepared from ${V.length} report${V.length===1?'':'s'} between ${base.full} and ${cur.full}.</div>`);

  return doc(`${c.name} — health summary`, b.join(''),
    {foot:`${c.name}${c.mrn?' · '+c.mrn:''} · health summary`});
}

/* ---------------- diet chart ---------------- */
function dietDoc(c){
  const d = c.diet || emptyDiet();
  const b = [];
  b.push(mast(c, 'Diet chart'));

  if(d.plan.calories || d.plan.protein) b.push(`<div class="box" style="display:flex;gap:26px;flex-wrap:wrap">
    ${d.plan.calories?`<div><div class="tiny muted">Daily calories</div><div class="num" style="font-size:22px;font-weight:600">${fmtInt(d.plan.calories)} <span class="tiny muted">kcal</span></div></div>`:''}
    ${d.plan.protein?`<div><div class="tiny muted">Daily protein</div><div class="num" style="font-size:22px;font-weight:600">${d.plan.protein} <span class="tiny muted">g</span></div></div>`:''}
    <div style="margin-left:auto;text-align:right" class="tiny muted">${d.chart.updatedAt
      ? `Chart updated by ${esc(d.chart.updatedByName)}<br>${fmtWhen(d.chart.updatedAt)}` : 'Not yet issued'}</div>
  </div>`);

  const used = DIET_SLOTS.filter(sl => DAYS.some(([k]) => d.chart.cells[`${k}.${sl.k}`]));
  if(used.length){
    b.push(`<h2 class="sec">The week</h2>
    <table><colgroup><col style="width:11%">${DAYS.map(()=>'<col style="width:12.7%">').join('')}</colgroup>
    <thead><tr><th>Meal</th>
      ${DAYS.map(([k,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>
      ${used.map(sl=>`<tr>
        <td><b style="font-size:12.5px">${sl.label}</b><div class="tiny num muted">${esc(d.chart.times[sl.k]||sl.time)}</div></td>
        ${DAYS.map(([k])=>`<td class="tiny">${esc(d.chart.cells[`${k}.${sl.k}`] || '—')}</td>`).join('')}
      </tr>`).join('')}
    </tbody></table>`);
  } else {
    b.push('<p class="muted" style="margin-top:20px">No diet chart has been written yet.</p>');
  }

  if(d.plan.notes || d.plan.favour || d.plan.limit){
    b.push(`<h2 class="sec">How to eat</h2>`);
    if(d.plan.notes) b.push(`<p style="white-space:pre-wrap;font-size:13px">${esc(d.plan.notes)}</p>`);
    if(d.plan.favour || d.plan.limit) b.push(`<div class="two" style="margin-top:14px">
      ${d.plan.favour?`<div class="box"><h3 style="font-size:12.5px;color:var(--good-ink)">Favour</h3>
        <ul style="font-size:12.5px">${nl2(d.plan.favour).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
      ${d.plan.limit?`<div class="box"><h3 style="font-size:12.5px;color:var(--crit-ink)">Limit</h3>
        <ul style="font-size:12.5px">${nl2(d.plan.limit).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    </div>`);
  }

  const recent = recipesFor(c.id).slice(0,2);
  if(recent.length) b.push(`<h2 class="sec">Recipes from your clinic</h2>
    ${recent.map(r=>`<div class="box" style="margin-bottom:12px">
      <h3 style="font-size:13.5px">${esc(r.title)}</h3>
      <div class="tiny num muted" style="margin:4px 0 8px">${esc(r.meal||'')}${r.calories?` · ${r.calories} kcal`:''}${r.protein?` · ${r.protein} g protein`:''}${r.prepMins?` · ${r.prepMins} min`:''}</div>
      ${r.video?`<div class="tiny" style="margin-bottom:8px">Watch: <a href="${esc(r.video)}">${esc(r.video)}</a></div>`:''}
      <div class="two">
        <div><div class="tiny muted" style="margin-bottom:3px">INGREDIENTS</div>
          <ul style="font-size:12px">${nl2(r.ingredients).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
        <div><div class="tiny muted" style="margin-bottom:3px">METHOD</div>
          <ol style="font-size:12px">${nl2(r.method).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
      </div></div>`).join('')}`);

  if(d.plan.updatedAt) b.push(`<div class="foot">Written by ${esc(d.plan.updatedByName)} on ${fmtWhen(d.plan.updatedAt)}.
    Issued to ${esc(c.name)}${c.mrn?` (${esc(c.mrn)})`:''} on ${fmtDate(todayISO())}.<br><br>
    Portions are a starting point, not a prescription. Tell your coach what is not working rather than abandoning the chart —
    a plan you will actually follow beats a perfect one you will not.</div>`);

  return doc(`${c.name} — diet chart`, b.join(''),
    {landscape:true, foot:`${c.name}${c.mrn?' · '+c.mrn:''} · diet chart`});
}

/* ---------------- markdown fallbacks ---------------- */
function healthMd(c){
  const V = visitsOf(c);
  if(!V.length) return `# ${c.name} — health summary\n\nNo reports on file yet.\n`;
  const cur = V[V.length-1], prev = V.length>1?V[V.length-2]:null, base = V[0];
  const ctx = {sex:c.sex, age:c.age};
  const sc = ENGINE.score(c, cur.values, cur.derived), gr = ENGINE.grade(sc.total);
  const pl = ADVISOR.plan(c, cur, prev);
  const strip = s => String(s).replace(/<[^>]+>/g,'');
  const L = [`# ${c.name} — health summary`, '',
    `${c.sex==='F'?'Female':'Male'} · ${c.age} yrs · ${c.height} cm · ${programLabel(c)}`,
    `Report of ${cur.full} · issued ${fmtDate(todayISO())}`, '',
    `## LIVYA Metabolic Score: ${sc.total ?? '—'} / 100 — ${gr.t}`, ''];
  for(const d of sc.domains) L.push(`- ${d.name}: ${d.s}${d.detail?` (${d.detail})`:''}`);
  L.push('', '## Where things stand', '', '| Measurement | Latest | Previous | Reading | Target |', '|---|---|---|---|---|');
  for(const m of MARKERS){
    const v = cur.values[m.key]; if(typeof v !== 'number') continue;
    const pv = prev ? prev.values[m.key] : null;
    const st = ADVISOR.statusOf(m.key, v, ctx);
    const tgt = typeof m.target === 'function' ? m.target(ctx) : m.target;
    L.push(`| ${m.label} | ${fmtV(m,v)} ${m.unit} | ${pv!=null?fmtV(m,pv):'—'} | ${st?st.t:'—'} | ${tgt||'—'} |`);
  }
  L.push('', '## Findings', '');
  for(const f of ADVISOR.findings(c, cur, prev, base).slice(0,8)) L.push(`- **${f.title}** — ${strip(f.body)}`);
  L.push('', '## The plan', '');
  for(const [t, items] of [['Nutrition',pl.out.nutrition],['Movement',pl.out.movement],
                           ['Clinical follow-up',pl.out.clinical],['What to re-test, and when',pl.out.monitoring]]){
    if(!items.length) continue;
    L.push(`### ${t}`, '');
    for(const i of items) L.push(`- ${strip(i)}`);
    L.push('');
  }
  L.push('---', '', '**Not a diagnosis.** This document organises measurements a clinician has already ordered and flags patterns worth discussing.');
  return L.join('\n');
}

function dietMd(c){
  const d = c.diet || emptyDiet();
  const L = [`# ${c.name} — diet chart`, '', `${programLabel(c)} · issued ${fmtDate(todayISO())}`, ''];
  if(d.plan.calories || d.plan.protein)
    L.push(`**Targets:** ${d.plan.calories?fmtInt(d.plan.calories)+' kcal/day':''}${d.plan.calories&&d.plan.protein?' · ':''}${d.plan.protein?d.plan.protein+' g protein/day':''}`, '');
  for(const [k,l] of DAYS){
    const rows = DIET_SLOTS.filter(sl => d.chart.cells[`${k}.${sl.k}`]);
    if(!rows.length) continue;
    L.push(`## ${l}`, '');
    for(const sl of rows) L.push(`- **${sl.label}** (${d.chart.times[sl.k]||sl.time}) — ${d.chart.cells[`${k}.${sl.k}`]}`);
    L.push('');
  }
  if(d.plan.notes) L.push('## How to eat', '', d.plan.notes, '');
  if(d.plan.favour) L.push('### Favour', '', ...nl2(d.plan.favour).map(x=>`- ${x}`), '');
  if(d.plan.limit)  L.push('### Limit', '', ...nl2(d.plan.limit).map(x=>`- ${x}`), '');
  return L.join('\n');
}

const slug = s => String(s).trim().replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');

async function deliver(c, kind){
  const label = kind === 'health' ? 'health summary' : 'diet chart';
  const stem = `${slug(c.name)}-${kind==='health'?'health-summary':'diet-chart'}-${todayISO()}`;
  const r = await saveAs(`${stem}.html`, kind === 'health' ? healthDoc(c) : dietDoc(c), 'text/html');
  if(r === 'declined') return;
  if(r === 'saved'){
    logAudit('export', `Downloaded the ${label}`, c.id);
    save('Saved — open it and print to PDF if you need one');
    return;
  }
  if(r !== 'unsupported'){
    toast(r === 'too_large' ? 'That document is too large to save here' : 'The download could not be completed');
    return;
  }
  const r2 = await saveAs(`${stem}.md`, kind === 'health' ? healthMd(c) : dietMd(c), 'text/markdown');
  if(r2 === 'declined') return;
  if(r2 === 'saved'){
    logAudit('export', `Downloaded the ${label} (text)`, c.id);
    save('Saved as text — this viewer does not allow web-page downloads, so the charts are left out');

/* =========================================================================
   MESSAGES — one conversation per client. The client talks to their Health
   Assistant; any administrator can see and answer the same thread, so cover
   works when an assistant is away.
   ========================================================================= */
const MSG = (() => {
  const thread = c => (c.messages || []).slice().sort((a,b) => a.at.localeCompare(b.at));

  const unread = (c, who) => (c.messages || [])
    .filter(m => m.byId !== who.id && !(m.readBy || []).includes(who.id)).length;

  function markRead(c, who){
    let n = 0;
    for(const m of c.messages || []){
      if(m.byId === who.id) continue;
      m.readBy = m.readBy || [];
      if(!m.readBy.includes(who.id)){ m.readBy.push(who.id); n++; }
    }
    return n;
  }

  // which clients this person can see a conversation for
  function inbox(who){
    if(who.kind === 'client'){ const c = clientById(who.id); return c ? [c] : []; }
    return DB.clients.slice().sort((a,b) => {
      const la = lastAt(a), lb = lastAt(b);
      return (lb || '').localeCompare(la || '') || a.name.localeCompare(b.name);
    });
  }
  const lastAt = c => { const t = thread(c); return t.length ? t[t.length-1].at : null; };
  const lastMsg = c => { const t = thread(c); return t.length ? t[t.length-1] : null; };

  const totalUnread = who => inbox(who).reduce((n, c) => n + unread(c, who), 0);

  function send(c, text){
    const who = me();
    c.messages = c.messages || [];
    c.messages.push({ id:uid('m'), at:nowISO(), byId:who.id, byName:who.name,
      byRole:who.role, text, readBy:[who.id] });
    logAudit('message', who.kind === 'client' ? 'Sent a message to the clinic' : 'Sent a message to the client', c.id);
  }

  const assistant = c => c && c.assistantId ? DB.users.find(u => u.id === c.assistantId) : null;
  return { thread, unread, markRead, inbox, lastAt, lastMsg, totalUnread, send, assistant };
})();

/* ---------- one chat thread ---------- */
function chatPanel(c, opts){
  const viewerIsClient = me().kind === 'client';
  const t = MSG.thread(c);
  const asst = MSG.assistant(c);
  const other = viewerIsClient
    ? (asst ? {name: asst.name, role: 'subadmin'} : null)
    : {name: c.name, role: 'client'};
  const head = viewerIsClient
    ? (asst
        ? `<div><h3 style="font-size:14.5px">${esc(asst.name)}</h3>
             <p class="tiny muted" style="margin-top:2px">Your Health Assistant · ${esc(asst.email)}</p></div>`
        : `<div><h3 style="font-size:14.5px">Your clinic</h3>
             <p class="tiny muted" style="margin-top:2px">No Health Assistant assigned yet — an administrator will pick one up</p></div>`)
    : `<div><h3 style="font-size:14.5px">${esc(c.name)}</h3>
         <p class="tiny muted" style="margin-top:2px">${asst ? `Health Assistant: ${esc(asst.name)}` : 'No Health Assistant assigned'}${c.mrn?` · ${esc(c.mrn)}`:''}</p></div>`;

  let lastDay = '';
  const bubbles = t.map(m => {
    const day = m.at.slice(0,10);
    const sep = day !== lastDay ? `<div class="daysep"><span>${fmtDate(day)}</span></div>` : '';
    lastDay = day;
    const mine = m.byId === me().id;
    const label = mine ? '' : `${esc(m.byName)} · ${esc(roleFor(m.byRole, viewerIsClient))}`;
    return `${sep}<div class="bub ${mine?'me':'them'}">
      ${label?`<span class="who">${label}</span>`:''}
      <div class="body">${esc(m.text)}</div>
      <span class="ts">${new Date(m.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}${
        mine && (m.readBy||[]).length > 1 ? ' · read' : ''}</span>
    </div>`;
  }).join('');

  return `<div class="card chatcard">
    <div class="pad chathead">${head}
      ${!viewerIsClient && can('message') ? `<button class="btn btn-sm" data-open="${c.id}" data-tab="reports">Open record</button>` : ''}
    </div>
    <div class="chatscroll" id="chatScroll">
      ${t.length ? bubbles : `<div class="empty"><h3>No messages yet</h3>
        <p class="tiny">${viewerIsClient
          ? 'Ask your Health Assistant anything about your plan, your readings or your next appointment.'
          : 'Send the first message — a short check-in is usually enough to start the habit.'}</p></div>`}
    </div>
    ${can('message') ? `<div class="composer">
      <textarea id="msgText" rows="2" placeholder="${viewerIsClient
        ? 'Message your Health Assistant…' : `Message ${esc(c.name.split(' ')[0])}…`}"></textarea>
      <button class="btn btn-p" id="msgSend">Send</button>
    </div>
    <div class="pad tiny muted" style="padding-top:0;padding-bottom:11px">${viewerIsClient
      ? 'Your Health Assistant and the clinic administrator can see this conversation. It is not monitored out of hours — for anything urgent, call the centre.'
      : 'The client and every administrator can see this thread. Anything you would not want them to read belongs in an internal note.'}</div>` : ''}
  </div>`;
}

function wireMessages(){
  const who = me();
  document.querySelectorAll('[data-convo]').forEach(b => b.onclick = () => {
    UI.msgClient = b.dataset.convo; render(); });
  document.querySelectorAll('[data-msgf]').forEach(b => b.onclick = () => {
    UI.msgFilter = b.dataset.msgf; UI.msgClient = null; render(); });

  const c = who.kind === 'client' ? clientById(who.id)
          : (UI.view === 'client' ? clientById(UI.clientId) : (UI.msgClient ? clientById(UI.msgClient) : null));
  if(!c) return;

  const scroll = $('#chatScroll');
  if(scroll) scroll.scrollTop = scroll.scrollHeight;

  // opening a thread marks it read — save quietly, without a re-render
  if(MSG.markRead(c, who)){
    save();
    document.querySelectorAll('[data-nav="messages"]').forEach(b => {
      const p = b.querySelector('.pill'); if(p) p.remove(); });
    const row = document.querySelector(`[data-convo="${c.id}"] .pill`); if(row) row.remove();
  }

  const box = $('#msgText'), send = $('#msgSend');
  if(!box || !send) return;
  const fire = () => {
    const text = box.value.trim();
    if(!text) return;
    MSG.send(c, text);
    save(); render();
    const b2 = $('#msgText'); if(b2) b2.focus();
  };
  send.onclick = fire;
  box.onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); fire(); } };
  if(UI.msgFocus){ box.focus(); UI.msgFocus = false; }
}

      <div><h4 style="font-size:13px;margin-bottom:5px">How thresholds are chosen</h4>

      <div><h4 style="font-size:13px;margin-bottom:5px">Guidelines referenced</h4>

    </div>
    <div class="banner warnb" style="margin-top:14px"><span><b>Not a diagnosis.</b> This tool organises measurements a clinician has already ordered and flags patterns worth discussing. It does not replace clinical judgement, and no medication should be started, stopped or changed on the basis of anything shown here.</span></div>

let lastRoute = '';
function render(){
  if(!me()){ renderLogin(); return; }
  const staff = isStaff();
  let inner = '';
  if(staff){
    if(UI.view==='client' && clientById(UI.clientId)) inner = viewClient();
    else if(UI.view==='files') inner = viewAllFiles();
    else if(UI.view==='programs') inner = can('manage_programs') ? viewPrograms() : viewClients();
    else if(UI.view==='due') inner = viewDue();
    else if(UI.view==='messages') inner = viewMessages();
    else if(UI.view==='recipes') inner = viewRecipes();
    else if(UI.view==='team') inner = can('manage_team') ? viewTeam() : viewClients();
    else if(UI.view==='activity') inner = viewActivity();
    else { UI.view = 'clients'; inner = viewClients(); }
  } else {
    if(UI.view==='myfiles') inner = viewMyFiles();
    else if(UI.view==='messages') inner = viewMyMessages();
    else if(UI.view==='myplan') inner = viewMyPlan();
    else if(UI.view==='recipes') inner = viewClientRecipes();
    else { UI.view = 'health'; inner = '<div id="healthSlot"></div>'; }
  }
  $('#app').innerHTML = shell(inner);
  wireShell();
  wireView();
  const slot = $('#healthSlot');
  if(slot) renderHealth(staff ? clientById(UI.clientId) : clientById(me().id), slot);
  EXPORT.wire();
  const route = UI.view + ':' + (UI.clientId||'') + ':' + UI.tab;
  if(route !== lastRoute){ window.scrollTo({top:0}); lastRoute = route; }
}

function wireReports(c){

    ['dragleave','drop'].forEach(t => drop.addEventListener(t, e=>{ e.preventDefault(); drop.classList.remove('hot'); }));

function wireDetails(c){
  wireNotes(c);
  const sd = $('#saveDetails');
  if(sd) sd.onclick = () => {
    const email = $('#fEmail').value.trim().toLowerCase();
    if(email){
      const clash = DB.clients.find(x=>x.id!==c.id && (x.email||'').toLowerCase()===email)
                 || DB.users.find(u=>(u.email||'').toLowerCase()===email);
      if(clash){ toast('That email address is already registered to another account'); return; }
    }
    const before = c.name;
    c.name = $('#fName').value.trim() || 'Unnamed';
    c.email = email; c.sex = $('#fSex').value; c.age = +$('#fAge').value || 40;
    c.height = +$('#fHt').value || 170; c.mrn = $('#fMrn').value.trim();
    const fa = $('#fAsst');
    if(fa && !fa.disabled){
      const next = fa.value || null;
      if(next !== (c.assistantId || null)){
        c.assistantId = next;
        const u = DB.users.find(x => x.id === next);
        logAudit('assign_assistant', u ? `Assigned ${c.name} to ${u.name}` : `Unassigned ${c.name}`, c.id);
      }
    }
    const pg = $('#fProg');
    if(pg && !pg.disabled){
      const newProg = pg.value || null;
      if(newProg !== (c.programId||null)){
        c.programId = newProg;
        const g = programById(newProg);
        logAudit('program_assign', g ? `Enrolled ${c.name} on ${g.name}` : `Removed ${c.name} from their programme`, c.id);
      }
      c.programStart = $('#fProgStart').value || c.programStart || new Date().toISOString().slice(0,10);
      if(!c.programId) c.programStart = null;
    }
    logAudit('client_edit', `Updated the record for ${before===c.name?c.name:`${before} (now ${c.name})`}`, c.id);
    save('Details saved'); render();
  };
  const rp = $('#resetPw');
  if(rp) rp.onclick = async () => {
    const ok = await confirmDanger('Reset this client\'s password?',
      `${esc(c.name)} will be signed out and asked to create a new password the next time they sign in with <b>${esc(c.email)}</b>.`,
      'Reset password');
    if(!ok) return;
    clearCredentials(c);
    logAudit('password_reset', `Reset the portal password for ${c.name}`, c.id);
    save('Password reset'); render();
  };
  const dc = $('#delClient');
  if(dc) dc.onclick = async () => {
    const nf = filesFor(c.id).length;
    const ok = await confirmDanger('Delete this client record?',
      `<b>${esc(c.name)}</b>, ${c.visits.length} report${c.visits.length===1?'':'s'} and ${nf} file${nf===1?'':'s'} will be permanently removed, and their portal login will stop working. This cannot be undone.`,
      'Delete everything');
    if(!ok) return;
    for(const f of filesFor(c.id)) await FILES.del(f.blobKey).catch(()=>{});
    DB.files = DB.files.filter(f=>f.clientId!==c.id);
    DB.clients = DB.clients.filter(x=>x.id!==c.id);
    logAudit('client_delete', `Deleted the client record for ${c.name}`, null);
    UI.view='clients'; UI.clientId=null;
    save('Client deleted'); render();
  };
}

function clearCredentials(a){ a.pwSet = false; delete a.hash; delete a.salt; delete a.pwSetAt; }

function wireTeam(){
  const ra = $('#resetAll');
  if(ra) ra.onclick = async () => {
    const n = [...DB.users, ...DB.clients].filter(a => a.pwSet).length;
    const ok = await confirmDanger('Reset every password?',
      `All <b>${n}</b> password${n===1?'':'s'} in this workspace — staff and clients — will be cleared, and everyone
       will be signed out. The next time each person signs in with their email address they choose a new password of
       their own. Nothing else is touched: reports, files, notes, charts and programmes all stay exactly as they are.`,
      'Reset every password');
    if(!ok) return;
    for(const a of [...DB.users, ...DB.clients]) clearCredentials(a);
    logAudit('password_reset_all', `Reset every password in the workspace (${n} account${n===1?'':'s'})`);
    save(); clearSession();
    UI.clientId = null; UI.draft = null; resetModuleState();
    LOGIN.mode = 'signin'; LOGIN.error = ''; LOGIN.email = '';
    render();
    toast('Every password cleared — sign in to set a new one');
  };
  document.querySelectorAll('.resetUser').forEach(b => b.onclick = async () => {
    const u = DB.users.find(x => x.id === b.dataset.id); if(!u) return;
    const self = u.id === me().id;
    const ok = await confirmDanger('Reset this password?',
      `<b>${esc(u.name)}</b> will be asked to create a new password the next time they sign in with
       <b>${esc(u.email)}</b>.${self ? ' You are resetting your own — you will be signed out now.' : ''}`,
      'Reset password');
    if(!ok) return;
    clearCredentials(u);
    logAudit('password_reset', `Reset the password for ${u.name}`);
    save('Password reset');
    if(self){ clearSession(); resetModuleState(); }
    render();
  });

  const au = $('#addUser');
  if(au) au.onclick = () => {
    const name = $('#nuName').value.trim(), email = $('#nuEmail').value.trim().toLowerCase();
    if(name.length < 2){ toast('Enter the person\'s name'); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Enter a valid email address'); return; }
    if(accountByEmail(email)){ toast('That email address is already registered'); return; }
    DB.users.push({ id: uid('u'), role:'subadmin', name, email, active:true, pwSet:false,
      createdAt: nowISO(), createdByName: me().name });
    logAudit('user_add', `Created the sub-admin account for ${name}`);
    save(`${name} can now sign in and set a password`); render();
  };
  document.querySelectorAll('.togUser').forEach(b => b.onclick = async () => {
    const u = DB.users.find(x=>x.id===b.dataset.id); if(!u) return;
    if(u.active){
      const ok = await confirmDanger('Deactivate this sub-admin?',
        `<b>${esc(u.name)}</b> will no longer be able to sign in. Their name stays on the reports and files they added.`,
        'Deactivate');
      if(!ok) return;
    }
    u.active = !u.active;
    logAudit(u.active?'user_activate':'user_deactivate', `${u.active?'Reactivated':'Deactivated'} ${u.name}`);
    save(u.active?`${u.name} reactivated`:`${u.name} deactivated`); render();
  });
}

/* =========================================================================
   BOOT
   ========================================================================= */
(async function boot(){
  try{ const t = localStorage.getItem('livya-theme'); if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){}
  await loadDB();
  if(restoreSession()){
    UI.view = isStaff() ? 'clients' : 'health';
    if(!isStaff()) UI.clientId = me().id;
    resetModuleState();
  }
  document.addEventListener('scroll', CHARTS.hideTip, {passive:true});
  render();
})();
</script>
