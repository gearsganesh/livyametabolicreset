    setTimeout(()=>{ const pw=$('#liPw'); if(pw) pw.focus(); }, 30);
  });
  const back = $('#liBack'); if(back) back.onclick = () => { LOGIN.mode='signin'; LOGIN.error=''; renderLogin(); };
  const pw = $('#liPw');
  if(creating && pw) pw.oninput = () => {
    const s = AUTH.strength(pw.value);
    const bar = $('#pwBar');
    bar.style.width = (s/4*100)+'%';
    bar.style.background = s<=1?'var(--crit)':s===2?'var(--warn)':s===3?'var(--serious)':'var(--good)';
    $('#pwHint').textContent = pw.value ? ['Very weak','Weak','Fair','Good','Strong'][s] : 'At least 8 characters, with a letter and a number.';
  };
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#liGo'); btn.disabled = true;
    try{ await submitLogin(); } finally { btn.disabled = false; }
  };
  if(!creating) setTimeout(()=>{ const t = LOGIN.email ? $('#liPw') : $('#liEmail'); if(t) t.focus(); }, 30);
}

async function submitLogin(){
  const email = $('#liEmail').value.trim();
  const pwv = $('#liPw').value;
  LOGIN.email = email; LOGIN.error = '';
  const found = accountByEmail(email);
  if(!found){ LOGIN.error = 'No account is registered with that email address. Check the spelling, or ask the clinic to register you.'; renderLogin(); return; }

  if(LOGIN.mode === 'create'){
    const pw2 = $('#liPw2').value;
    const probs = AUTH.problems(pwv);
    if(probs.length){ LOGIN.error = 'Your password needs ' + probs.join(', ') + '.'; renderLogin(); return; }
    if(pwv !== pw2){ LOGIN.error = 'The two passwords do not match.'; renderLogin(); return; }
    await AUTH.setPassword(found.account, pwv);
    signIn(found);
    logAudit('password_set', `${found.account.name} set their password`, found.kind==='client'?found.account.id:null);
    save();
    return;
  }
  if(!found.account.pwSet){
    LOGIN.mode = 'create'; LOGIN.error = ''; renderLogin();
    setTimeout(()=>{ const p=$('#liPw'); if(p) p.focus(); }, 30);
    return;
  }
  if(!(await AUTH.verify(found.account, pwv))){
    LOGIN.error = 'That password is not right. Try again, or ask the clinic to reset it.'; renderLogin(); return;
  }
  signIn(found);
}

function signIn(found){
  const a = found.account;
  SESSION.principal = found.kind==='user'
    ? {kind:'user', id:a.id, name:a.name, email:a.email, role:a.role}
    : {kind:'client', id:a.id, name:a.name, email:a.email, role:'client'};
  saveSession(found.kind, a.id);
  LOGIN.mode='signin'; LOGIN.error=''; LOGIN.email='';
  logAudit('sign_in', `${a.name} signed in`, found.kind==='client'?a.id:null);
  UI.view = isStaff() ? 'clients' : 'health';
  UI.clientId = found.kind==='client' ? a.id : null;
  resetModuleState();
  save();
  render();
}

// transient per-session view state — never carry it across a sign-in
function resetModuleState(){
  COACH.day = null; COACH.editPlan = false; COACH.import = null;
  PROG.editing = null; PROG.sched = []; RECIPE.open = false;
  UI.dueFilter = 'all';
  UI.tab = 'reports'; UI.q = '';

function signOut(){
  logAudit('sign_out', `${me().name} signed out`);
  save(); clearSession();
  UI.clientId = null; UI.draft = null; UI.editingVisit = null;
  resetModuleState();
  render();
}

function wireShell(){
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {

  });
  const so = $('#signOut'); if(so) so.onclick = signOut;

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur ? (cur==='dark'?'light':'dark') : (sysDark?'light':'dark');
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('livya-theme', next); }catch(e){}
  render();
}

function matchClients(q){
  const t = q.trim().toLowerCase();
  if(!t) return DB.clients.slice();
  return DB.clients.filter(c =>
    (c.name||'').toLowerCase().includes(t) ||
    (c.mrn||'').toLowerCase().includes(t) ||
    (c.email||'').toLowerCase().includes(t));
}
function hl(text, q){
  const t = q.trim(); if(!t) return esc(text);
  const i = String(text).toLowerCase().indexOf(t.toLowerCase());
  if(i < 0) return esc(text);
  return esc(String(text).slice(0,i)) + '<span class="hit">' + esc(String(text).substr(i,t.length)) + '</span>' + esc(String(text).slice(i+t.length));
}

let DL = undefined;

/* Saving a file has two paths. Inside the artifact viewer only the downloads
   capability can hand a file over. Running the app anywhere else — a local
   server, your own host — that capability is absent and an ordinary anchor
   download works. Try the first, fall back to the second. Resolves
   'saved' | 'declined' | 'unsupported' | 'failed'. */
async function saveAs(filename, data, mime){
  if(DL === undefined) DL = await (window.claude && claude.use ? claude.use('downloads') : null);
  if(DL){
    try{ await DL.save({filename, data}); return 'saved'; }
    catch(e){
      const code = e && e.code;
      if(code === 'declined') return 'declined';
      if(code === 'extension_not_enabled' || code === 'rejected_extension') return 'unsupported';
      if(code === 'too_large') return 'too_large';
      return 'failed';
    }
  }
  try{
    const blob = data instanceof Blob ? data : new Blob([data], {type: mime || 'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    return 'saved';
  }catch(e){ return 'failed'; }
}

async function downloadFile(id){
  const f = DB.files.find(x=>x.id===id); if(!f) return;
  const m = me();
  if(m.kind==='client' && f.clientId !== m.id){ toast('You can only download files from your own folder'); return; }
  const blob = await FILES.get(f.blobKey).catch(()=>null);
  if(!blob){ await modal({title:'File not on this device', body:
    `<b>${esc(f.name)}</b> was uploaded on another device. In this prototype the file contents stay on the machine that uploaded them — only the record travels. Ask ${esc(f.uploadedByName)} to re-upload it here, or open the app on that device.`,
    actions:[{label:'Close', value:null}]}); return; }
  const r = await saveAs(f.name, blob, f.type || 'application/octet-stream');
  if(r === 'declined') return;
  if(r === 'saved'){ logAudit('file_download', `Downloaded ${f.name}`, f.clientId); save(); toast('Saved'); return; }
  if(r === 'unsupported') toast(`Saving .${fileExt(f.name).toLowerCase()} files is not enabled in this viewer`);
  else if(r === 'too_large') toast('That file is over the 16 MB download limit');
  else toast('The download could not be completed');
}

async function handleUpload(c, fileList){
  const existing = filesFor(c.id);
  let added = 0, skipped = 0;
  for(const file of fileList){
    if(file.size > 16*1024*1024){
      await modal({title:'File too large', body:`<b>${esc(file.name)}</b> is ${bytes(file.size)}. This prototype accepts files up to 16 MB.`,
        actions:[{label:'Close', value:null}]});
      skipped++; continue;
    }
    let name = file.name;
    const clash = existing.find(f => f.name.toLowerCase() === name.toLowerCase());
    if(clash){
      const choice = await modal({title:'A file with this name already exists',
        body:`<b>${esc(name)}</b> is already in ${esc(c.name)}'s folder — ${bytes(clash.size)}, uploaded by ${esc(clash.uploadedByName)} on ${fmtWhen(clash.uploadedAt)}.`,
        actions:[
          {label:'Skip this file', value:'skip'},
          {label:'Keep both', value:'both'},
          {label: can('delete_file') ? 'Replace it' : 'Replace it (kept in history)', cls:'btn-p', value:'replace'}
        ]});
      if(!choice || choice==='skip'){ skipped++; continue; }
      if(choice==='both'){
        const dot = name.lastIndexOf('.');
        const stem = dot>0 ? name.slice(0,dot) : name, ext = dot>0 ? name.slice(dot) : '';
        let n = 2;
        while(existing.find(f => f.name.toLowerCase() === `${stem} (${n})${ext}`.toLowerCase())) n++;
        name = `${stem} (${n})${ext}`;
      }
      if(choice==='replace'){
        const key = clash.blobKey;
        await FILES.put(key, file);
        clash.size = file.size; clash.type = file.type;
        clash.replacedAt = nowISO(); clash.uploadedByName = me().name; clash.uploadedAt = nowISO();
        logAudit('file_replace', `Replaced ${clash.name}`, c.id);
        added++; continue;
      }
    }
    const key = uid('blob');
    await FILES.put(key, file);
    const rec = { id: uid('f'), clientId: c.id, name, size: file.size, type: file.type || '',
      blobKey: key, uploadedAt: nowISO(), uploadedById: me().id, uploadedByName: me().name };
    DB.files.push(rec); existing.push(rec);
    logAudit('file_upload', `Uploaded ${name}`, c.id);
    added++;
  }
  save(added
    ? `${added} file${added===1?'':'s'} uploaded${skipped?` · ${skipped} skipped`:''}`
    : (skipped ? `${skipped} file${skipped===1?'':'s'} skipped` : 'Nothing uploaded'));
  render();
}

async function ingest(c, files){
  const msg = $('#ingestMsg');
  msg.innerHTML = `<div class="banner info"><span>Reading ${files.length} file${files.length>1?'s':''}…</span></div>`;
  let allText = '', names = [], noText = 0;
  const docs = [];
  for(const f of files){
    try{
      if(/\.txt$/i.test(f.name) || f.type === 'text/plain'){
        const t = await f.text();
        docs.push({lines: t.split(/\r?\n/).map(x=>({text:x})), text:t}); allText += '\n'+t;
      } else {
        const buf = await f.arrayBuffer();
        const res = await PDF.extract(buf);
        if(res.lines.length < 6) noText++;
        docs.push({lines:res.lines, text:res.text}); allText += '\n'+res.text;
      }
      names.push(f.name);
    }catch(e){ noText++; }
  }
  if(!docs.some(d=>d.lines.length)){
    msg.innerHTML = `<div class="banner critb"><span><b>No text could be read from this file.</b> It is almost certainly a scan or a photograph of a printed report — very common for InBody sheets and DEXA printouts. Use <b>Paste report text</b> or <b>Enter values manually</b>, and upload the original to the file manager so it is on record.</span></div>`;
    return;
  }
  buildDraft(c, docs, allText,
    docs.map(d=>PARSE.detectSource(d.text)).filter((x,i,a)=>a.indexOf(x)===i).join(' + '), noText);
}

function buildDraft(c, docs, text, source, noText){
  const found = {}, notes = [];
  for(const d of docs){
    const r = PARSE.parseLines(d.lines, {});
    for(const k in r.found) if(!found[k] || (r.found[k].preferred && !found[k].preferred)) found[k] = r.found[k];
    notes.push(...r.notes);
  }
  const demo = PARSE.parseDemographics(text);
  const rows = Object.keys(found).map(k => ({ key:k, value:found[k].value, unit:found[k].unit, line:found[k].line, on:true }));
  rows.sort((a,b)=> GROUPS.indexOf(R[a.key].group) - GROUPS.indexOf(R[b.key].group) || R[a.key].label.localeCompare(R[b.key].label));
  UI.draft = { date: demo.date || new Date().toISOString().slice(0,10), source, rows, raw:text, notes, demo };
  UI.editingVisit = null;
  const msg = $('#ingestMsg');
  if(msg) msg.innerHTML = rows.length
    ? `<div class="banner goodb"><span><b>${rows.length} value${rows.length===1?'':'s'} read from ${esc(source)}.</b> Check them below before saving.</span></div>`
    : `<div class="banner warnb"><span><b>Text was read, but no recognised test names were found.</b> ${noText?'Part of the file may be a scan. ':''}Check the extracted text below, or enter the values manually.</span></div>`;
  renderReview(c);
  const el = $('#reviewSlot'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function editVisit(c, id){
  const v = c.visits.find(x=>x.id===id); if(!v) return;
  UI.editingVisit = id;
  UI.draft = { date: v.date, source: v.source||'', notes:[], raw:'',
    rows: Object.keys(v.values).sort((a,b)=> GROUPS.indexOf(R[a].group)-GROUPS.indexOf(R[b].group) || R[a].label.localeCompare(R[b].label))
      .map(k => ({key:k, value:v.values[k], unit:R[k].unit, line:'saved value', on:true})) };
  renderReview(c);
  const el = $('#reviewSlot'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

      </tr></thead><tbody id="revBody">
        ${d.rows.map((r,i)=>{
          const m = R[r.key], st = ADVISOR.statusOf(r.key, r.value, ctx);
          return `<tr data-i="${i}">

            <td>${st?`<span class="pill ${st.s}">${esc(st.t)}</span>`:'<span class="tiny muted">—</span>'}</td>
            <td class="tiny muted" style="font-family:var(--mono);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;max-width:170px;white-space:nowrap" title="${esc(r.line||'')}">${esc((r.line||'manual').slice(0,44))}</td>
            <td><button class="btn btn-sm rDel" aria-label="Remove row">×</button></td>

    </div>`;

  slot.querySelectorAll('.rDel').forEach(b => b.onclick = e => {

  slot.querySelectorAll('.rOn').forEach(b => b.onchange = e => {

    if(!isFinite(v)) return;
    d.rows[i].value = v;
    const m = R[d.rows[i].key], st = ADVISOR.statusOf(m.key, v, ctx);
    tr.children[4].innerHTML = st ? `<span class="pill ${st.s}">${esc(st.t)}</span>`
                                  : '<span class="tiny muted">—</span>';
  });
  $('#dDate').onchange = e => d.date = e.target.value;
  $('#dSrc').onchange = e => d.source = e.target.value;
  $('#addRow').onclick = () => {
    const k = $('#addKey').value, v = parseFloat($('#addVal').value);
    if(!isFinite(v)){ toast('Enter a numeric value'); return; }
    const ex = d.rows.find(r=>r.key===k);
    if(ex) ex.value = v; else d.rows.push({key:k, value:v, unit:R[k].unit, line:'manual entry', on:true});
    renderReview(c);
  };
  $('#cancelDraft').onclick = () => { UI.draft = null; UI.editingVisit = null; render(); };
  $('#saveVisit').onclick = () => {
    const vals = {};
    for(const r of d.rows) if(r.on && isFinite(r.value)) vals[r.key] = r.value;
    if(!Object.keys(vals).length){ toast('Nothing selected to save'); return; }
    if(editing){
      Object.assign(orig, {date:d.date, source:d.source, values:vals,
        editedAt: nowISO(), editedByName: me().name, editedById: me().id});
      logAudit('report_edit', `Edited the ${fmtDate(d.date)} report (${Object.keys(vals).length} values)`, c.id);
      save('Report updated');
    } else {
      if(d.demo && d.demo.sex && d.demo.sex!==c.sex) c.sex = d.demo.sex;
      if(d.demo && d.demo.height) c.height = d.demo.height;
      c.visits.push({ id:uid('v'), date:d.date, source:d.source, values:vals,
        createdAt: nowISO(), createdByName: me().name, createdById: me().id });
      logAudit('report_add', `Added the ${fmtDate(d.date)} report (${Object.keys(vals).length} values)`, c.id);
      save(`Report saved — ${Object.keys(vals).length} values`);
    }
    UI.draft = null; UI.editingVisit = null;
    render();
  };
}

function wirePrograms(){
  const sc = PROG.sched;
  const rowOf = el => sc[+el.closest('.schedrow').dataset.i];
  document.querySelectorAll('.scLabel').forEach(el => el.oninput  = () => { rowOf(el).label = el.value; });
  document.querySelectorAll('.scNote').forEach(el  => el.oninput  = () => { rowOf(el).note  = el.value; });
  document.querySelectorAll('.scSelf').forEach(el  => el.onchange = () => { rowOf(el).selfLog = el.checked; });
  document.querySelectorAll('.scFreq').forEach(el  => el.onchange = () => { rowOf(el).freq  = el.value; });
  document.querySelectorAll('.scKind').forEach(el  => el.onchange = () => {
    const r = rowOf(el); r.kind = el.value;
    if(r.kind === 'log'){ r.markers = r.markers.filter(m => LOGGABLE.includes(m)); if(r.selfLog === undefined) r.selfLog = true; }
    render();
  });
  document.querySelectorAll('.scMAdd').forEach(el => el.onchange = () => {
    if(!el.value) return;
    const r = rowOf(el); if(!r.markers.includes(el.value)) r.markers.push(el.value);
    render();
  });
  document.querySelectorAll('.scMDel').forEach(el => el.onclick = () => {
    rowOf(el).markers.splice(+el.dataset.j, 1); render();
  });
  document.querySelectorAll('.scDel').forEach(el => el.onclick = () => {
    sc.splice(+el.closest('.schedrow').dataset.i, 1); render();
  });
  const add = $('#pgAddSched');
  if(add) add.onclick = () => { sc.push({id:uid('s'), label:'', freq:'monthly', kind:'report', markers:[], selfLog:false, note:''}); render(); };
  const pre = $('#pgPreset');
  if(pre) pre.onclick = () => { SCHED_PRESETS.forEach(x => sc.push(Object.assign({id:uid('s'), note:''}, x, {markers:x.markers.slice()}))); render(); };

  const save = $('#pgSave');
  if(save) save.onclick = () => {
    const name = $('#pgName').value.trim();
    const weeks = Math.max(1, Math.min(260, +$('#pgWeeks').value || 0));
    const desc = $('#pgDesc').value.trim();
    if(name.length < 2){ toast('Give the programme a name'); return; }
    if(!weeks){ toast('Set a duration in weeks'); return; }
    const schedule = PROG.sched.filter(x => x.label.trim()).map(x =>
      ({id:x.id, label:x.label.trim(), freq:x.freq, kind:x.kind,
        markers:x.markers.slice(), selfLog:x.kind==='log' ? !!x.selfLog : false, note:(x.note||'').trim()}));
    if(PROG.editing){
      const g = programById(PROG.editing);
      Object.assign(g, {name, durationWeeks:weeks, description:desc, schedule});
      logAudit('program_edit', `Updated the ${name} programme (${schedule.length} scheduled item${schedule.length===1?'':'s'})`);
      PROG.editing = null; PROG.sched = []; save2('Programme updated');
    } else {
      DB.programs.push({ id:uid('g'), name, durationWeeks:weeks, description:desc, schedule,
        active:true, createdAt:nowISO(), createdByName:me().name });
      logAudit('program_add', `Designed the ${name} programme (${durationLabel(weeks)}, ${schedule.length} scheduled item${schedule.length===1?'':'s'})`);
      PROG.sched = []; save2(`${name} created`);
    }
  };
  const cancel = $('#pgCancel'); if(cancel) cancel.onclick = () => { PROG.editing = null; PROG.sched = []; render(); };
  document.querySelectorAll('.editProg').forEach(b => b.onclick = () => {
    PROG.editing = b.dataset.id;
    const g = programById(b.dataset.id);
    PROG.sched = JSON.parse(JSON.stringify(g.schedule || []));
    render();
  });
  document.querySelectorAll('.togProg').forEach(b => b.onclick = () => {
    const g = programById(b.dataset.id); g.active = !g.active;
    logAudit(g.active?'program_activate':'program_retire', `${g.active?'Reactivated':'Retired'} ${g.name}`);
    save2(g.active?`${g.name} reactivated`:`${g.name} retired`);
  });
  document.querySelectorAll('.delProg').forEach(b => b.onclick = async () => {
    const g = programById(b.dataset.id);
    const ok = await confirmDanger('Delete this programme?',
      `<b>${esc(g.name)}</b> has no clients enrolled, so nothing else changes. This cannot be undone.`, 'Delete programme');
    if(!ok) return;
    DB.programs = DB.programs.filter(x=>x.id!==g.id);
    logAudit('program_delete', `Deleted the ${g.name} programme`);
    save2('Programme deleted');
  });
}
function save2(msg){ save(msg); render(); }

  ${can('import_diet') ? importPanel(c) : ''}`;
}

function wireCoaching(c){
  const d = c.diet;
  const day = COACH.day || todayKey();

  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { COACH.day = b.dataset.day; render(); });

  const pe = $('#planEdit');   if(pe) pe.onclick = () => { COACH.editPlan = true; render(); };
  const pc = $('#planCancel'); if(pc) pc.onclick = () => { COACH.editPlan = false; render(); };
  const pf = $('#planPrefill');
  if(pf) pf.onclick = () => {
    const V = visitsOf(c);
    if(!V.length){ toast('No report to draw targets from yet'); return; }
    const cur = V[V.length-1];
    const pl = ADVISOR.plan(c, cur, V.length>1?V[V.length-2]:null);
    d.plan.calories = pl.target ?? d.plan.calories;
    d.plan.protein  = pl.protein ?? d.plan.protein;
    if(!d.plan.notes.trim())
      d.plan.notes = pl.out.nutrition.map(x=>'• '+x.replace(/<[^>]+>/g,'')).join('\n\n');
    COACH.editPlan = true;
    toast(`Prefilled from the ${cur.full} report`);
    render();
  };
  const ps = $('#planSave');
  if(ps) ps.onclick = () => {
    const cal = parseInt($('#plCal').value, 10), pro = parseInt($('#plPro').value, 10);
    d.plan.calories = isFinite(cal) ? cal : null;
    d.plan.protein  = isFinite(pro) ? pro : null;
    d.plan.notes  = $('#plNotes').value.trim();
    d.plan.favour = $('#plFav').value.trim();
    d.plan.limit  = $('#plLim').value.trim();
    d.plan.updatedAt = nowISO(); d.plan.updatedByName = me().name;
    d.history.unshift({at:nowISO(), byName:me().name,
      summary:`Diet plan updated${d.plan.calories?` — ${fmtInt(d.plan.calories)} kcal`:''}${d.plan.protein?`, ${d.plan.protein} g protein`:''}`});
    if(d.history.length > 20) d.history.length = 20;
    logAudit('diet_plan', 'Updated the diet plan', c.id);
    COACH.editPlan = false;
    save('Diet plan updated'); render();
  };

  const readChart = () => {
    document.querySelectorAll('.cell').forEach(t => {
      const v = t.value.trim();
      if(v) d.chart.cells[t.dataset.cell] = v; else delete d.chart.cells[t.dataset.cell];
    });
    document.querySelectorAll('.slotTime').forEach(t => { d.chart.times[t.dataset.slot] = t.value.trim(); });
  };
  const cs = $('#chartSave');
  if(cs) cs.onclick = () => {
    readChart();
    d.chart.updatedAt = nowISO(); d.chart.updatedByName = me().name;
    d.history.unshift({at:nowISO(), byName:me().name, summary:'Diet chart updated'});
    if(d.history.length > 20) d.history.length = 20;
    logAudit('diet_chart', 'Updated the diet chart', c.id);
    save('Diet chart saved'); render();
  };
  const cc = $('#chartCopy');
  if(cc) cc.onclick = () => {
    readChart();
    for(const [k] of DAYS){ if(k===day) continue;
      for(const sl of DIET_SLOTS){
        const v = d.chart.cells[`${day}.${sl.k}`];
        if(v) d.chart.cells[`${k}.${sl.k}`] = v; else delete d.chart.cells[`${k}.${sl.k}`];
      }
    }
    d.chart.updatedAt = nowISO(); d.chart.updatedByName = me().name;
    logAudit('diet_chart', `Copied ${DAYS.find(x=>x[0]===day)[1]} across the whole week`, c.id);
    save('Copied to every day'); render();
  };
  const cl = $('#chartClear');
  if(cl) cl.onclick = () => {
    for(const sl of DIET_SLOTS) delete d.chart.cells[`${day}.${sl.k}`];
    save('Day cleared'); render();
  };

  wireLog(c);
  if(can('import_diet')) wireImport(c);
  wireNotes(c);
}

function wireNotes(c){
  const na = $('#ntAdd');
  if(na) na.onclick = () => {
    const text = $('#ntText').value.trim();
    if(text.length < 3){ toast('Write the note first'); return; }
    c.notes = c.notes || [];
    c.notes.unshift({ id:uid('n'), date:$('#ntDate').value || todayISO(),
      text, visible:$('#ntVis').checked, byName:me().name, at:nowISO() });
    logAudit('note_add', `Added a daily note${$('#ntVis').checked?'':' (internal)'}`, c.id);
    save('Note added'); render();
  };
  document.querySelectorAll('.delNote').forEach(b => b.onclick = async () => {
    const n = (c.notes||[]).find(x=>x.id===b.dataset.id); if(!n) return;
    const ok = await confirmDanger('Delete this note?',
      `The note from <b>${fmtDate(n.date)}</b> by ${esc(n.byName)} will be removed${n.visible?", including from the client's portal":''}. This cannot be undone.`,
      'Delete note');
    if(!ok) return;
    c.notes = c.notes.filter(x=>x.id!==n.id);
    logAudit('note_delete', `Deleted the ${fmtDate(n.date)} note`, c.id);
    save('Note deleted'); render();
  });
}

function wireRecipes(){
  const t = $('#recToggle'); if(t) t.onclick = () => { RECIPE.open = !RECIPE.open; render(); };
  const c2 = $('#rcCancel'); if(c2) c2.onclick = () => { RECIPE.open = false; render(); };
  const srch = $('#recSearch');
  if(srch) srch.oninput = () => {
    UI.recipeQ = srch.value; render();
    const f = $('#recSearch'); if(f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
  };
  document.querySelectorAll('[data-rscope]').forEach(b => b.onclick = () => { UI.recipeScope = b.dataset.rscope; render(); });

  const sv = $('#rcSave');
  if(sv) sv.onclick = () => {
    const title = $('#rcTitle').value.trim();
    if(title.length < 3){ toast('Give the recipe a title'); return; }
    const vid = $('#rcVid').value.trim();
    if(vid && !/^https?:\/\//i.test(vid)){ toast('The video link needs to start with http:// or https://'); return; }
    const num = id => { const v = parseInt($(id).value,10); return isFinite(v)?v:null; };
    const all = $('#rcShareAll').checked;
    DB.recipes = DB.recipes || [];
    DB.recipes.unshift({ id:uid('r'), title,
      date: $('#rcDate').value || todayISO(),
      meal: $('#rcMeal').value, prepMins:num('#rcPrep'), servings:num('#rcServ'),
      calories:num('#rcCal'), protein:num('#rcPro'),
      sharedAll: all, sharedWith: [], deleteRequest: null, video: vid,
      ingredients:$('#rcIng').value.trim(), method:$('#rcMeth').value.trim(),
      tip:$('#rcTip').value.trim(), byId:me().id, byName:me().name, at:nowISO() });
    logAudit('recipe_add', `Added "${title}" to the recipe library${all?' and shared it with every client':''}${vid?' (with video)':''}`);
    RECIPE.open = false;
    save(all ? 'Recipe added and shared' : 'Recipe added to the library'); render();
  };

  /* ---- sharing ---- */
  document.querySelectorAll('.shareRec').forEach(b => b.onclick = () => {
    UI.shareRecipe = UI.shareRecipe === b.dataset.id ? null : b.dataset.id; render(); });
  document.querySelectorAll('.shAll').forEach(b => b.onchange = () => {
    const r = DB.recipes.find(x=>x.id===b.dataset.id); if(!r) return;
    r.sharedAll = b.checked;
    logAudit('recipe_share', `${b.checked?'Shared':'Unshared'} "${r.title}" with every client`);
    save(b.checked ? 'Shared with every client' : 'No longer shared with everyone'); render();
  });
  document.querySelectorAll('.shOne').forEach(b => b.onchange = () => {
    const r = DB.recipes.find(x=>x.id===b.dataset.id); if(!r) return;
    const cid = b.dataset.c, c = clientById(cid);
    r.sharedWith = r.sharedWith || [];
    if(b.checked){
      if(!r.sharedWith.some(x=>x.clientId===cid)) r.sharedWith.push({clientId:cid, at:nowISO(), byName:me().name});
      logAudit('recipe_share', `Shared "${r.title}" with ${c?c.name:'a client'}`, cid);
    } else {
      r.sharedWith = r.sharedWith.filter(x=>x.clientId!==cid);
      logAudit('recipe_share', `Stopped sharing "${r.title}" with ${c?c.name:'a client'}`, cid);
    }
    save(b.checked ? `Shared with ${c?c.name.split(' ')[0]:'client'}` : 'Sharing removed'); render();
  });

  /* ---- deletion: administrators delete, assistants ask ---- */
  document.querySelectorAll('.delRecipe').forEach(b => b.onclick = async () => {
    const r = DB.recipes.find(x=>x.id===b.dataset.id); if(!r) return;
    const n = sharedCount(r);
    const ok = await confirmDanger('Delete this recipe?',
      `<b>${esc(r.title)}</b> will be removed from the library${n?` and from the ${n} client portal${n===1?'':'s'} it is shared with`:''}. This cannot be undone.`,
      'Delete recipe');
    if(!ok) return;
    DB.recipes = DB.recipes.filter(x=>x.id!==r.id);
    logAudit('recipe_delete', `Deleted "${r.title}" from the recipe library`);
    save('Recipe deleted'); render();
  });
  document.querySelectorAll('.reqDel').forEach(b => b.onclick = async () => {
    const r = DB.recipes.find(x=>x.id===b.dataset.id); if(!r) return;
    const res = await modal({title:'Ask an administrator to delete this?',
      body:`You can add and share recipes, but only an administrator can remove one. <b>${esc(r.title)}</b> stays live until they decide.`,
      input:{label:'Why should it go?', placeholder:'Duplicate of the millet dosa recipe'},
      actions:[{label:'Cancel', value:null},{label:'Send the request', cls:'btn-p', value:true}]});
    if(!res || !res.value) return;
    r.deleteRequest = {byId:me().id, byName:me().name, at:nowISO(), reason:(res.text||'').trim()};
    logAudit('recipe_delete_request', `Asked for "${r.title}" to be deleted${res.text?` — ${res.text.trim()}`:''}`);
    save('Request sent to the administrator'); render();
  });
  document.querySelectorAll('.cancelReq').forEach(b => b.onclick = () => {
    const r = DB.recipes.find(x=>x.id===b.dataset.id); if(!r) return;
    r.deleteRequest = null;
    logAudit('recipe_delete_request', `Withdrew the deletion request for "${r.title}"`);
    save('Request withdrawn'); render();
  });
  document.querySelectorAll('.okDel').forEach(b => b.onclick = async () => {
    const r = DB.recipes.find(x=>x.id===b.dataset.id); if(!r) return;
    const n = sharedCount(r);
    const ok = await confirmDanger('Approve this deletion?',
      `<b>${esc(r.title)}</b> was flagged by ${esc(r.deleteRequest.byName)}. It will be removed from the library${n?` and from the ${n} client portal${n===1?'':'s'} it is shared with`:''}. This cannot be undone.`,
      'Approve and delete');
    if(!ok) return;
    const by = r.deleteRequest.byName;
    DB.recipes = DB.recipes.filter(x=>x.id!==r.id);
    logAudit('recipe_delete', `Approved ${by}'s request and deleted "${r.title}"`);
    save('Recipe deleted'); render();
  });
  document.querySelectorAll('.declineDel').forEach(b => b.onclick = () => {
    const r = DB.recipes.find(x=>x.id===b.dataset.id); if(!r) return;
    const by = r.deleteRequest.byName;
    r.deleteRequest = null;
    logAudit('recipe_delete_request', `Declined ${by}'s request to delete "${r.title}"`);
    save('Request declined — the recipe stays'); render();
  });
}

function viewMyPlan(){
  const c = clientById(me().id);

/* =========================================================================
   SPREADSHEET READER — .xlsx and .csv, no dependencies.
   An .xlsx is a ZIP of XML: the reader walks the central directory, inflates
   each entry with the platform DecompressionStream, and parses the sheet XML
   with DOMParser. Returns a plain grid of strings per sheet.
   ========================================================================= */
const SHEET = (() => {
  const dv = b => new DataView(b.buffer, b.byteOffset, b.byteLength);

  async function inflateRaw(u8){
    if(!u8.length) return u8;
    try{
      const ds = new DecompressionStream('deflate-raw');
      const buf = await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
      return new Uint8Array(buf);
    }catch(e){ return null; }
  }

  /* --- minimal ZIP central-directory reader --- */
  async function unzip(u8){
    const d = dv(u8);
    let eocd = -1;
    for(let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
      if(d.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
    }
    if(eocd < 0) throw new Error('Not a zip archive');
    const count = d.getUint16(eocd + 10, true);
    let p = d.getUint32(eocd + 16, true);
    const out = {};
    for(let n = 0; n < count; n++){
      if(d.getUint32(p, true) !== 0x02014b50) break;
      const method = d.getUint16(p + 10, true);
      const csize  = d.getUint32(p + 20, true);
      const nameLen = d.getUint16(p + 28, true);
      const extraLen = d.getUint16(p + 30, true);
      const cmtLen = d.getUint16(p + 32, true);
      const lho = d.getUint32(p + 42, true);
      const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen));
      p += 46 + nameLen + extraLen + cmtLen;
      if(d.getUint32(lho, true) !== 0x04034b50) continue;
      const lNameLen = d.getUint16(lho + 26, true);
      const lExtraLen = d.getUint16(lho + 28, true);
      const start = lho + 30 + lNameLen + lExtraLen;
      const raw = u8.subarray(start, start + csize);
      out[name] = method === 0 ? raw : await inflateRaw(raw);
    }
    return out;
  }

  const text = u8 => u8 ? new TextDecoder().decode(u8) : '';
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');

  function colIndex(ref){
    let n = 0;
    for(const ch of ref){
      const c = ch.charCodeAt(0);
      if(c < 65 || c > 90) break;
      n = n * 26 + (c - 64);
    }
    return n - 1;
  }

  async function readXlsx(buf){
    const files = await unzip(new Uint8Array(buf));
    const shared = [];
    if(files['xl/sharedStrings.xml']){
      const doc = xml(text(files['xl/sharedStrings.xml']));
      for(const si of doc.getElementsByTagName('si')){
        let s = '';
        for(const t of si.getElementsByTagName('t')) s += t.textContent;
        shared.push(s);
      }
    }
    let names = [];
    if(files['xl/workbook.xml']){
      const doc = xml(text(files['xl/workbook.xml']));
      names = [...doc.getElementsByTagName('sheet')].map(s => s.getAttribute('name') || '');
    }
    const paths = Object.keys(files)
      .filter(k => /^xl\/worksheets\/sheet\d+\.xml$/.test(k))
      .sort((a, b) => (+a.match(/(\d+)/)[1]) - (+b.match(/(\d+)/)[1]));
    const sheets = [];
    paths.forEach((path, i) => {
      const doc = xml(text(files[path]));
      const grid = [];
      for(const row of doc.getElementsByTagName('row')){
        const r = (+row.getAttribute('r') || grid.length + 1) - 1;
        const cells = [];
        for(const c of row.getElementsByTagName('c')){
          const ref = c.getAttribute('r') || '';
          const ci = ref ? colIndex(ref) : cells.length;
          const t = c.getAttribute('t');
          let v = '';
          if(t === 'inlineStr'){
            for(const tn of c.getElementsByTagName('t')) v += tn.textContent;
          } else {
            const vn = c.getElementsByTagName('v')[0];
            const raw = vn ? vn.textContent : '';
            v = (t === 's') ? (shared[+raw] ?? '') : raw;
          }
          cells[ci] = String(v == null ? '' : v).trim();
        }
        grid[r] = cells;
      }
      for(let i2 = 0; i2 < grid.length; i2++) if(!grid[i2]) grid[i2] = [];
      sheets.push({ name: names[i] || `Sheet ${i + 1}`, grid });
    });
    if(!sheets.length) throw new Error('No worksheet found in this file');
    return sheets;
  }

  /* --- CSV / TSV --- */
  function readDelimited(str){
    const delim = (str.split('\t').length > str.split(',').length) ? '\t' : ',';
    const grid = [];
    let row = [], cell = '', q = false;
    for(let i = 0; i < str.length; i++){
      const ch = str[i];
      if(q){
        if(ch === '"'){ if(str[i + 1] === '"'){ cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if(ch === '"'){ q = true; }
      else if(ch === delim){ row.push(cell.trim()); cell = ''; }
      else if(ch === '\n'){ row.push(cell.trim()); grid.push(row); row = []; cell = ''; }
      else if(ch !== '\r'){ cell += ch; }
    }
    row.push(cell.trim());
    if(row.some(x => x)) grid.push(row);
    return [{ name: 'Sheet 1', grid }];
  }

  async function read(file){
    if(/\.(csv|tsv|txt)$/i.test(file.name)) return readDelimited(await file.text());
    return readXlsx(await file.arrayBuffer());
  }
  return { read, readXlsx, readDelimited };
})();

/* =========================================================================
   DIET IMPORT — turn a spreadsheet grid into a diet chart.
   Handles both common layouts (meal slots down the side with days across the
   top, or the transpose) plus a long "one row per meal" format, and reads
   calorie / protein targets and guidance blocks where they are present.
   ========================================================================= */
const DIETIMPORT = (() => {
  const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[\s._\-–—]+/g, ' ').trim();

  const DAY_ALIAS = {
    mon:['mon','monday','day 1','d1'], tue:['tue','tues','tuesday','day 2','d2'],
    wed:['wed','weds','wednesday','day 3','d3'], thu:['thu','thur','thurs','thursday','day 4','d4'],
    fri:['fri','friday','day 5','d5'], sat:['sat','saturday','day 6','d6'],
    sun:['sun','sunday','day 7','d7']
  };
  const SLOT_ALIAS = {
    early:['early morning','early','on waking','wake up','bed tea','pre breakfast','morning drink','empty stomach'],
    breakfast:['breakfast','b fast','morning meal','brunch'],
    midmorning:['mid morning','midmorning','forenoon','snack 1','mid morning snack','11 am','morning snack'],
    lunch:['lunch','afternoon meal','noon'],
    evening:['evening','evening snack','tea time','tea','snack 2','4 pm','high tea','teatime'],
    dinner:['dinner','supper','night meal'],
    bedtime:['bedtime','bed time','before bed','post dinner','night','bed']
  };

  const matchKey = (v, table) => {
    const n = norm(v);
    if(!n) return null;
    for(const k in table){
      for(const a of table[k]) if(n === a || n.startsWith(a + ' ') || n === k) return k;
    }
    for(const k in table){
      for(const a of table[k]) if(a.length > 3 && n.includes(a)) return k;
    }
    return null;
  };
  const isTime = v => /^\s*\d{1,2}[:.]\d{2}\s*(am|pm)?\s*$/i.test(v) || /^\s*\d{1,2}\s*(am|pm)\s*$/i.test(v);
  const tidyTime = v => {
    const m = String(v).match(/^\s*(\d{1,2})[:.]?(\d{2})?\s*(am|pm)?\s*$/i);
    if(!m) return null;
    let h = +m[1]; const mm = m[2] || '00'; const ap = (m[3] || '').toLowerCase();
    if(ap === 'pm' && h < 12) h += 12;
    if(ap === 'am' && h === 12) h = 0;
    return String(h).padStart(2, '0') + ':' + mm;
  };
  const num = v => { const m = String(v).replace(/,/g, '').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };

  function scoreRow(row, table){
    let n = 0;
    for(const cell of row) if(matchKey(cell, table)) n++;
    return n;
  }

  function analyse(grid){
    const res = { cells:{}, times:{}, plan:{}, layout:null, filled:0, warnings:[] };
    if(!grid || !grid.length){ res.warnings.push('The sheet is empty.'); return res; }

    // ---- targets and guidance, wherever they sit ----
    const guidance = {notes:[], favour:[], limit:[]};
    grid.forEach((row, r) => {
      row.forEach((cell, c) => {
        const n = norm(cell);
        if(!n) return;
        const rest = row.slice(c + 1).filter(x => String(x).trim());
        const after = rest.length ? rest.join(' ') : (grid[r + 1] && grid[r + 1][c]) || '';
        if(/^(daily )?(calorie|calories|kcal|energy)( target| \/ day| per day)?$/.test(n) && res.plan.calories == null)
          res.plan.calories = num(after);
        if(/^(daily )?protein( target| g| \(g\)| \/ day| per day)?$/.test(n) && res.plan.protein == null)
          res.plan.protein = num(after);
        if(/^(favour|prefer|include|foods to (favour|include|prefer)|recommended foods)$/.test(n) && after) guidance.favour.push(after);
        if(/^(limit|avoid|restrict|foods to (limit|avoid|restrict))$/.test(n) && after) guidance.limit.push(after);
        if(/^(notes?|guidance|instructions?|general instructions?|principles)$/.test(n) && after) guidance.notes.push(after);
      });
    });
    if(guidance.notes.length)  res.plan.notes  = guidance.notes.join('\n');
    if(guidance.favour.length) res.plan.favour = guidance.favour.join('\n');
    if(guidance.limit.length)  res.plan.limit  = guidance.limit.join('\n');

    const put = (day, slot, v) => {
      const t = String(v == null ? '' : v).trim();
      if(!t || t === '-' || t === '—' || /^n\/?a$/i.test(t)) return;
      res.cells[`${day}.${slot}`] = t;
      res.filled++;
    };

    // ---- long format: a header row naming Day, Meal and Items ----
    for(let r = 0; r < grid.length; r++){
      const hn = (grid[r] || []).map(norm);
      const at = re => hn.findIndex(x => re.test(x));
      const cDay  = at(/^(day|days|week ?day)$/);
      const cMeal = at(/^(meal|meals|slot|time slot|meal time|meal type|session)$/);
      const cItem = at(/^(item|items|food|foods|menu|meal plan|diet|description|details|preparation)$/);
      if(cDay < 0 || cMeal < 0 || cItem < 0) continue;
      const cTime = at(/^time$/);
      let n = 0;
      for(let i = r + 1; i < grid.length; i++){
        const row = grid[i]; if(!row) continue;
        const day = matchKey(row[cDay], DAY_ALIAS), slot = matchKey(row[cMeal], SLOT_ALIAS);
        if(!day || !slot) continue;
        put(day, slot, row[cItem]); n++;
        if(cTime >= 0){ const t = tidyTime(row[cTime]); if(t) res.times[slot] = t; }
      }
      if(n){ res.layout = 'one row per meal'; return res; }
    }

    // ---- find the header row: the best day row and the best meal row, judged apart ----
    let hDay = {r:-1, n:0}, hSlot = {r:-1, n:0};
    grid.forEach((row, r) => {
      const d = scoreRow(row, DAY_ALIAS), sl = scoreRow(row, SLOT_ALIAS);
      if(d  > hDay.n)  hDay  = {r, n:d};
      if(sl > hSlot.n) hSlot = {r, n:sl};
    });

    // ---- days across the top, meals down the side ----
    if(hDay.n >= 2 && hDay.n >= hSlot.n){
      const headerRow = grid[hDay.r];
      const dayCols = {};
      headerRow.forEach((cell, c) => { const k = matchKey(cell, DAY_ALIAS); if(k && dayCols[k] === undefined) dayCols[k] = c; });
      for(let r = hDay.r + 1; r < grid.length; r++){
        const row = grid[r]; if(!row) continue;
        let slot = null, slotCol = -1;
        for(let c = 0; c < Math.min(row.length, 4); c++){
          const k = matchKey(row[c], SLOT_ALIAS);
          if(k){ slot = k; slotCol = c; break; }
        }
        if(!slot) continue;
        for(let c = slotCol + 1; c < row.length; c++){
          const v = String(row[c] || '').trim(); if(!v) continue;
          if(isTime(v)){ const t = tidyTime(v); if(t) res.times[slot] = t; }
          break;
        }
        for(const day in dayCols) put(day, slot, row[dayCols[day]]);
      }
      res.layout = 'days across the top, meals down the side';
      if(res.filled) return res;
      res.warnings.push('Day columns were found but no row started with a recognised meal name.');
    }

    // ---- meals across the top, days down the side ----
    if(hSlot.n >= 2){
      const headerRow = grid[hSlot.r];
      const slotCols = {};
      headerRow.forEach((cell, c) => { const k = matchKey(cell, SLOT_ALIAS); if(k && slotCols[k] === undefined) slotCols[k] = c; });
      const timeRow = grid[hSlot.r + 1] || [];
      const timeRowIsTimes = timeRow.filter(isTime).length >= 2;
      if(timeRowIsTimes) for(const slot in slotCols){ const t = tidyTime(timeRow[slotCols[slot]]); if(t) res.times[slot] = t; }
      for(let r = hSlot.r + 1 + (timeRowIsTimes ? 1 : 0); r < grid.length; r++){
        const row = grid[r]; if(!row) continue;
        let day = null;
        for(let c = 0; c < Math.min(row.length, 3); c++){ const k = matchKey(row[c], DAY_ALIAS); if(k){ day = k; break; } }
        if(!day) continue;
        for(const slot in slotCols) put(day, slot, row[slotCols[slot]]);
      }
      if(res.filled){ res.layout = 'meals across the top, days down the side'; res.warnings.length = 0; return res; }
    }

    // ---- a single unnamed day: meal name, optional time, then the food ----
    for(let r = 0; r < grid.length; r++){
      const row = grid[r]; if(!row) continue;
      const slot = matchKey(row[0], SLOT_ALIAS);
      if(!slot) continue;
      let val = '', t = null;
      for(let c = 1; c < row.length; c++){
        const v = String(row[c] || '').trim(); if(!v) continue;
        if(!t && isTime(v)){ t = tidyTime(v); continue; }
        val = val ? val + ' · ' + v : v;
      }
      if(t) res.times[slot] = t;
      if(val) for(const [d] of DAYS) put(d, slot, val);
    }
    if(res.filled){
      res.layout = 'one day, applied to the whole week';
      res.warnings.length = 0;
      return res;
    }

    res.warnings.push('No day or meal headings were recognised. Check the sheet against the template, or type the chart in by hand.');
    return res;
  }

  const TEMPLATE_CSV =
`Diet chart,,,,,,,
Calories,1988,,,,,,
Protein,117,,,,,,
,,,,,,,
Meal,Time,Mon,Tue,Wed,Thu,Fri,Sat,Sun
Early morning,06:30,Warm water with lime · 8 soaked almonds,Warm water with lime · 8 soaked almonds,Warm water with lime,Warm water with lime,Warm water with lime,Warm water with lime,Warm water with lime
Breakfast,08:30,3-egg omelette · 2 multigrain toast,Vegetable oats upma · 1 boiled egg,Besan chilla (2) with paneer,Idli (3) with sambar · 1 boiled egg,Thick curd with seeds,Masala dosa (1) · sambar,Egg frittata (3 eggs)
Mid-morning,11:00,Sprouted moong salad,Buttermilk · roasted chana,Sprouted moong salad,Buttermilk · 1 orange,Sprouted moong salad,Buttermilk · 10 almonds,Fruit bowl with seeds
Lunch,13:30,2 millet rotis · dal · sabzi · curd,2 rotis · rajma · salad,1 cup brown rice · sambar · poriyal,2 rotis · chana masala · curd,2 millet rotis · fish curry,Eating out — protein first,1 cup rice · dal · sabzi · curd
Evening,16:30,Green tea · 25 g nuts,Green tea · 1 apple,Green tea · 25 g walnuts,Green tea · roasted chana,Green tea · 1 pear,Green tea,Green tea · 25 g nuts
Dinner,19:30,Grilled fish (150 g) · greens,Chicken curry (150 g) · 2 rotis,Egg bhurji (3) · greens · 1 roti,Grilled chicken (150 g) · vegetables,Paneer tikka (150 g) · greens,Vegetable soup · grilled fish,Moong dal khichdi · curd
Bedtime,21:30,Warm turmeric milk,Warm turmeric milk,Warm turmeric milk,Warm turmeric milk,Warm turmeric milk,Warm turmeric milk,Warm turmeric milk
,,,,,,,
Favour,"Eggs, fish, chicken, paneer, curd, dals",,,,,,
Limit,"Fruit juice, bakery, deep-fried snacks",,,,,,
Notes,Four eating occasions with roughly 30 g protein at each.,,,,,,`;

  return { analyse, TEMPLATE_CSV };
})();

/* =========================================================================
   DIET IMPORT — upload panel, preview and apply
   ========================================================================= */
function importPanel(c){
  const imp = COACH.import;
  if(!imp) return `<div class="card pad" style="margin-top:14px">
    <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">

function wireImport(c){
  const pick = $('#dietPick'), file = $('#dietFile');
  if(pick && file){
    pick.onclick = () => file.click();
    file.onchange = () => { if(file.files.length) readDietFile(c, file.files[0]); };
  }
  const drop = $('#chartCard');
  if(drop && can('import_diet')){
    ['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('hot'); }));
    ['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('hot'); }));
    drop.addEventListener('drop', e => { if(e.dataTransfer.files.length) readDietFile(c, e.dataTransfer.files[0]); });
  }
  const tpl = $('#dietTpl');
  if(tpl) tpl.onclick = async () => {
    let r = await saveAs('livya-diet-chart-template.csv', DIETIMPORT.TEMPLATE_CSV, 'text/csv');
    if(r === 'declined') return;
    if(r === 'saved'){ toast('Template saved'); return; }
    if(r === 'unsupported'){
      r = await saveAs('livya-diet-chart-template.txt', DIETIMPORT.TEMPLATE_CSV, 'text/plain');
      toast(r === 'saved' ? 'Template saved as .txt — rename it to .csv' : 'The template could not be saved here');
      return;
    }
    toast('The template could not be saved here');
  };

  const sel = $('#dietSheet');
  if(sel) sel.onchange = () => {
    COACH.import.sheetIndex = +sel.value;
    COACH.import.result = DIETIMPORT.analyse(COACH.import.sheets[COACH.import.sheetIndex].grid);
    render();
  };
  document.querySelectorAll('input[name="impMode"]').forEach(b => b.onchange = () => { COACH.import.mode = b.value; });
  const cancel = $('#dietCancel'); if(cancel) cancel.onclick = () => { COACH.import = null; render(); };
  const apply = $('#dietApply');
  if(apply) apply.onclick = () => {
    const imp = COACH.import, r = imp.result, d = c.diet;
    if(imp.mode === 'replace') d.chart.cells = {};
    let written = 0;
    for(const key in r.cells){
      if(imp.mode === 'fill' && d.chart.cells[key]) continue;
      d.chart.cells[key] = r.cells[key]; written++;
    }
    for(const slot in r.times) d.chart.times[slot] = r.times[slot];
    const planBits = [];
    if(r.plan.calories != null){ d.plan.calories = r.plan.calories; planBits.push('calories'); }
    if(r.plan.protein  != null){ d.plan.protein  = r.plan.protein;  planBits.push('protein'); }
    if(r.plan.notes  && !d.plan.notes.trim()){  d.plan.notes  = r.plan.notes;  planBits.push('guidance'); }
    if(r.plan.favour && !d.plan.favour.trim()){ d.plan.favour = r.plan.favour; planBits.push('favour list'); }
    if(r.plan.limit  && !d.plan.limit.trim()){  d.plan.limit  = r.plan.limit;  planBits.push('limit list'); }
    const stamp = nowISO();
    d.chart.updatedAt = stamp; d.chart.updatedByName = me().name;
    if(planBits.length){ d.plan.updatedAt = stamp; d.plan.updatedByName = me().name; }
    d.history.unshift({at:stamp, byName:me().name,
      summary:`Imported ${written} meal${written===1?'':'s'} from ${imp.fileName}${planBits.length?` (also ${planBits.join(', ')})`:''}`});
    if(d.history.length > 20) d.history.length = 20;
    logAudit('diet_import', `Imported the diet chart from ${imp.fileName} (${written} meals)`, c.id);
    COACH.import = null;
    save(written
      ? `${written} meal${written===1?'':'s'} imported`
      : 'Every slot already had something in it — nothing changed');
    render();
  };
}

async function readDietFile(c, f){
  const msg = $('#dietMsg');
  if(msg) msg.innerHTML = `<div class="banner info"><span>Reading ${esc(f.name)}…</span></div>`;
  try{
    const sheets = await SHEET.read(f);
    // pick the sheet with the most recognised meals
    let bestIndex = 0, bestScore = -1, bestResult = null;
    sheets.forEach((s, i) => {
      const res = DIETIMPORT.analyse(s.grid);
      if(res.filled > bestScore){ bestScore = res.filled; bestIndex = i; bestResult = res; }
    });
    COACH.import = { fileName:f.name, sheets, sheetIndex:bestIndex, result:bestResult, mode:'replace' };
    render();
    const el = $('#chartCard'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }catch(e){
    const why = /zip/i.test(e.message||'') ? 'It is not an Excel workbook.' : esc(e.message||'');
    if(msg) msg.innerHTML = `<div class="banner critb"><span><b>${esc(f.name)} could not be read.</b> ${why}
      Modern Excel workbooks (.xlsx) and CSV files work; older .xls files, Numbers files and PDFs do not —
      open it and save a copy as .xlsx or .csv first.</span></div>`;
  }
}


/* =========================================================================
   SCHEDULER — what each client owes, when it was last done, what is overdue.
   Reads report dates for anything that needs a lab or a scan, and the daily
   check-in log for anything the client records themselves.
   ========================================================================= */
const SCHEDULE = (() => {
  const lastDate = (c, item) => {
    const has = vals => !item.markers.length || item.markers.some(m => vals[m] != null);
    const dates = item.kind === 'log'
      ? (c.checkins || []).filter(k => has(k.values || {})).map(k => k.date)
      : (c.visits || []).filter(v => has(v.values || {})).map(v => v.date);
    if(!dates.length) return null;
    return dates.sort().pop();
  };

  function status(c){
    const g = programOf(c);
    if(!g || !(g.schedule || []).length) return [];
    const today = startOfDay(new Date());
    const start = c.programStart ? parseDay(c.programStart) : startOfDay(new Date(c.createdAt));
    return g.schedule.map(item => {
      const period = (FREQ[item.freq] || FREQ.monthly).days;
      const last = lastDate(c, item);
      // never recorded: treat it as due now rather than overdue since day one of the
      // programme — an item added in month nine should not read as 200 days late
      const due = last ? new Date(parseDay(last).getTime() + period * DAY_MS)
                       : new Date(Math.max(start.getTime(), today.getTime() - period * DAY_MS));
      const overdue = Math.round((today - due) / DAY_MS);
      const state = overdue > 0 ? 'overdue' : overdue === 0 ? 'due' : 'ok';
      return { item, last, due, overdueDays: overdue, state,
               inDays: -overdue, never: !last, period };
    }).sort((a, b) => b.overdueDays - a.overdueDays);
  }

  function summary(c){
    const rows = status(c);
    return { rows,
      overdue: rows.filter(r => r.state === 'overdue').length,
      due:     rows.filter(r => r.state === 'due').length,
      total:   rows.length };
  }

  function queue(){
    const out = [];
    for(const c of DB.clients){
      for(const r of status(c)) if(r.state !== 'ok') out.push({ c, ...r });
    }
    return out.sort((a, b) => b.overdueDays - a.overdueDays || a.c.name.localeCompare(b.c.name));
  }

  const sev = r => r.state === 'ok' ? 'good' : r.overdueDays >= 7 ? 'crit' : r.overdueDays > 0 ? 'serious' : 'warn';
  const phrase = r => {
    if(r.state === 'overdue') return r.overdueDays === 1 ? '1 day overdue' : `${r.overdueDays} days overdue`;
    if(r.state === 'due') return 'due today';
    return r.inDays === 1 ? 'due tomorrow' : `due in ${r.inDays} days`;
  };
  return { status, summary, queue, sev, phrase, lastDate };
})();

/* --- the markers a client is allowed to log for themselves --- */
function selfLogMarkers(c){
  const g = programOf(c);
  if(!g) return [];
  const keys = [];
  for(const it of g.schedule || []) if(it.kind === 'log' && it.selfLog)
    for(const m of it.markers) if(R[m] && !keys.includes(m)) keys.push(m);
  return keys;
}
function allLogMarkers(c){
  const g = programOf(c);
  const keys = [];
  for(const it of (g && g.schedule) || []) if(it.kind === 'log')
    for(const m of it.markers) if(R[m] && !keys.includes(m)) keys.push(m);
  for(const k of ['sbp','dbp','steps','sleep_hours']) if(!keys.includes(k)) keys.push(k);
  return keys;
}

/* =========================================================================
   DUE — the reminder queue, and the cards that carry it
   ========================================================================= */
function dueBadge(c){
  const s = SCHEDULE.summary(c);
  if(!s.total) return '';
  if(s.overdue) return `<span class="pill crit">${s.overdue} overdue</span>`;
  if(s.due)     return `<span class="pill warn">${s.due} due today</span>`;
  return `<span class="pill good">up to date</span>`;
}

function scheduleRows(c, rows){
  return rows.map(r => {
    const sv = SCHEDULE.sev(r);
    return `<div class="duerow">
      <span class="dot" style="background:var(--${sv})"></span>
      <span class="dn"><b>${esc(r.item.label)}</b>
        <span>${esc((FREQ[r.item.freq]||{}).label||r.item.freq)}${r.item.note?' · '+esc(r.item.note):''}</span></span>
      <span class="dl tiny muted num">${r.last ? 'last ' + fmtDate(r.last) : 'not yet recorded'}</span>
      <span class="pill ${sv}">${SCHEDULE.phrase(r)}</span>
    </div>`;
  }).join('');
}

function scheduleCard(c, opts){
  const s = SCHEDULE.summary(c);
  const staff = opts && opts.staff;
  if(!s.total) return staff
    ? `<div class="banner info"><span>This client's programme has no schedule set. Add tests and daily tracking to it on the <b>Programmes</b> tab and everyone starts getting reminded.</span></div>`
    : '';
  const head = s.overdue ? `<span class="pill crit">${s.overdue} overdue</span>`
             : s.due     ? `<span class="pill warn">${s.due} due today</span>`
                         : `<span class="pill good">Everything up to date</span>`;
  return `<div class="card">
    <div class="pad" style="padding-bottom:9px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap">
      <div><h3 style="font-size:14.5px">${staff ? 'Schedule &amp; reminders' : "What's due"}</h3>
        <p class="tiny muted" style="margin-top:2px">${staff
          ? 'From the programme. Reports count when they are saved; daily items count when a check-in is logged.'
          : 'Your programme sets these. Keep them current and every chart you see stays honest.'}</p></div>
      ${head}
    </div>
    <div class="duelist">${scheduleRows(c, s.rows)}</div>
  </div>`;
}

function viewDue(){
  const q = SCHEDULE.queue();
  const filt = UI.dueFilter || 'all';
  const rows = filt === 'overdue' ? q.filter(r => r.state === 'overdue') : q;
  const overdue = q.filter(r => r.state === 'overdue').length;
  const clients = new Set(q.map(r => r.c.id)).size;
  return `<div class="sect" style="margin-top:4px"><h2>Due</h2><div class="rule"></div>
      <span class="tiny muted">${overdue} overdue across ${clients} client${clients===1?'':'s'}</span></div>
    <div class="banner info" style="margin-bottom:14px"><span>Everything a client owes right now, worst first. Reports clear when a clinician saves one; daily items clear when a check-in is logged. This prototype shows the queue in the app — in production the same list drives the email, push or WhatsApp reminder that goes out to the client and to whoever runs their programme.</span></div>
    <div class="chips" style="margin-bottom:12px">
      <button class="chip" data-due="all" aria-pressed="${filt==='all'}">Everything due (${q.length})</button>
      <button class="chip" data-due="overdue" aria-pressed="${filt==='overdue'}">Overdue only (${overdue})</button>
    </div>
    ${rows.length ? `<div class="card">${rows.map(r=>{
      const sv = SCHEDULE.sev(r);
      return `<div class="duerow">
        <span class="dot" style="background:var(--${sv})"></span>
        <span class="dn"><b>${esc(r.c.name)}</b><span>${esc(r.item.label)} · ${esc((FREQ[r.item.freq]||{}).label||'')}${r.item.kind==='log'?' · self-logged':''}</span></span>
        <span class="dl tiny muted num">${r.last ? 'last ' + fmtDate(r.last) : 'never recorded'}</span>
        <span class="pill ${sv}">${SCHEDULE.phrase(r)}</span>
        <button class="btn btn-sm" data-open="${r.c.id}" data-tab="${r.item.kind==='log'?'coaching':'reports'}">
          ${r.item.kind==='log'?'Log it':'Add report'}</button>
      </div>`;}).join('')}</div>`
     : `<div class="card empty"><h3>Nothing ${filt==='overdue'?'overdue':'due'}</h3>
        <p class="tiny">Every client on a programme with a schedule is current.</p></div>`}`;
}

/* =========================================================================
   DAILY LOG
   ========================================================================= */
function logCard(c, opts){
  const staff = opts && opts.staff;
  const keys = staff ? allLogMarkers(c) : selfLogMarkers(c);
  const logs = (c.checkins || []).slice().sort((a,b)=> b.date.localeCompare(a.date));
  const today = todayISO();
  const todays = logs.find(k => k.date === today);
  const canLog = staff ? can('coach') : keys.length > 0;
  const cols = keys.filter(k => R[k]);

  return `<div class="card">
    <div class="pad" style="padding-bottom:9px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap">
      <div><h3 style="font-size:14.5px">${staff ? 'Daily log' : "Today's check-in"}</h3>
        <p class="tiny muted" style="margin-top:2px">${todays
          ? `Logged for today by ${esc(todays.byName)}${todays.self?'':' (clinic)'} — saving again replaces it.`
          : staff ? 'Self-reported readings. These are not clinical reports and never enter the trend charts.'
                  : 'A minute a day. These are your own readings, kept separate from your clinic reports.'}</p></div>
      ${todays ? '<span class="pill good">Done today</span>' : '<span class="pill warn">Not logged today</span>'}
    </div>
    ${canLog && cols.length ? `<div class="pad" style="padding-top:0">
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:11px">
        ${cols.map(k=>`<label class="f"><span class="tiny muted">${esc(R[k].short)} <span style="color:var(--ink-3)">${esc(R[k].unit)}</span></span>
          <input class="logIn num" data-k="${k}" inputmode="decimal" value="${todays && todays.values[k]!=null ? todays.values[k] : ''}" placeholder="—"></label>`).join('')}
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <label class="f" style="width:auto"><span class="tiny muted">Date</span>
          <input type="date" id="logDate" value="${today}" max="${today}" style="width:auto"></label>
        <button class="btn btn-p" id="logSave" style="margin-left:auto;align-self:flex-end">Save check-in</button>
      </div>
    </div>` : (cols.length ? '' : `<div class="pad" style="padding-top:0"><p class="tiny muted">Nothing is set up for daily tracking on this programme.</p></div>`)}
    ${logs.length ? `<div class="scrollx" style="border-top:1px solid var(--line)">
      <table><thead><tr><th style="padding-left:20px">Date</th>
        ${cols.map(k=>`<th class="num">${esc(R[k].short)}</th>`).join('')}
        <th>Logged by</th>${staff && can('delete_note') ? '<th></th>' : ''}</tr></thead>
      <tbody>${logs.slice(0,14).map(k=>`<tr>
        <td class="num" style="padding-left:20px">${fmtDate(k.date)}</td>
        ${cols.map(m=>`<td class="num">${k.values[m] != null ? fmtV(R[m], k.values[m]) : '<span style="color:var(--ink-3)">—</span>'}</td>`).join('')}
        <td class="tiny muted">${esc(k.byName)}${k.self?'':' · clinic'}</td>
        ${staff && can('delete_note') ? `<td style="text-align:right"><button class="btn btn-sm delLog" data-id="${k.id}" style="color:var(--crit-ink)">×</button></td>` : ''}
      </tr>`).join('')}</tbody></table></div>` : ''}
  </div>`;
}

function wireLog(c){
  const sv = $('#logSave');
  if(sv) sv.onclick = () => {
    const date = $('#logDate').value || todayISO();
    const values = {};
    document.querySelectorAll('.logIn').forEach(i => {
      const v = parseFloat(i.value);
      if(!isFinite(v)) return;
      const m = R[i.dataset.k];
      if(m && (v < m.sane[0] || v > m.sane[1])){ i.dataset.bad = '1'; return; }
      values[i.dataset.k] = v;
    });
    const bad = document.querySelector('.logIn[data-bad="1"]');
    if(bad){ toast(`${R[bad.dataset.k].short} ${bad.value} is outside the plausible range`); delete bad.dataset.bad; return; }
    if(!Object.keys(values).length){ toast('Enter at least one reading'); return; }
    c.checkins = c.checkins || [];
    c.messages = c.messages || [];
    if(c.assistantId === undefined) c.assistantId = null;
    const existing = c.checkins.find(k => k.date === date);
    if(existing){
      Object.assign(existing.values, values);
      existing.byName = me().name; existing.self = me().kind === 'client'; existing.at = nowISO();
    } else {
      c.checkins.push({ id:uid('k'), date, values, byName:me().name, self:me().kind === 'client', at:nowISO() });
    }
    logAudit('checkin', `${existing?'Updated':'Logged'} the ${fmtDate(date)} check-in`, c.id);
    save('Check-in saved'); render();
  };
  document.querySelectorAll('.delLog').forEach(b => b.onclick = () => {
    c.checkins = c.checkins.filter(k => k.id !== b.dataset.id);
    logAudit('checkin_delete', 'Deleted a daily check-in', c.id);
    save('Check-in deleted'); render();
  });
}

}
