name: One-time login screen cleanup

'on':
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch production login screen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')

          s = s.replace(
              ": 'Clinic staff and clients sign in here. Clients see only their own reports and files.'}",
              ": ''}"
          )

          s = re.sub(
              r'''\s*\$\{creating \? '' : `<p class="tiny muted" style="margin-top:14px;line-height:1\.5">\s*First time here\? Enter your registered email and we will ask you to choose a password\.?</p>`\}''',
              '',
              s,
              flags=re.S,
          )
          index.write_text(s, encoding='utf-8')

          bridge = Path('supabase-bridge.js')
          b = bridge.read_text(encoding='utf-8')

          b = b.replace(
              '.demoacc{display:none!important}\n      .authbody::after{display:none!important}',
              '.demoacc{display:none!important}\n      .authbody::after{display:none!important}\n      .authbody .sub:empty{display:none!important}'
          )

          marker = '''  function cleanLoginCopy() {'''
          observer = '''  function observeLoginCopy() {
    const observer = new MutationObserver(() => cleanLoginCopy());
    observer.observe(document.body, {childList:true, subtree:true});
  }

'''
          if 'function observeLoginCopy()' not in b and marker in b:
              b = b.replace(marker, observer + marker, 1)

          b = b.replace('    cleanLoginCopy();\n  }', '    cleanLoginCopy();\n    observeLoginCopy();\n  }', 1)
          bridge.write_text(b, encoding='utf-8')
          PY

      - name: Commit changes and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-login-copy.yml
          git add index.html supabase-bridge.js .github/workflows/fix-login-copy.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix production login screen"
            git push
          fi
