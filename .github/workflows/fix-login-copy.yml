name: One-time login screen cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove prototype login banners
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          original = s

          s = s.replace(
              ": 'Clinic staff and clients sign in here. Clients see only their own reports and files.'}",
              ": ''}"
          )

          s = re.sub(
              r'\s*\$\{creating \? \'\' : `<p class="tiny muted" style="margin-top:14px;line-height:1\.5">\s*First time here\? Enter your registered email and we will ask you to choose a password\.?</p>`\}',
              '',
              s,
              flags=re.S,
          )

          index.write_text(s, encoding='utf-8')

          bridge = Path('supabase-bridge.js')
          b = bridge.read_text(encoding='utf-8')
          b_original = b

          b = b.replace(
              '.demoacc{display:none!important}\n      .authbody::after{display:none!important}',
              '.demoacc{display:none!important}\n      .authbody::after{display:none!important}\n      .authbody .sub:empty{display:none!important}'
          )

          old = '''  function cleanLoginCopy() {
    document.querySelectorAll('.authbody p, .authbody div').forEach(node => {
      const text = (node.textContent || '').replace(/\\s+/g, ' ').trim();
      if (/^Clinic staff and clients sign in here\\./i.test(text) ||
          /^First time here\\?/i.test(text) ||
          /^PROTOTYPE\\s*[—-]\\s*ACCOUNTS IN THIS DEMO$/i.test(text)) node.remove();
    });
  }'''

          new = '''  function cleanLoginCopy() {
    document.querySelectorAll('.authbody p, .authbody div').forEach(node => {
      const text = (node.textContent || '').replace(/\\s+/g, ' ').trim();
      if (/^Clinic staff and clients sign in here\\./i.test(text) ||
          /^First time here\\?/i.test(text) ||
          /^PROTOTYPE\\s*[—-]\\s*ACCOUNTS IN THIS DEMO$/i.test(text)) node.remove();
    });
  }

  function observeLoginCopy() {
    const observer = new MutationObserver(() => cleanLoginCopy());
    observer.observe(document.body, {childList:true, subtree:true});
  }'''

          if old in b:
              b = b.replace(old, new)
          else:
              raise SystemExit('Expected cleanLoginCopy block was not found')

          b = b.replace(
              '    cleanLoginCopy();\n  }',
              '    cleanLoginCopy();\n    observeLoginCopy();\n  }'
          )

          bridge.write_text(b, encoding='utf-8')

          if s == original and b == b_original:
              raise SystemExit('No changes were made; expected login copy was not found')

      - name: Commit cleanup and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-login-copy.yml
          git add index.html supabase-bridge.js .github/workflows/fix-login-copy.yml
          git commit -m "Fix production login screen copy"
          git push
