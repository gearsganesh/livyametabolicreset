name: Apply Supabase bridge

on:
  push:
    branches: [supabase-backend]

permissions:
  contents: write

jobs:
  patch-index:
    if: contains(github.event.head_commit.message, '[apply-supabase-bridge]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch prototype entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="supabase-bridge.js"></script>'
          if marker not in text:
              injection = (
                  '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n'
                  '<script src="supabase-config.js"></script>\n'
                  f'{marker}\n'
              )
              text = text.replace('</head>', injection + '</head>', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched entrypoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git commit -m 'chore: enable Supabase bridge in Metabolic frontend'
          git push
