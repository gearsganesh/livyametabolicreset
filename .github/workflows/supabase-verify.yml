name: Supabase production verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate migration filenames
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            base="$(basename "$file")"
            [[ "$base" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]] || { echo "Invalid migration filename: $base"; exit 1; }
          done
      - name: Verify expected migrations
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260828000001_bootstrap_admin_profiles.sql
          test -f supabase/migrations/20260828000002_production_rls.sql
          test -f supabase/migrations/20260828000003_messages.sql
          test -f supabase/migrations/20260828000004_recipe_share_policy_fix.sql
          test -f supabase/migrations/20260828000005_storage_rls.sql
          test -f supabase/migrations/20260828000006_message_read_receipts.sql
          test -f supabase/migrations/20260828000007_conversation_rls.sql
          test -f supabase/migrations/20260828000008_rbac_staff_permissions.sql
      - name: Check migration status against production
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" || -z "${SUPABASE_PROJECT_REF:-}" ]]; then
            echo "Supabase production secrets are not configured; local migration validation completed."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list
